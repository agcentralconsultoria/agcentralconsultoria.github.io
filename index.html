  function agendaCaptacaoHtml(){
    var todos = agendaCaptacaoItens();
    var todosComunidade = (state.captacao && state.captacao.comunidade)
      ? state.captacao.comunidade.filter(function(it){ return !it.concluido && it.data; })
      : [];
    todosComunidade.forEach(function(it){ it.diff = diasParaVencer(it.data); });
    if(!todos.length && !todosComunidade.length){
      return '<div class="empty-state">Nada pendente na captação. Aplique uma jornada num lead pra começar. 🎉</div>';
    }
    var blocos = AGENDA_FAIXAS.map(function(faixa){
      if(faixa.key === 'proximos' && !state.agendaMostrarProximos) return '';
      var daFaixa = todos.filter(function(it){ return faixa.teste(it.diff); });
      if(!daFaixa.length) return '';
      // agrupa por pessoa, mantendo a ordem de urgencia dentro de cada grupo
      var porPessoa = {}, ordem = [];
      daFaixa.sort(function(a,b){ return a.diff - b.diff; }).forEach(function(it){
        if(!porPessoa[it.pessoaId]){ porPessoa[it.pessoaId] = []; ordem.push(it); }
        porPessoa[it.pessoaId].push(it);
      });
      var grupos = ordem.map(function(primeiro){
        return agendaGrupoPessoaHtml(primeiro.pessoaId, primeiro.pessoaNome, primeiro.origemIco, primeiro.abrirAttr, porPessoa[primeiro.pessoaId]);
      }).join('');
      return ''+
        '<div class="agenda-faixa">'+
          '<div class="agenda-faixa-titulo">'+
            '<span class="badge '+faixa.cls+'">'+esc(faixa.label)+'</span>'+
            '<span class="cell-muted" style="font-size:12.5px;">'+daFaixa.length+' '+(daFaixa.length===1?'ação':'ações')+'</span>'+
          '</div>'+
          grupos+
        '</div>';
    }).join('');
    var blocosComunidade = AGENDA_FAIXAS.map(function(faixa){
      if(faixa.key === 'proximos' && !state.agendaMostrarProximos) return '';
      var daFaixa = todosComunidade.filter(function(it){ return faixa.teste(it.diff); }).sort(function(a,b){ return a.diff-b.diff; });
      if(!daFaixa.length) return '';
      return ''+

  function bindAgendaCaptacaoEvents(){
    var root = document.getElementById('agendaCaptacaoRoot');
    if(!root) return;
    root.querySelectorAll('[data-agenda-done]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var parts = this.getAttribute('data-agenda-done').split(':');
        if(parts[0] === 'lead'){
          var l = getLead(parseInt(parts[1],10));
          if(!l || !l.jornada) return;
          var t = l.jornada.tarefas.filter(function(x){ return x.id === parseInt(parts[2],10); })[0];
          if(!t) return;
          // e o MESMO objeto que o lead usa — muda aqui, muda em todo lugar
          t.concluido = true;
          t.dataConclusao = todayISODate();
          saveCaptacao();
        } else if(parts[0] === 'parceria'){
          var pa = getParceria(parseInt(parts[1],10));
          if(!pa || !pa.jornada) return;
          var tp = pa.jornada.tarefas.filter(function(x){ return x.id === parseInt(parts[2],10); })[0];
          if(!tp) return;
          tp.concluido = true;
          tp.dataConclusao = todayISODate();
          saveCaptacao();
        }
        refreshAgendaCaptacao();
        showToast('Ação concluída.', 'success');
      });
    });
    root.querySelectorAll('[data-agenda-pessoa-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = this.getAttribute('data-agenda-pessoa-toggle');
        state.agendaCollapsedPessoas[id] = !state.agendaCollapsedPessoas[id];
        refreshAgendaCaptacao();
      });
    });
    root.querySelectorAll('[data-agenda-abrir-lead]').forEach(function(btn){

        state.agendaMostrarProximos = !state.agendaMostrarProximos;

      });
    });
    root.querySelectorAll('[data-lm-acao-nome]').forEach(function(el){
      el.addEventListener('blur', function(){
        var m = modeloDe(this); if(!m) return;
        m.acoes[parseInt(this.getAttribute('data-lm-acao-nome'),10)].nome = this.value.trim() || 'Sem nome';
        saveCaptacaoTemplates();
      });
    });
    root.querySelectorAll('[data-lm-acao-dia]').forEach(function(el){
      el.addEventListener('change', function(){
        var m = modeloDe(this); if(!m) return;
        var v = parseInt(this.value,10);
        m.acoes[parseInt(this.getAttribute('data-lm-acao-dia'),10)].dia = isNaN(v) || v < 0 ? 0 : v;
        saveCaptacaoTemplates();
      });
    });
    root.querySelectorAll('[data-lm-acao-canal]').forEach(function(el){
      el.addEventListener('change', function(){
        var m = modeloDe(this); if(!m) return;
        m.acoes[parseInt(this.getAttribute('data-lm-acao-canal'),10)].canal = this.value;
        saveCaptacaoTemplates();
      });
    });
    root.querySelectorAll('[data-lm-acao-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var m = modeloDe(this); if(!m) return;
        m.acoes.splice(parseInt(this.getAttribute('data-lm-acao-remove'),10), 1);
        saveCaptacaoTemplates();
        refreshLeadModelos();
      });
    });
    root.querySelectorAll('[data-lm-acao-add]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var m = getLeadTemplate(this.getAttribute('data-lm-acao-add')); if(!m) return;
        var ultimoDia = m.acoes.length ? (m.acoes[m.acoes.length-1].dia || 0) : 0;
        m.acoes.push({ nome:'Nova ação', dia: ultimoDia, canal:'whatsapp' });
        saveCaptacaoTemplates();
        refreshLeadModelos();
      });
    });
    root.querySelectorAll('[data-lm-duplicar]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var m = getLeadTemplate(this.getAttribute('data-lm-duplicar')); if(!m) return;
        var copia = { id: nextLeadModeloId(), nome: m.nome + ' (cópia)', isDefault: false,
                      acoes: JSON.parse(JSON.stringify(m.acoes)) };
        state.captacaoTemplates.lead.push(copia);
        state.leadModeloAberto[copia.id] = true;
        saveCaptacaoTemplates();
        refreshLeadModelos();
        showToast('Modelo duplicado.', 'success');
      });
    });
    root.querySelectorAll('[data-lm-remover]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = this.getAttribute('data-lm-remover');
        var m = getLeadTemplate(id); if(!m) return;
        if(!confirm('Excluir o modelo "'+m.nome+'"? Os leads que já receberam essa jornada não são afetados.')) return;
        state.captacaoTemplates.lead = state.captacaoTemplates.lead.filter(function(x){ return x.id !== id; });
        saveCaptacaoTemplates();
        refreshLeadModelos();
        showToast('Modelo excluído.', 'success');
      });
    });
    var novoBtn = document.getElementById('leadModeloNovoBtn');
    if(novoBtn){
      novoBtn.addEventListener('click', function(){
        var novo = { id: nextLeadModeloId(), nome:'Novo modelo', isDefault:false,
                     acoes:[{ nome:'Primeiro contato', dia:0, canal:'whatsapp' }] };
        state.captacaoTemplates.lead.push(novo);
        state.leadModeloAberto[novo.id] = true;
        saveCaptacaoTemplates();
        refreshLeadModelos();
      });
    }
  }

  function leadJornadaSectionHtml(l){

      ? tarefas.map(function(t){ return leadTarefaRowHtml(l, t); }).join('')

        var modeloId = document.getElementById('leadJornadaModelo').value;

        saveCaptacao();

      });
    }
    var remover = document.getElementById('leadJornadaRemoverBtn');
    if(remover){
      remover.addEventListener('click', function(){
        if(!confirm('Remover a jornada deste lead? As ações serão apagadas. Essa ação não pode ser desfeita.')) return;
        delete l.jornada;
        saveCaptacao();
        refreshLeadModalJornada();
        showToast('Jornada removida.', 'success');
      });
    }
    var addBtn = document.getElementById('leadTaskAddBtn');
    if(addBtn){
      addBtn.addEventListener('click', function(){
        var novoId = nextLeadTaskId(l);
        var maxOrdem = l.jornada.tarefas.reduce(function(m,t){ return Math.max(m, t.ordem||0); }, -1);
        l.jornada.tarefas.push({ id:novoId, nome:'Nova ação', canal:'whatsapp', dataAlvo:null,
                                 concluido:false, dataConclusao:null, observacao:'', arquivado:false, ordem:maxOrdem+1 });
        state.leadJornadaExpanded[l.id+':'+novoId] = true;
        saveCaptacao();
        refreshLeadModalJornada();

    var root = document.getElementById('leadTarefasRoot');
    if(!root) return;
    function tarefaDe(el, attr){
      var tid = parseInt(el.getAttribute(attr),10);
      return l.jornada.tarefas.filter(function(t){ return t.id === tid; })[0];
    }
    root.querySelectorAll('[data-lead-task-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        var tid = this.getAttribute('data-lead-task-toggle');

        refreshLeadModalJornada();

    });
    root.querySelectorAll('[data-lead-task-done]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var t = tarefaDe(this, 'data-lead-task-done');
        if(!t) return;
        t.concluido = this.checked;
        t.dataConclusao = this.checked ? todayISODate() : null;
        saveCaptacao();
        refreshLeadModalJornada();
      });
    });
    root.querySelectorAll('[data-lead-task-nome]').forEach(function(el){
      el.addEventListener('blur', function(){
        var t = tarefaDe(this, 'data-lead-task-nome');
        if(t){ t.nome = this.value.trim() || 'Sem nome'; saveCaptacao(); }
      });
    });
    root.querySelectorAll('[data-lead-task-data]').forEach(function(el){
      el.addEventListener('change', function(){
        var t = tarefaDe(this, 'data-lead-task-data');
        if(t){ t.dataAlvo = this.value || null; saveCaptacao(); refreshLeadModalJornada(); }
      });
    });
    root.querySelectorAll('[data-lead-task-canal]').forEach(function(el){
      el.addEventListener('change', function(){
        var t = tarefaDe(this, 'data-lead-task-canal');
        if(t){ t.canal = this.value; saveCaptacao(); refreshLeadModalJornada(); }
      });
    });
    root.querySelectorAll('[data-lead-task-obs]').forEach(function(el){
      el.addEventListener('blur', function(){
        var t = tarefaDe(this, 'data-lead-task-obs');
        if(t){ t.observacao = this.value.trim(); saveCaptacao(); }
      });
    });
    root.querySelectorAll('[data-lead-task-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var tid = parseInt(this.getAttribute('data-lead-task-remove'),10);
        if(!confirm('Excluir esta ação? Essa ação não pode ser desfeita.')) return;
        l.jornada.tarefas = l.jornada.tarefas.filter(function(t){ return t.id !== tid; });
        saveCaptacao();
        refreshLeadModalJornada();

  function bindLeadModalEvents(){
    var novo = state.leadEditId === null;
    // rascunho local pras escolhas de botao (temperatura/etiquetas) antes de salvar
    var base = novo ? { temperatura:'Morno', etiquetas:[] } : getLead(state.leadEditId);
    var draft = { temperatura: base.temperatura || 'Morno', etiquetas: (base.etiquetas||[]).slice() };
    // a jornada grava direto no lead (nao passa pelo Salvar), entao so existe em lead ja criado
    if(!novo) bindLeadJornadaEvents(base);
    var toggleRoot = document.getElementById('leadTempToggle');
    if(toggleRoot){
      toggleRoot.querySelectorAll('[data-lead-temp]').forEach(function(btn){
        btn.addEventListener('click', function(){
          draft.temperatura = this.getAttribute('data-lead-temp');
          toggleRoot.querySelectorAll('[data-lead-temp]').forEach(function(b){
            b.classList.toggle('active', b.getAttribute('data-lead-temp') === draft.temperatura);
          });
        });
      });
    }
    function bindEtiquetas(){
      var picker = document.getElementById('leadEtiquetaPicker');
      if(!picker) return;
      picker.querySelectorAll('[data-lead-etiqueta]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var t = this.getAttribute('data-lead-etiqueta');
          var i = draft.etiquetas.indexOf(t);
          if(i === -1) draft.etiquetas.push(t); else draft.etiquetas.splice(i,1);
          this.classList.toggle('active', i === -1);
        });
      });
    }
    bindEtiquetas();
    var addEtBtn = document.getElementById('leadAddEtiquetaBtn');
    if(addEtBtn){
      addEtBtn.addEventListener('click', function(){
        var inp = document.getElementById('l_novaEtiqueta');
        var nova = inp.value.trim();
        if(!nova) return;
        if(state.captacao.etiquetas.indexOf(nova) === -1){
          state.captacao.etiquetas.push(nova);
          saveCaptacao();
        }
        if(draft.etiquetas.indexOf(nova) === -1) draft.etiquetas.push(nova);
        inp.value = '';
        // redesenha so o seletor de etiquetas, mantendo o resto do formulario
        var picker = document.getElementById('leadEtiquetaPicker');
        picker.innerHTML = state.captacao.etiquetas.map(function(t){
          var on = draft.etiquetas.indexOf(t) !== -1;
          return '<button type="button" class="etiqueta-btn'+(on?' active':'')+'" data-lead-etiqueta="'+esc(t)+'">'+esc(t)+'</button>';
        }).join('');
        bindEtiquetas();
      });
    }
    var irPac = document.getElementById('leadIrPacienteBtn');
    if(irPac){
      irPac.addEventListener('click', function(){
        var pid = getLead(state.leadEditId).pacienteId;
        closeModal();
        state.tab = 'pacientes';
        render();
        openProfile(pid);
      });
    }
    document.getElementById('leadCancelBtn').addEventListener('click', closeModal);
    var rmBtn = document.getElementById('leadRemoveBtn');
    if(rmBtn){
      rmBtn.addEventListener('click', function(){
        if(!confirm('Excluir esse lead? Essa ação não pode ser desfeita.')) return;
        state.captacao.leads = state.captacao.leads.filter(function(x){ return x.id !== state.leadEditId; });
        saveCaptacao();
        closeModal();
        render();
        showToast('Lead excluído.', 'success');
      });
    }
    document.getElementById('leadSaveBtn').addEventListener('click', function(){
      var nome = document.getElementById('l_nome').value.trim();
      if(!nome){ alert('O campo Nome é obrigatório.'); return; }
      var etapaNova = document.getElementById('l_etapa').value;
      var dados = {
        nome: nome,
        whatsapp: document.getElementById('l_whatsapp').value.trim(),
        instagram: document.getElementById('l_instagram').value.trim(),
        origem: document.getElementById('l_origem').value,
        indicadoPor: document.getElementById('l_indicadoPor').value.trim(),
        observacoes: document.getElementById('l_observacoes').value.trim(),
        temperatura: draft.temperatura,
        etiquetas: draft.etiquetas
      };
      var lead, fechouAgora = false;
      if(novo){
        lead = Object.assign({
          id: nextLeadId(), etapa: etapaNova, ordem: 0,
          criadoEm: todayISODate(), mesFinalizado: null, pacienteId: null
        }, dados);
        if(etapaEhFinal(etapaNova)){ lead.mesFinalizado = state.competencia; lead.dataFinalizado = todayISODate(); }
        state.captacao.leads.push(lead);
        fechouAgora = etapaNova === 'fechado';
      } else {
        lead = getLead(state.leadEditId);
        var etapaAntiga = lead.etapa;
        Object.assign(lead, dados);
        if(etapaNova !== etapaAntiga){
          lead.etapa = etapaNova;
          if(etapaEhFinal(etapaNova)){ lead.mesFinalizado = state.competencia; lead.dataFinalizado = todayISODate(); }
          else { lead.mesFinalizado = null; lead.dataFinalizado = null; }
          fechouAgora = etapaNova === 'fechado';
        }
      }
      saveCaptacao();
      var conversao = fechouAgora ? converterIndicacaoDoLead(lead.id) : null;
      var precisaPaciente = fechouAgora && !lead.pacienteId;
      closeModal();
      render();
      if(conversao) avisarConversaoDeIndicacao(conversao);
      if(precisaPaciente) criarPacienteDoLead(lead);
      else if(!conversao) showToast(novo ? 'Lead criado.' : 'Lead atualizado.', 'success');
    });
  }

    var diffText = t.concluido ? 'Concluído' : diff === null ? 'Sem data' : diff < 0 ? 'Atrasado ('+Math.abs(diff)+'d)' : diff === 0 ? 'Hoje' : 'Em '+diff+' dias';

    root.querySelectorAll('[data-parc-task-toggle]').forEach(function(el){

    root.querySelectorAll('[data-parc-task-nome]').forEach(function(el){

    root.querySelectorAll('[data-parc-task-data]').forEach(function(el){
      el.addEventListener('change', function(){

    root.querySelectorAll('[data-parc-task-canal]').forEach(function(el){

    root.querySelectorAll('[data-parc-task-obs]').forEach(function(el){
      el.addEventListener('blur', function(){

    root.querySelectorAll('[data-parc-task-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){

  /* ================= DASHBOARD ================= */
  function computeKPIs(){
    var today = new Date();
    today.setHours(0,0,0,0);
    var ativos = 0, vencendo = 0, consultaProximo = 0;
    state.patients.forEach(function(p){
      if(renovacaoStatus(p) !== 'Vencido') ativos++;
      if(consultaStatus(p) === 'proximo') consultaProximo++;
      if(p.vencimento){
        var v = new Date(p.vencimento + 'T00:00:00');
        var diff = Math.ceil((v - today) / 86400000);
        if(diff >= 0 && diff <= 15) vencendo++;
      }
    });
    return { ativos: ativos, vencendo: vencendo, consultaProximo: consultaProximo };
  }
  function ultimosPacientes(){
    var today = new Date();
    today.setHours(0,0,0,0);
    return state.patients.filter(function(p){
      if(renovacaoStatus(p) === 'Vencido') return false;
      if(p.prioridade === 'Modo Bebezinho') return true;
      if(!p.createdDate) return false;
      var created = new Date(p.createdDate + 'T00:00:00');
      var diffDays = Math.floor((today - created) / 86400000);
      return diffDays <= 30;
    }).sort(function(a,b){ return b.createdAt - a.createdAt; });
  }

  function dashboardFilterPatients(key){
    var today = new Date();
    today.setHours(0,0,0,0);
    var list = state.patients.filter(function(p){
      if(key === 'ativos') return renovacaoStatus(p) !== 'Vencido';
      if(key === 'vencendo'){
        if(!p.vencimento) return false;
        var v = new Date(p.vencimento + 'T00:00:00');
        var diff = Math.ceil((v - today) / 86400000);
        return diff >= 0 && diff <= 15;
      }
      if(key === 'consulta') return consultaStatus(p) === 'proximo';
      if(key === 'inativos') return renovacaoStatus(p) === 'Vencido';
      if(key === 'renovacaoAntecipada') return renovacaoStatus(p) === 'Renovação antecipada';
      if(key === 'renovacaoProxima') return renovacaoStatus(p) === 'Renovação próxima';
      return false;
    });
    return list.sort(function(a,b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
  }

  function pacientesEmRisco(monthKey){
    return state.patients.filter(function(p){ return renovacaoStatus(p) !== 'Vencido' && engagementRisk(p, monthKey).atRisk; })
      .sort(function(a,b){
        var ra = engagementRisk(a, monthKey).avg, rb = engagementRisk(b, monthKey).avg;
        if(ra === null) return -1;
        if(rb === null) return 1;
        return ra - rb;
      });
  }
  var MONTH_ABBR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  function monthShortLabel(key){
    var p = parseMonthKey(key);
    return MONTH_ABBR[p.month] + '/' + String(p.year).slice(2);
  }
  function lastNMonths(n){
    var result = [];
    var base = new Date();
    base.setDate(1);
    for(var i=n-1;i>=0;i--){
      var dt = new Date(base.getFullYear(), base.getMonth()-i, 1);
      result.push(monthKeyOf(dt));
    }
    return result;
  }
  function monthlyEngagementAvg(monthKey){
    var vals = [];
    state.patients.forEach(function(p){
      if(renovacaoStatus(p) === 'Vencido') return;
      getMonthData(p, monthKey).engajamento.forEach(function(v){ if(v !== null && v !== undefined) vals.push(v); });
    });
    if(!vals.length) return null;
    return vals.reduce(function(a,b){ return a+b; }, 0) / vals.length;
  }
  function monthlyCheckinPct(monthKey){
    var sim = 0, nao = 0;
    state.patients.forEach(function(p){
      if(renovacaoStatus(p) === 'Vencido') return;
      getMonthData(p, monthKey).checkin.forEach(function(v){ if(v === true) sim++; else if(v === false) nao++; });
    });
    var total = sim + nao;
    if(!total) return null;
    return Math.round((sim/total)*100);
  }
  function monthlyRiscoCount(monthKey){
    return pacientesEmRisco(monthKey).length;
  }
  function monthlyNovosCount(monthKey){
    return state.patients.filter(function(p){ return p.isNovoPaciente !== false && p.createdDate && p.createdDate.slice(0,7) === monthKey; }).length;
  }
  function monthlyTrendChartHtml(metricKey, months, valueFn, formatFn, colorClass){
    var points = months.map(function(k){ return { key: k, value: valueFn(k) }; });
    var max = Math.max.apply(null, points.map(function(p){ return p.value || 0; }).concat([1]));
    var currentMonth = getCurrentMonthKey();
    var drill = state.dashboardTrendDrill;
    return '<div class="monthly-trend-chart">'+points.map(function(p){
      var pct = p.value ? Math.max(Math.round((p.value/max)*100), 4) : 0;
      var label = (p.value === null || p.value === undefined) ? '—' : formatFn(p.value);
      var isCurrent = p.key === currentMonth;
      var isSelected = drill && drill.metric === metricKey && drill.monthKey === p.key;
      return ''+
        '<button type="button" class="monthly-trend-col'+(isSelected?' selected':'')+'" data-trend-drill-metric="'+metricKey+'" data-trend-drill-month="'+p.key+'" title="'+esc(monthLabel(p.key))+': '+esc(label)+'">'+
          '<div class="monthly-trend-value">'+label+'</div>'+
          '<div class="monthly-trend-track"><div class="monthly-trend-fill '+colorClass+(isCurrent?' current':'')+'" style="height:'+pct+'%;"></div></div>'+
          '<div class="monthly-trend-label">'+monthShortLabel(p.key)+'</div>'+
        '</button>';
    }).join('')+'</div>';
  }
  function trendDrillRowsHtml(metric, monthKey){
    if(metric === 'risco'){
      var riscoList = pacientesEmRisco(monthKey);
      if(!riscoList.length) return '<div class="empty-state">Nenhum paciente em risco nesse mês.</div>';
      return '<table><thead><tr><th>Nome</th><th>Engajamento Médio</th><th>Check-ins</th><th>Prioridade</th></tr></thead><tbody>'+
        riscoList.map(function(p){
          var r = engagementRisk(p, monthKey);
          var avgText = r.avg === null ? '—' : r.avg.toFixed(1);
          return '<tr><td><button class="link-btn" data-open-profile="'+p.id+'">'+esc(p.nome)+'</button></td><td><span class="badge '+avgBadgeClass(r.avg)+'">'+avgText+'</span></td><td>'+r.sent+'/'+r.total+' enviados</td><td>'+priorityBadge(p.prioridade)+'</td></tr>';
        }).join('')+'</tbody></table>';
    }
    if(metric === 'novos'){
      var novosList = state.patients.filter(function(p){ return p.isNovoPaciente !== false && p.createdDate && p.createdDate.slice(0,7) === monthKey; });
      if(!novosList.length) return '<div class="empty-state">Nenhum paciente novo nesse mês.</div>';
      return '<table><thead><tr><th>Nome</th><th>Data de Cadastro</th></tr></thead><tbody>'+
        novosList.map(function(p){ return '<tr><td><button class="link-btn" data-open-profile="'+p.id+'">'+esc(p.nome)+'</button></td><td class="cell-muted">'+formatDate(p.createdDate)+'</td></tr>'; }).join('')+
        '</tbody></table>';
    }
    var rows = state.patients.filter(function(p){ return renovacaoStatus(p) !== 'Vencido'; })
      .map(function(p){ return { p: p, r: engagementRisk(p, monthKey) }; })
      .filter(function(x){ return x.r.avg !== null || x.r.total > 0; });
    if(!rows.length) return '<div class="empty-state">Nenhum dado registrado nesse mês.</div>';
    if(metric === 'engajamento'){
      rows.sort(function(a,b){
        if(a.r.avg === null) return 1;
        if(b.r.avg === null) return -1;
        return a.r.avg - b.r.avg;
      });
      return '<table><thead><tr><th>Nome</th><th>Engajamento Médio</th></tr></thead><tbody>'+
        rows.map(function(x){
          var avgText = x.r.avg === null ? '—' : x.r.avg.toFixed(1);
          return '<tr><td><button class="link-btn" data-open-profile="'+x.p.id+'">'+esc(x.p.nome)+'</button></td><td><span class="badge '+avgBadgeClass(x.r.avg)+'">'+avgText+'</span></td></tr>';
        }).join('')+'</tbody></table>';
    }
    rows.sort(function(a,b){
      var pa = a.r.total ? a.r.sent/a.r.total : 1;
      var pb = b.r.total ? b.r.sent/b.r.total : 1;
      return pa - pb;
    });
    return '<table><thead><tr><th>Nome</th><th>Check-ins</th></tr></thead><tbody>'+
      rows.map(function(x){
        return '<tr><td><button class="link-btn" data-open-profile="'+x.p.id+'">'+esc(x.p.nome)+'</button></td><td>'+x.r.sent+'/'+x.r.total+' enviados</td></tr>';
      }).join('')+'</tbody></table>';
  }

  function setJornadaTaskDone(patientId, taskId, done){
    var p = getPatient(patientId);
    if(!p || !p.jornada) return;
    var task = p.jornada.tarefas.filter(function(t){ return t.id === taskId; })[0];
    if(!task) return;
    task.concluido = done;
    task.dataConclusao = done ? todayISODate() : null;
    savePatients();
  }
  function setJornadaTaskArquivado(patientId, taskId, arquivado){
    var p = getPatient(patientId);
    if(!p || !p.jornada) return;
    var task = p.jornada.tarefas.filter(function(t){ return t.id === taskId; })[0];
    if(!task) return;
    task.arquivado = arquivado;
    savePatients();
  }
  function jornadaArquivoGroups(){
    var term = state.jornadaArquivoSearch.trim().toLowerCase();
    var byPatient = {};
    state.patients.forEach(function(p){
      if(!p.jornada) return;
      p.jornada.tarefas.forEach(function(t){
        if(!t.arquivado) return;
        if(term && p.nome.toLowerCase().indexOf(term) === -1 && t.nome.toLowerCase().indexOf(term) === -1) return;
        if(!byPatient[p.id]) byPatient[p.id] = { patient: p, tasks: [] };
        byPatient[p.id].tasks.push(t);
      });
    });
    var groups = Object.keys(byPatient).map(function(id){ return byPatient[id]; });
    groups.sort(function(a,b){ return a.patient.nome.localeCompare(b.patient.nome, 'pt-BR'); });
    return groups;
  }

  function bindJornadaArquivoRowEvents(){

    bindProfileOpeners(root);
    root.querySelectorAll('[data-kanban-restore]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = this.getAttribute('data-kanban-restore').split(':');
        setJornadaTaskArquivado(parseInt(parts[0],10), parseInt(parts[1],10), false);
        refreshJornadaArquivo();
        refreshAllJornadaViews();
        showToast('Tarefa restaurada.', 'success');
      });
    });
    root.querySelectorAll('[data-kanban-delete]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = this.getAttribute('data-kanban-delete').split(':');
        if(!confirm('Excluir esta tarefa permanentemente? Essa ação não pode ser desfeita.')) return;
        removePatientTask(parseInt(parts[0],10), parseInt(parts[1],10));
        refreshJornadaArquivo();
        refreshAllJornadaViews();
        showToast('Tarefa excluída.', 'success');
      });
    });
    root.querySelectorAll('[data-arquivo-patient-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = parseInt(this.getAttribute('data-arquivo-patient-toggle'),10);
        state.jornadaArquivoCollapsedPatients[id] = state.jornadaArquivoCollapsedPatients[id] === false ? true : false;
        refreshJornadaArquivo();
      });
    });
    root.querySelectorAll('[data-arquivo-limpar]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = parseInt(this.getAttribute('data-arquivo-limpar'),10);
        var p = getPatient(id);
        if(!p || !p.jornada) return;
        var arquivadas = p.jornada.tarefas.filter(function(t){ return t.arquivado; });
        if(!arquivadas.length) return;
        if(!confirm('Excluir as '+arquivadas.length+' tarefas arquivadas de '+p.nome+' permanentemente? Essa ação não pode ser desfeita.\n\nAs tarefas que ainda estão no Kanban não são afetadas.')) return;
        p.jornada.tarefas = p.jornada.tarefas.filter(function(t){ return !t.arquivado; });
        savePatients();
        refreshJornadaArquivo();
        refreshAllJornadaViews();
        showToast(arquivadas.length+' tarefa(s) excluída(s) do histórico.', 'success');
      });
    });

  function updatePatientTask(patientId, taskId, field, value){
    var p = getPatient(patientId);
    if(!p || !p.jornada) return;
    var task = p.jornada.tarefas.filter(function(t){ return t.id === taskId; })[0];
    if(!task) return;
    if(field === 'nome') task.nome = value;
    else if(field === 'dataAlvo') task.dataAlvo = value;
    savePatients();
  }
  function reorderPatientTasks(patientId, orderedTaskIds){
    var p = getPatient(patientId);
    if(!p || !p.jornada) return;
    orderedTaskIds.forEach(function(tid, idx){
      var task = p.jornada.tarefas.filter(function(t){ return t.id === tid; })[0];
      if(task) task.ordem = idx;
    });
    savePatients();
  }
  function reorderTemplateTasks(tipo, foco, variantId, orderedTids){
    var variant = getJornadaVariant(tipo, foco, variantId);
    if(!variant) return;
    orderedTids.forEach(function(tid, idx){
      var task = variant.tarefas.filter(function(t){ return t._tid === tid; })[0];
      if(task) task.ordem = idx;
    });
    saveJornadaTemplates();
  }
  function addPatientTask(patientId, fase){
    var p = getPatient(patientId);
    if(!p || !p.jornada) return;
    var maxId = p.jornada.tarefas.reduce(function(m,t){ return Math.max(m, t.id); }, -1);
    var maxOrdem = p.jornada.tarefas.reduce(function(m,t){ return Math.max(m, t.ordem||0); }, -1);
    var newId = maxId+1;
    p.jornada.tarefas.push({ id: newId, nome: 'Nova tarefa', fase: fase, dataAlvo: null, concluido: false, dataConclusao: null, observacao: '', arquivado: false, ordem: maxOrdem+1 });
    savePatients();
    return newId;
  }
  /* Duplica uma tarefa (nome, fase, observacao). A data NAO e copiada — fica em branco
     de proposito, do mesmo jeito que uma tarefa nova, ja que na pratica so a data muda
     de uma copia pra outra e assim fica obvio que precisa preencher uma data nova. */
  function duplicatePatientTask(patientId, taskId){
    var p = getPatient(patientId);
    if(!p || !p.jornada) return null;
    var original = p.jornada.tarefas.filter(function(t){ return t.id === taskId; })[0];
    if(!original) return null;
    var maxId = p.jornada.tarefas.reduce(function(m,t){ return Math.max(m, t.id); }, -1);
    var maxOrdem = p.jornada.tarefas.reduce(function(m,t){ return Math.max(m, t.ordem||0); }, -1);
    var newId = maxId+1;
    p.jornada.tarefas.push({
      id: newId, nome: original.nome, fase: original.fase, dataAlvo: null,
      concluido: false, dataConclusao: null, observacao: original.observacao,
      arquivado: false, ordem: maxOrdem+1
    });
    savePatients();
    return newId;
  }
  function removePatientTask(patientId, taskId){
    var p = getPatient(patientId);
    if(!p || !p.jornada) return;
    var idx = p.jornada.tarefas.findIndex(function(t){ return t.id === taskId; });
    if(idx !== -1) p.jornada.tarefas.splice(idx, 1);
    savePatients();
  }
  function removePatientJornada(patientId){

  /* ---- Fichas de Treino ---- */
  function temServicoTreino(p){
    return !!p && typeof p.servico === 'string' && p.servico.indexOf('Treino') !== -1;
  }
  function temServicoDieta(p){
    return !!p && typeof p.servico === 'string' && p.servico.indexOf('Dieta') !== -1;
  }
  function sortFichas(list){
    return (list || []).slice().sort(function(a,b){
      if(a.dataPassado !== b.dataPassado) return a.dataPassado < b.dataPassado ? 1 : -1;
      return b.id - a.id;
    });
  }
  function fichasTreinoOrdenadas(p){
    return sortFichas(p.fichasTreino);
  }
  function currentFichaTreino(p){
    return fichasTreinoOrdenadas(p)[0] || null;
  }
  function fichaTreinoDiasStatus(dataVencimento){
    if(!dataVencimento) return null;
    var diff = diasParaVencer(dataVencimento);
    if(diff < 0) return 'vencido';
    if(diff <= 15) return 'avencer';
    return 'emdia';
  }
  function addFichaTreino(patientId){
    var p = getPatient(patientId);
    if(!p) return;
    if(!p.fichasTreino) p.fichasTreino = [];
    var maxId = p.fichasTreino.reduce(function(m,f){ return Math.max(m, f.id); }, -1);
    var id = maxId + 1;
    p.fichasTreino.push({ id: id, dataPassado: todayISODate(), dataVencimento: '', expectativa: '', volumePorGrupo: {} });
    if(!state.fichaTreinoOpen[patientId]) state.fichaTreinoOpen[patientId] = {};
    state.fichaTreinoOpen[patientId][id] = true;
    savePatients();
  }
  function fichasDietaOrdenadas(p){
    return sortFichas(p.fichasDieta);

  function addFichaDieta(patientId){
    var p = getPatient(patientId);
    if(!p) return;
    if(!p.fichasDieta) p.fichasDieta = [];

    var id = maxId + 1;
    p.fichasDieta.push({ id: id, dataPassado: todayISODate(), expectativa: '', calorias: '', proteinas: '', carboidratos: '', gorduras: '' });
    if(!state.fichaDietaOpen[patientId]) state.fichaDietaOpen[patientId] = {};
    state.fichaDietaOpen[patientId][id] = true;
    savePatients();
  }
  function updateFichaDieta(patientId, fichaId, field, value){

  function removeFichaDieta(patientId, fichaId){

    if(idx !== -1) p.fichasDieta.splice(idx, 1);

  }
  function updateFichaTreino(patientId, fichaId, field, value){
    var p = getPatient(patientId);
    if(!p || !p.fichasTreino) return;
    var f = p.fichasTreino.filter(function(x){ return x.id === fichaId; })[0];

  /* ---- Acesso Rápido (Dashboard) ---- */
  function pacientesSemVigencia(){
    return state.patients.filter(function(p){
      return renovacaoStatus(p) !== 'Vencido' && !p.vencimento;
    }).sort(function(a,b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
  }
  function pacientesSemConsultaMarcada(sortDir){
    var list = state.patients.filter(function(p){
      if(renovacaoStatus(p) === 'Vencido') return false;
      var status = consultaStatus(p);
      return status === 'atrasado' || status === 'semdata';
    });
    list.sort(function(a,b){
      var diffA = consultaDiffDays(a);
      var diffB = consultaDiffDays(b);
      var av = diffA === null ? Infinity : -diffA;
      var bv = diffB === null ? Infinity : -diffB;
      if(av === bv) return a.nome.localeCompare(b.nome, 'pt-BR');
      return sortDir === 'asc' ? av - bv : bv - av;
    });
    return list;
  }
  function pacientesVencimentosList(sortDir){
    var list = state.patients.filter(function(p){
      return renovacaoStatus(p) !== 'Vencido' && p.vencimento;
    });
    list.sort(function(a,b){
      if(a.vencimento === b.vencimento) return a.nome.localeCompare(b.nome, 'pt-BR');
      if(sortDir === 'asc') return a.vencimento < b.vencimento ? -1 : 1;
      return a.vencimento > b.vencimento ? -1 : 1;
    });
    return list;

  function pacientesSemAtualizacao(kind, sortDir){
    var temServico = kind === 'treino' ? temServicoTreino : temServicoDieta;
    var fichasOrdenadas = kind === 'treino' ? fichasTreinoOrdenadas : fichasDietaOrdenadas;
    var list = state.patients.filter(function(p){
      return renovacaoStatus(p) !== 'Vencido' && temServico(p);
    }).map(function(p){
      var ultima = fichasOrdenadas(p)[0] || null;
      var dias = ultima ? daysBetween(ultima.dataPassado, todayISODate()) : null;
      return { p: p, dias: dias };
    });
    list.sort(function(a,b){
      var av = a.dias === null ? Infinity : a.dias;
      var bv = b.dias === null ? Infinity : b.dias;
      if(av === bv) return a.p.nome.localeCompare(b.p.nome, 'pt-BR');
      return sortDir === 'asc' ? av - bv : bv - av;

    return list;

  /* ---- Resumo de Entrega: o que ainda falta preencher em cada paciente ---- */
  function semanasJaOcorridas(monthKey){
    // uma semana so "aconteceu" quando a sexta-feira dela ja passou
    var wk = weeksInMonth(monthKey);
    var hoje = todayISODate();
    var n = 0;
    for(var i=0;i<wk;i++){
      var d = nthFridayDate(monthKey, i);
      if(d && d <= hoje) n++;
    }
    return n;
  }
  function pendenciasPaciente(p, monthKey){
    var faltas = [];
    if(!p.telefone) faltas.push('Telefone');
    if(!p.email) faltas.push('E-mail');
    if(!p.nascimento) faltas.push('Nascimento');
    if(!p.vencimento) faltas.push('Vigência');
    if(!p.consulta) faltas.push('Consulta');

    var data = getMonthData(p, monthKey);
    var nSem = semanasJaOcorridas(monthKey);
    var ativos = activeWeekIndexes(p, monthKey);
    var ativosEng = activeEngagementIndexes(p, monthKey);
    var engVazias = 0, chkVazias = 0;
    ativosEng.forEach(function(i){
      if(i >= nSem) return; // semana ainda nao aconteceu, nao conta como pendencia
      if(data.engajamento[i] === null || data.engajamento[i] === undefined) engVazias++;
    });
    ativos.forEach(function(i){
      if(i >= nSem) return; // semana ainda nao aconteceu, nao conta como pendencia
      if(data.checkin[i] === null || data.checkin[i] === undefined) chkVazias++;
    });
    if(engVazias) faltas.push('Engajamento ('+engVazias+' sem.)');
    if(chkVazias) faltas.push('Check-in ('+chkVazias+' sem.)');

    if(temServicoTreino(p)){
      if(!fichasTreinoOrdenadas(p).length) faltas.push('Ficha de treino');
      else if(!fichasTreinoComVolume(p).length) faltas.push('Volume por grupo');
    }
    if(temServicoDieta(p)){
      if(!fichasDietaOrdenadas(p).length) faltas.push('Ficha de dieta');
      else if(!fichasDietaComMacro(p).length) faltas.push('Macros da dieta');
    }
    if(!(p.jornada && Array.isArray(p.jornada.tarefas) && p.jornada.tarefas.length)) faltas.push('Jornada');
    return faltas;
  }
  function resumoEntregaRows(){
    var monthKey = state.competencia;
    var list = state.patients.filter(function(p){
      return renovacaoStatus(p) !== 'Vencido';

    }).filter(function(x){ return x.faltas.length > 0; });
    list.sort(function(a,b){
      if(a.faltas.length !== b.faltas.length) return b.faltas.length - a.faltas.length;
      return a.p.nome.localeCompare(b.p.nome, 'pt-BR');
    });
    if(!list.length) return '<tr><td colspan="2"><div class="empty-state">Todos os pacientes estão completos. 🎉</div></td></tr>';
    return list.map(function(x){
      var n = x.faltas.length;

      return '<tr>'+

  function formatDiasOuSemanas(dias, unit){
    if(dias === null) return 'Nunca atualizado';
    if(unit === 'semanas' && dias >= 7){
      var w = Math.floor(dias/7);
      return w + (w === 1 ? ' semana' : ' semanas');

    return dias + (Math.abs(dias) === 1 ? ' dia' : ' dias');
  }

      return '<tr><td><button class="link-btn" data-open-profile="'+item.p.id+'">'+esc(item.p.nome)+'</button></td><td><span class="badge '+cls+'">'+esc(diasLabel)+'</span></td></tr>';

  /* Campos de macro de UMA dieta — serve tanto pra ficha linear (source = a propria
     ficha, vIdx = null) quanto pra cada variacao do ciclo (source = a variacao). */
  function macroInputsHtml(source, attrPrefix, fichaId, vIdx){
    var vAttr = vIdx === null ? '' : ' data-'+attrPrefix+'-var="'+vIdx+'"';
    return MACRO_CATEGORIES.map(function(cat){
      var val = (source[cat.key] !== undefined && source[cat.key] !== null) ? source[cat.key] : '';
      return '<div><div class="mini-label">'+esc(cat.label)+'</div><input type="number" min="0" step="1" data-'+attrPrefix+'-macro="'+cat.key+'" data-'+attrPrefix+'-id="'+fichaId+'"'+vAttr+' value="'+esc(String(val))+'" placeholder="0"></div>';
    }).join('') + (function(){
      // Fibras fica fora do MACRO_CATEGORIES de proposito, pra nao entrar no
      // grafico de distribuicao nem no g/kg -- so o campo de gramas mesmo.

  function compareChipsAndPicker(available, selectedIds, removeAttr, addAttr, addId){
    var chrono = selectedIds.map(function(id){ return available.filter(function(f){ return f.id===id; })[0]; }).filter(Boolean)
      .sort(function(a,b){ return a.dataPassado < b.dataPassado ? -1 : (a.dataPassado > b.dataPassado ? 1 : 0); });
    var chipsHtml = chrono.map(function(f, idx){
      return '<span class="compare-chip" style="border-color:'+chartColorFor(idx)+';"><span class="compare-chip-dot" style="background:'+chartColorFor(idx)+';"></span>'+formatDate(f.dataPassado)+'<button type="button" data-'+removeAttr+'="'+f.id+'" aria-label="Remover data">×</button></span>';
    }).join('');

    return { chrono: chrono, html: '<div class="compare-chips">'+chipsHtml+picker+'</div>' };
  }
  function fmtNum(v){ return v % 1 === 0 ? String(v) : v.toFixed(1); }
  /* Desenha as barras a partir de "series" ja prontas. Cada serie tem um get(categoria)
     e um groupId: series com o mesmo groupId ficam coladas (mesma ficha, ex: carbo alto
     e carbo baixo), e o espaco maior separa uma ficha da outra. */
  function compareBarsFromSeriesHtml(categories, series, opts){
    opts = opts || {};
    var max = 0;
    categories.forEach(function(cat){
      series.forEach(function(s){ max = Math.max(max, s.get(cat.key !== undefined ? cat.key : cat)); });
    });
    if(max <= 0) max = 1;
    // agrupa mantendo a ordem de entrada
    var groups = [], byId = {};
    series.forEach(function(s, idx){
      var gid = s.groupId === undefined ? idx : s.groupId;
      if(byId[gid] === undefined){ byId[gid] = groups.length; groups.push([]); }
      groups[byId[gid]].push({ s: s, colorIdx: idx });
    });
    var temPar = groups.some(function(g){ return g.length > 1; });
    // sem pares, o espacamento entre barras e o de sempre (14px, dentro do subgrupo),
    // a menos que o chamador peca outro valor (ex: treino usa 0 pra colar as barras)
    var gapEntreFichas = temPar ? 26 : (opts.fichaGap !== undefined ? opts.fichaGap : 14);
    return categories.map(function(cat){
      var catKey = cat.key !== undefined ? cat.key : cat;
      var showGkgForCat = opts.showGkg && opts.pesoAtual && catKey && catKey !== 'calorias';
      var subgroups = groups.map(function(g){
        var cols = g.map(function(item){
          var val = item.s.get(catKey);
          var pct = val>0 ? Math.max(Math.round((val/max)*100), 4) : 0;
          var gkgHtml = showGkgForCat && val ? '<div class="volume-compare-bar-gkg">'+(val/opts.pesoAtual).toFixed(1)+' g/kg</div>' : '';
          return '<div class="volume-compare-bar-col"><div class="volume-compare-bar-val">'+(val?fmtNum(val):'')+'</div>'+gkgHtml+'<div class="volume-compare-bar" style="height:'+pct+'%;background:'+chartColorFor(item.colorIdx)+';"></div></div>';
        }).join('');
        return '<div class="volume-compare-subgroup">'+cols+'</div>';
      }).join('');
      return '<div class="volume-compare-group"><div class="volume-compare-bars" style="gap:'+gapEntreFichas+'px;">'+subgroups+'</div>'+
        '<div class="volume-compare-label">'+esc(cat.label||cat)+'</div></div>';
    }).join('');
  }
  /* Compatibilidade: o grafico de volume por grupo muscular continua chamando assim,
     com uma ficha por serie (sem pares). */
  function compareBarsHtml(categories, chrono, getVal, opts){
    var series = chrono.map(function(f, idx){
      return { groupId: idx, get: function(catKey){
        var cat = categories.filter(function(c){ return (c.key !== undefined ? c.key : c) === catKey; })[0];
        return getVal(f, cat !== undefined ? cat : catKey);
      } };
    });
    return compareBarsFromSeriesHtml(categories, series, opts);
  }

  function volumeCompareBodyHtml(p){
    var selectedIds = state.volumeCompareSelected[p.id] || [];
    var available = fichasTreinoComVolume(p);
    var cp = compareChipsAndPicker(available, selectedIds, 'volume-compare-remove', 'volume-compare-add', p.id);
    if(!available.length) return { chips: cp.html, chart: '<div class="empty-state" style="padding:12px;">Nenhuma ficha com volume por grupo muscular registrado ainda.</div>' };
    var chrono = cp.chrono;
    if(!chrono.length) return { chips: cp.html, chart: '<div class="empty-state" style="padding:12px;">Selecione uma data pra ver o gráfico (ou 2+ pra comparar).</div>' };
    var groups = state.grupoMuscularList.filter(function(g){
      return chrono.some(function(f){ return (f.volumePorGrupo[g]||0) > 0; });
    });
    // sempre ordenado por volume total, do maior pro menor -- fixo, sem opcao de trocar
    var totals = {};
    groups.forEach(function(g){ totals[g] = chrono.reduce(function(sum,f){ return sum + (f.volumePorGrupo[g]||0); }, 0); });
    groups = groups.slice().sort(function(a,b){ return totals[b]-totals[a]; });
    var bars = compareBarsHtml(groups, chrono, function(f, g){ return f.volumePorGrupo[g] || 0; }, { fichaGap: 0 });
    var summary = '';
    if(chrono.length >= 2){
      var first = chrono[0], last = chrono[chrono.length-1];
      var totalFirst = 0, totalLast = 0;
      var deltas = groups.map(function(g){
        var vf = first.volumePorGrupo[g]||0, vl = last.volumePorGrupo[g]||0;
        totalFirst += vf; totalLast += vl;
        return { grupo: g, delta: vl - vf };
      });
      var totalDelta = totalLast - totalFirst;
      var pct = totalFirst ? (totalDelta/totalFirst*100) : 0;
      deltas.sort(function(a,b){ return Math.abs(b.delta) - Math.abs(a.delta); });
      var top3 = deltas.slice(0,3).filter(function(d){ return d.delta !== 0; });
      summary = '<div class="cell-muted" style="margin-top:8px;">Volume total ('+formatDate(first.dataPassado)+' → '+formatDate(last.dataPassado)+'): '+
        (totalDelta>=0?'↑ +':'↓ ')+totalDelta.toFixed(1)+' ('+(pct>=0?'+':'')+pct.toFixed(1)+'%)'+
        (top3.length ? ' · Maiores variações: '+top3.map(function(d){ return esc(d.grupo)+' '+(d.delta>=0?'↑ +':'↓ ')+d.delta.toFixed(1); }).join(', ') : '')+
      '</div>';
    }
    return { chips: cp.html, chart: compareLegendHtml(chrono) + '<div class="volume-compare-chart">'+bars+'</div>' + summary };
  }
  function volumeCompareChartHtml(p){
    var sortLabel = '<span class="cell-muted" style="font-size:12.5px;">Volume ▼</span>';

  function dietaCompareBodyHtml(p){
    var selectedIds = state.dietaCompareSelected[p.id] || [];
    var available = fichasDietaComMacro(p);
    var cp = compareChipsAndPicker(available, selectedIds, 'dieta-compare-remove', 'dieta-compare-add', p.id);
    if(!available.length) return { chips: cp.html, chart: '<div class="empty-state" style="padding:12px;">Nenhuma ficha com calorias/macronutrientes registrado ainda.</div>' };
    var chrono = cp.chrono;
    if(!chrono.length) return { chips: cp.html, chart: '<div class="empty-state" style="padding:12px;">Selecione uma data pra ver o gráfico (ou 2+ pra comparar).</div>' };
    var pesoAtual = latestPesoAtual(p);
    // cada ficha vira 1 serie (linear) ou 2 (ciclo). O groupId mantem as duas variacoes
    // de uma mesma ficha coladas no grafico.
    var series = [];
    chrono.forEach(function(f, fichaIdx){
      dietaSeriesDaFicha(f).forEach(function(s){
        s.groupId = fichaIdx;
        series.push(s);
      });
    });
    var bars = compareBarsFromSeriesHtml(MACRO_CATEGORIES, series, { pesoAtual: pesoAtual, showGkg: state.dietaCompareShowGkg });
    var summary = '';
    if(series.length >= 2){
      var first = series[0], last = series[series.length-1];
      var summaryParts = MACRO_CATEGORIES.map(function(cat){
        var d = last.get(cat.key) - first.get(cat.key);
        var shortLabel = cat.key==='calorias'?'kcal':cat.key==='proteinas'?'prot':cat.key==='carboidratos'?'carbo':'gord';
        var unit = cat.key==='calorias'?' kcal':'g';
        return shortLabel+' '+(d>=0?'↑ +':'↓ ')+d.toFixed(1)+unit;
      });
      summary = '<div class="cell-muted" style="margin-top:8px;">Variação ('+esc(first.label)+' → '+esc(last.label)+'): '+summaryParts.join(' · ')+'</div>';
    }
    // total de kcal da semana, por ficha — é o que compara dieta linear com ciclo de
    // forma justa, já que no ciclo o valor do dia sozinho não conta a história toda.
    var semanaHtml = '';
    var semanas = chrono.map(function(f){ return { f: f, kcal: dietaKcalSemanaTotal(f), extra: livresSoma(f) }; })
                        .filter(function(x){ return x.kcal !== null; });
    if(semanas.length){
      var partes = semanas.map(function(x){
        var det = x.extra ? ' <span style="opacity:.75;">(inclui '+fmtNum(x.extra)+' livres)</span>' : '';
        return formatDate(x.f.dataPassado)+': <b>'+fmtNum(x.kcal)+' kcal</b>'+det;
      }).join(' · ');
      var deltaTxt = '';
      if(semanas.length >= 2){
        var d = semanas[semanas.length-1].kcal - semanas[0].kcal;
        deltaTxt = ' — '+(d>=0?'↑ +':'↓ ')+fmtNum(Math.abs(d))+' kcal na semana';
      }
      semanaHtml = '<div class="cell-muted" style="margin-top:6px;">Total da semana — '+partes+deltaTxt+'</div>';
    }
    return { chips: cp.html, chart: compareLegendFromSeriesHtml(series) + '<div class="volume-compare-chart">'+bars+'</div>' + summary + semanaHtml };
  }

  /* Liga os campos de macro / tipo / dias da ficha de dieta. Serve pros dois caminhos:
     o perfil do paciente (grava direto no paciente) e o formulario de cadastro/edicao
     (grava no rascunho). O que muda entre eles e so o getFicha e o onChange. */
  function bindDietaFichaFieldEvents(root, attrPrefix, getFicha, onChange, pesoAtual, persist){
    function fichaFrom(el){
      return getFicha(parseInt(el.getAttribute('data-'+attrPrefix+'-id'),10));
    }
    root.querySelectorAll('[data-'+attrPrefix+'-macro]').forEach(function(el){
      el.addEventListener('change', function(){
        var f = fichaFrom(this);
        if(!f) return;
        var key = this.getAttribute('data-'+attrPrefix+'-macro');
        var vRaw = this.getAttribute('data-'+attrPrefix+'-var');
        var val = this.value === '' ? '' : parseFloat(this.value);
        var vIdx = vRaw === null ? null : parseInt(vRaw,10);
        var source = vIdx === null ? f : ensureDietaVariacoes(f)[vIdx];
        source[key] = val;
        // so atualiza o paineizinho "por kg / distribuicao" no lugar, sem re-renderizar
        // a lista inteira — do contrario o campo em que o usuario for clicar em seguida
        // (o proximo macro, ou o Volume por grupo muscular de outra ficha) era destruido
        // e recriado no meio do clique, exigindo clicar duas vezes pra focar.
        var previewEl = document.getElementById(macroPreviewId(attrPrefix, f.id, vIdx));
        if(previewEl) previewEl.innerHTML = macroGkgHtml(source, pesoAtual)+'<div style="margin-top:14px;">'+macroDistributionHtml(source)+'</div>';
        if(persist) persist();
      });
    });
    root.querySelectorAll('[data-'+attrPrefix+'-tipo]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var f = fichaFrom(this);
        if(!f) return;
        var tipo = this.getAttribute('data-'+attrPrefix+'-tipo');
        if(tipo === 'ciclo'){ ensureDietaVariacoes(f); f.tipo = 'ciclo'; }
        else { f.tipo = 'linear'; } // mantem as variacoes gravadas, caso volte pro ciclo
        onChange();
      });
    });
    root.querySelectorAll('[data-'+attrPrefix+'-livrestipo]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var f = fichaFrom(this);
        if(!f) return;
        f.livresTipo = this.getAttribute('data-'+attrPrefix+'-livrestipo');
        onChange();
      });
    });
    root.querySelectorAll('[data-'+attrPrefix+'-livreskcal]').forEach(function(el){
      el.addEventListener('change', function(){
        var f = fichaFrom(this);
        if(!f) return;
        f.livresKcal = this.value === '' ? '' : parseFloat(this.value);
        onChange();
      });
    });
    root.querySelectorAll('[data-'+attrPrefix+'-livresobs]').forEach(function(el){
      el.addEventListener('blur', function(){
        var f = fichaFrom(this);
        if(!f) return;
        f.livresObs = this.value;
        onChange();
      });
    });
    root.querySelectorAll('[data-'+attrPrefix+'-varnome]').forEach(function(el){
      el.addEventListener('blur', function(){
        var f = fichaFrom(this);
        if(!f) return;
        var i = parseInt(this.getAttribute('data-'+attrPrefix+'-varnome'),10);
        ensureDietaVariacoes(f)[i].nome = this.value.trim();
        onChange();
      });
    });
    root.querySelectorAll('[data-'+attrPrefix+'-dia]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var f = fichaFrom(this);
        if(!f) return;
        var dia = this.getAttribute('data-'+attrPrefix+'-dia');
        var i = parseInt(this.getAttribute('data-'+attrPrefix+'-var'),10);
        var v = ensureDietaVariacoes(f)[i];
        if(!Array.isArray(v.dias)) v.dias = [];
        var pos = v.dias.indexOf(dia);
        if(pos === -1) v.dias.push(dia); else v.dias.splice(pos, 1);
        onChange();
      });
    });

  /* ================= PACIENTES ================= */
  var PRIORITY_RANK = { 'Modo Bebezinho': 0, 'Urgente': 1, 'Moderada': 2, 'Sem urgência': 3 };
  function comparePatients(a, b){
    var dir = state.sortDir === 'asc' ? 1 : -1;
    var col = state.sortBy;
    var av, bv;
    if(col === 'prioridade'){
      av = PRIORITY_RANK[a.prioridade]; bv = PRIORITY_RANK[b.prioridade];
    } else if(col === 'renovacao'){
      av = RENOVACAO_RANK[renovacaoStatus(a)]; bv = RENOVACAO_RANK[renovacaoStatus(b)];
    } else {
      av = (a[col] || '').toString().toLowerCase();
      bv = (b[col] || '').toString().toLowerCase();
    }
    if(av < bv) return -1 * dir;
    if(av > bv) return 1 * dir;
    return a.nome.localeCompare(b.nome, 'pt-BR');
  }
  function sortArrow(col){
    if(state.sortBy !== col) return '';
    return ' <span class="sort-arrow">' + (state.sortDir === 'asc' ? '▲' : '▼') + '</span>';
  }
  function filteredPatients(){
    var term = state.search.trim().toLowerCase();
    return state.patients.filter(function(p){
      if(renovacaoStatus(p) === 'Vencido') return false;
      var matchesSearch = !term || p.nome.toLowerCase().indexOf(term) !== -1;
      var matchesStatus = state.statusFilter === 'todos' || renovacaoStatus(p) === state.statusFilter;
      var matchesPlano = state.planoFilter === 'todos' || p.plano === state.planoFilter;
      var matchesPrioridade = state.prioridadeFilter === 'todos' || p.prioridade === state.prioridadeFilter;
      return matchesSearch && matchesStatus && matchesPlano && matchesPrioridade;
    }).sort(comparePatients);
  }

  /* Sem acento e sem diferenca de maiusc./minusc., pra comparar nomes na busca. */
  function normalizeNomeBusca(str){
    return String(str||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  }
  /* Busca por nome flexivel: cada palavra digitada precisa aparecer em algum lugar do
     nome (nao precisa ser a frase inteira, nem na mesma ordem do cadastro) — assim
     "silva maria" acha "Maria da Silva", e buscar so o sobrenome tambem funciona. */
  function nomeMatchesBusca(nome, termo){
    var tokens = normalizeNomeBusca(termo).trim().split(/\s+/).filter(Boolean);
    if(!tokens.length) return true;
    var nomeNorm = normalizeNomeBusca(nome);
    return tokens.every(function(t){ return nomeNorm.indexOf(t) !== -1; });
  }
  function overviewFilteredPatients(monthKey){
    var term = state.overviewNomeFilter;
    var list = state.patients.filter(function(p){
      if(renovacaoStatus(p) === 'Vencido') return false;
      if(!nomeMatchesBusca(p.nome, term)) return false;
      if(state.overviewConsultaFilter !== 'todos' && consultaStatus(p) !== state.overviewConsultaFilter) return false;
      return true;
    });
    var withRisk = list.map(function(p){ return { p: p, r: engagementRisk(p, monthKey) }; });
    if(state.overviewMediaFilter !== 'todos'){
      withRisk = withRisk.filter(function(x){ return mediaBand(x.r.avg) === state.overviewMediaFilter; });
    }
    var dir = state.overviewSortDir === 'desc' ? -1 : 1;
    withRisk.sort(function(a,b){ return a.p.nome.localeCompare(b.p.nome, 'pt-BR') * dir; });
    return withRisk;
  }

  function weekMiniCalendarHtml(monthKey){
    var parsed = parseMonthKey(monthKey);
    var year = parsed.year, month = parsed.month;
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var fridays = [];
    for(var day=1; day<=daysInMonth; day++){
      if(new Date(year, month, day).getDay() === 5) fridays.push(day);
    }
    var startWeekday = new Date(year, month, 1).getDay();
    var weekdayHeaders = ['D','S','T','Q','Q','S','S'].map(function(w){ return '<span class="jornada-cal-wd">'+w+'</span>'; }).join('');
    var hoje = new Date();
    var isMesAtual = hoje.getFullYear() === year && hoje.getMonth() === month;
    var diaHoje = isMesAtual ? hoje.getDate() : -1;
    var cells = '';
    for(var i=0;i<startWeekday;i++){ cells += '<span class="jornada-cal-cell empty"></span>'; }
    for(day=1; day<=daysInMonth; day++){
      var weekIdx = -1;
      for(var f=0; f<fridays.length; f++){ if(day <= fridays[f]){ weekIdx = f; break; } }
      var isFriday = fridays.indexOf(day) !== -1;
      var style = weekIdx !== -1 ? 'background:'+chartColorFor(weekIdx)+'33;' : '';
      if(isFriday) style += 'font-weight:700;box-shadow:inset 0 0 0 1.5px '+chartColorFor(weekIdx)+';';
      if(day === diaHoje) style += 'outline:2px solid var(--primary);outline-offset:-1px;';
      cells += '<span class="jornada-cal-cell readonly-cal-cell" style="'+style+'border-radius:5px;" title="'+(day===diaHoje?'Hoje':'')+'">'+day+'</span>';
    }
    var legend = fridays.map(function(f,i){
      return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px;">'+
        '<span style="width:11px;height:11px;border-radius:3px;background:'+chartColorFor(i)+';display:inline-block;flex-shrink:0;"></span>'+
        'Sem '+(i+1)+' — check-in dia '+f+' ('+monthLabel(monthKey)+')'+
      '</div>';
    }).join('');
    return '<div style="max-width:260px;">'+
      '<div class="jornada-cal-grid" style="margin-bottom:4px;">'+weekdayHeaders+cells+'</div>'+
      legend+
      '<div style="font-size:12px;margin-top:8px;color:var(--text-muted);">Quem faz só Treino tem acompanhamento a cada 14 dias: valem só Sem 1 e Sem 3.</div>'+
    '</div>';
  }

    document.getElementById('searchInput').addEventListener('input', function(e){

    });
    document.getElementById('pacientesTableToggleBtn').addEventListener('click', function(){

      state.visaoGeralCollapsed = !state.visaoGeralCollapsed;

      this.textContent = state.visaoGeralCollapsed ? 'Mostrar' : 'Recolher';
    });
    document.getElementById('materialPendenteToggleBtn').addEventListener('click', function(){
      state.materialPendenteCollapsed = !state.materialPendenteCollapsed;
      document.getElementById('materialPendenteWrap').style.display = state.materialPendenteCollapsed ? 'none' : '';
      this.textContent = state.materialPendenteCollapsed ? 'Mostrar' : 'Recolher';
    });
    var overviewNomeInput = document.getElementById('overviewNomeFilterInput');
    if(overviewNomeInput){
      overviewNomeInput.addEventListener('input', function(e){
        state.overviewNomeFilter = e.target.value;
        refreshOverviewTable();
      });
    }
    function toggleOverviewSort(){
      state.overviewSortDir = state.overviewSortDir === 'asc' ? 'desc' : 'asc';
      // refreshOverviewTable so re-renderiza o corpo da tabela; as setas do
      // cabecalho e do botao (visivel no celular, onde o cabecalho some) sao
      // atualizadas aqui direto
      var newArrow = state.overviewSortDir === 'desc' ? '▼' : '▲';
      document.querySelectorAll('#overviewNomeSortTh .sort-arrow, #overviewNomeSortBtn .sort-arrow').forEach(function(el){
        el.textContent = newArrow;
      });
      refreshOverviewTable();
    }
    var overviewNomeSortTh = document.getElementById('overviewNomeSortTh');
    if(overviewNomeSortTh) overviewNomeSortTh.addEventListener('click', toggleOverviewSort);
    var overviewNomeSortBtn = document.getElementById('overviewNomeSortBtn');
    if(overviewNomeSortBtn) overviewNomeSortBtn.addEventListener('click', toggleOverviewSort);
    function savePesoAdd(addPid){
      var addDate = document.getElementById('pesoAddDate').value;
      var addValue = parseFloat(document.getElementById('pesoAddValue').value);
      if(!addDate || isNaN(addValue)){
        showToast('Preencha data e peso.', 'danger');
        return;
      }
      var addMonthKey = addDate.slice(0,7);
      var addWeekIndex = nextFreePesoSlot(getPatient(addPid), addMonthKey);
      updatePesoEntry(addPid, addMonthKey, addWeekIndex, addValue, addDate);
      state.pesoEditingKey = null;
      state.pesoHistoryPage[addPid] = 0;
      refreshOverviewTable();
      showToast('Peso registrado.', 'success');
    }
    // Enter no campo de data ou de peso do "+ Registrar peso" salva igual ao botao.
    content.addEventListener('keydown', function(e){
      if(e.key !== 'Enter') return;
      if(!e.target.closest('#pesoAddDate') && !e.target.closest('#pesoAddValue')) return;
      if(!state.pesoEditingKey || state.pesoEditingKey.indexOf('add|') !== 0) return;
      e.preventDefault();
      savePesoAdd(parseInt(state.pesoEditingKey.slice(4),10));
    });
    content.addEventListener('click', function(e){
      var weekEditBtn = e.target.closest('[data-week-edit]');
      if(weekEditBtn){
        var parts = weekEditBtn.getAttribute('data-week-edit').split('|');
        openWeekEditModal(parseInt(parts[0],10), parseInt(parts[1],10));
        return;
      }
      var pesoToggle = e.target.closest('[data-peso-toggle]');
      if(pesoToggle){
        var pid = parseInt(pesoToggle.getAttribute('data-peso-toggle'),10);
        state.pesoHistoryOpen[pid] = !state.pesoHistoryOpen[pid];
        refreshOverviewTable();
        return;
      }
      var pesoAddOpen = e.target.closest('[data-peso-add-open]');
      if(pesoAddOpen){
        state.pesoEditingKey = 'add|'+pesoAddOpen.getAttribute('data-peso-add-open');
        refreshOverviewTable();
        return;
      }
      var pesoAddSave = e.target.closest('[data-peso-add-save]');
      if(pesoAddSave){
        savePesoAdd(parseInt(pesoAddSave.getAttribute('data-peso-add-save'),10));
        return;
      }
      var pesoDeleteBtn = e.target.closest('[data-peso-delete]');
      if(pesoDeleteBtn){
        var delKey = pesoDeleteBtn.getAttribute('data-peso-delete').split('|');
        var delPid = parseInt(delKey[0],10), delMonthKey = delKey[1], delWeekIndex = parseInt(delKey[2],10);
        if(!confirm('Excluir este peso registrado? Essa ação não pode ser desfeita.')) return;
        deletePesoEntry(delPid, delMonthKey, delWeekIndex);
        state.pesoEditingKey = null;
        refreshOverviewTable();
        showToast('Peso excluído.', 'success');
        return;
      }
      var pesoPagePrev = e.target.closest('[data-peso-page-prev]');
      if(pesoPagePrev){
        var prevPid = parseInt(pesoPagePrev.getAttribute('data-peso-page-prev'),10);
        state.pesoHistoryPage[prevPid] = Math.max(0, (state.pesoHistoryPage[prevPid]||0) - 1);
        state.pesoEditingKey = null;
        refreshOverviewTable();
        return;
      }
      var pesoPageNext = e.target.closest('[data-peso-page-next]');
      if(pesoPageNext){
        var nextPid = parseInt(pesoPageNext.getAttribute('data-peso-page-next'),10);
        state.pesoHistoryPage[nextPid] = (state.pesoHistoryPage[nextPid]||0) + 1;
        state.pesoEditingKey = null;
        refreshOverviewTable();
        return;
      }
      var pesoEditOpen = e.target.closest('[data-peso-edit-open]');
      if(pesoEditOpen){
        state.pesoEditingKey = pesoEditOpen.getAttribute('data-peso-edit-open');
        refreshOverviewTable();
        return;
      }
      var pesoEditCancel = e.target.closest('[data-peso-edit-cancel]');
      if(pesoEditCancel){
        state.pesoEditingKey = null;
        refreshOverviewTable();
        return;
      }
      var pesoEditSave = e.target.closest('[data-peso-edit-save]');
      if(pesoEditSave){
        var editKey = pesoEditSave.getAttribute('data-peso-edit-save').split('|');
        var editPid = parseInt(editKey[0],10), editMonthKey = editKey[1], editWeekIndex = parseInt(editKey[2],10);
        var editDate = document.getElementById('pesoEditDate').value;
        var editValue = parseFloat(document.getElementById('pesoEditValue').value);
        if(!editDate || isNaN(editValue)){
          showToast('Preencha data e peso.', 'danger');
          return;
        }
        updatePesoEntry(editPid, editMonthKey, editWeekIndex, editValue, editDate);
        var editObsEl = document.getElementById('pesoEditObs');
        if(editObsEl) updateObsCheckinEntry(editPid, editMonthKey, editWeekIndex, editObsEl.value.trim());
        state.pesoEditingKey = null;
        refreshOverviewTable();
        showToast('Peso atualizado.', 'success');
        return;
      }
      var pesoChartObsToggle = e.target.closest('[data-peso-chart-obs-toggle]');
      if(pesoChartObsToggle){
        state.pesoChartShowObs = !state.pesoChartShowObs;
        refreshOverviewTable();
        return;
      }
      var toggle = e.target.closest('[data-filter-toggle]');
      if(toggle){
        var menu = toggle.closest('.th-filter').querySelector('.filter-menu');
        var willOpen = !menu.classList.contains('open');
        document.querySelectorAll('.filter-menu.open').forEach(function(m){ m.classList.remove('open'); });
        if(willOpen) menu.classList.add('open');
        document.querySelectorAll('.card').forEach(function(c){
          c.classList.toggle('menu-open', !!c.querySelector('.filter-menu.open'));
        });
        return;
      }
      var option = e.target.closest('.filter-menu-option');
      if(option){
        var fKey = option.getAttribute('data-filter-key');
        var fValue = option.getAttribute('data-filter-value');
        applyFilterSelection(fKey, fValue);
        if(MAIN_TABLE_FILTER_KEYS.indexOf(fKey) !== -1) refreshPatientsTable();
        if(OVERVIEW_FILTER_KEYS.indexOf(fKey) !== -1) refreshOverviewTable();
      }
    });
    document.getElementById('pacientesCompetenciaSelect').addEventListener('change', function(){
      state.competencia = this.value;
      render();
    });
    document.getElementById('newPatientBtn').addEventListener('click', function(){
      openFormModal('add', null);
    });
    document.getElementById('exportBtn').addEventListener('click', exportData);

    var sortHeaders = content.querySelectorAll('.th-sort');
    for(var s=0;s<sortHeaders.length;s++){
      sortHeaders[s].addEventListener('click', function(){
        var col = this.getAttribute('data-sort');
        if(state.sortBy === col){
          state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortBy = col;
          state.sortDir = 'asc';
        }
        render();
      });
    }
    bindProfileOpeners(content);
    bindRowActions(content);
    bindInfoIcons(content);
  }

  /* Backup completo: pacientes + modelos de Jornada + lista de grupamentos musculares.
     Formato novo e um objeto com essas 3 chaves. O import continua aceitando o formato
     antigo (so um array de pacientes) pra nao quebrar backups feitos antes dessa mudanca. */
  function exportData(){
    var payload = {
      backupVersion: 3,
      exportedAt: new Date().toISOString(),
      patients: state.patients,
      jornadaTemplates: state.jornadaTemplates,
      grupoMuscularList: state.grupoMuscularList,
      captacao: state.captacao,
      captacaoTemplates: state.captacaoTemplates
    };
    var dataStr = JSON.stringify(payload, null, 2);
    var blob = new Blob([dataStr], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'angelo-garcia-crm-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup exportado com sucesso.', 'success');
  }
  function handleImportFile(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var parsed;
      try{
        parsed = JSON.parse(e.target.result);
      }catch(err){
        alert('Arquivo inválido. Selecione um backup JSON exportado pelo CRM.');
        return;
      }
      // formato antigo: so um array de pacientes, sem modelos/grupos
      var isLegacy = Array.isArray(parsed);
      var patients = isLegacy ? parsed : parsed.patients;
      if(!Array.isArray(patients)){
        alert('Arquivo inválido. Selecione um backup JSON exportado pelo CRM.');
        return;
      }
      var extras = isLegacy ? '' : ' + modelos de Jornada + grupamentos musculares';
      if(!isLegacy && parsed.captacao) extras += ' + captação (leads, modelos)';
      var ok = confirm('Importar ' + patients.length + ' paciente(s)' + extras + '? Isso vai substituir todos os dados atuais.');
      if(!ok) return;
      state.patients = patients;
      savePatients();
      if(!isLegacy && parsed.jornadaTemplates){
        state.jornadaTemplates = parsed.jornadaTemplates;
        saveJornadaTemplates();
      }
      if(!isLegacy && Array.isArray(parsed.grupoMuscularList) && parsed.grupoMuscularList.length){
        state.grupoMuscularList = parsed.grupoMuscularList;
        saveGrupoMuscularList();
      }
      // backups anteriores a esta versao nao tem captacao — nesse caso o que ja existe fica
      if(!isLegacy && parsed.captacao){
        state.captacao = normalizeCaptacao(parsed.captacao);
        saveCaptacao();
      }
      if(!isLegacy && parsed.captacaoTemplates){
        state.captacaoTemplates = normalizeCaptacaoTemplates(parsed.captacaoTemplates);
        saveCaptacaoTemplates();
      }
      render();
      showToast('Dados importados com sucesso.', 'success');
    };
    reader.readAsText(file);
  }

  function jornadaSectionHtml(p){
    if(!p.jornada){
      return ''+
        '<div class="profile-section">'+
          '<h3>Jornada do Paciente</h3>'+
          '<div class="obs-box">Esse paciente ainda não tem uma jornada. Edite o cadastro e escolha a Jornada pra gerar o checklist.</div>'+
        '</div>';
    }
    var faseLabels = JORNADA_FASES[p.jornada.tipo];
    var groups = faseLabels.map(function(label, fase){
      var tasks = p.jornada.tarefas.filter(function(t){ return t.fase === fase; }).sort(function(a,b){ return (a.ordem||0) - (b.ordem||0); });
      var rows = tasks.map(function(t){
        var status = jornadaTaskStatus(t);
        var dateLabel = t.concluido ? ('Concluído em ' + formatDate(t.dataConclusao)) : formatDateWithDiff(t.dataAlvo);
        return ''+
          '<div class="jornada-task status-'+status+'" data-jornada-drag-key="'+t.id+'">'+
            '<input type="checkbox" data-jornada-task-toggle="'+t.id+'" '+(t.concluido?'checked':'')+'>'+
            '<div class="jornada-task-body">'+
              '<div class="jornada-task-edit-row">'+
                '<input type="text" class="jornada-task-name" data-jornada-task-nome="'+t.id+'" value="'+esc(t.nome)+'">'+
                jornadaDateFieldHtml('profile-'+p.id+'-'+t.id, p.id, t.dataAlvo)+
                jornadaDateBadge(t.dataAlvo, t.id)+
                '<button type="button" class="btn-icon btn-danger-outline" data-jornada-task-remove="'+t.id+'">Remover</button>'+
              '</div>'+
              '<div class="jornada-task-date">'+dateLabel+'</div>'+
              '<input type="text" class="jornada-task-obs" data-jornada-task-obs="'+t.id+'" value="'+esc(t.observacao)+'" placeholder="Observação / mensagem a enviar (opcional)">'+
            '</div>'+
          '</div>';
      }).join('');
      return '<div class="jornada-fase-title">'+label+'</div>'+
        '<div class="jornada-fase-tasks" data-fase-group="'+fase+'">'+(rows || '<div class="cell-muted" style="margin-bottom:8px;">Nenhuma tarefa nessa fase.</div>')+'</div>'+
        '<button type="button" class="btn-icon" data-jornada-task-add="'+fase+'">+ Adicionar tarefa</button>';
    }).join('');
    var modeloNome = p.jornada.modeloNome || ((p.jornada.tipo==='trimestral'?'Trimestral':'Semestral')+' — '+JORNADA_FOCO_LABEL[p.jornada.foco]);
    return ''+
      '<div class="profile-section">'+
        '<div class="section-header-row" style="margin-bottom:4px;">'+
          '<h3 style="margin:0;">Jornada do Paciente</h3>'+

        '</div>'+

        groups+
      '</div>';
  }

  /* No formulário o Serviço pode ser trocado na hora, então as semanas que valem mudam
     ali mesmo. Em vez de re-renderizar o bloco inteiro (perderia o que já foi digitado),
     só desativamos/reativamos os campos das semanas que não se aplicam. */
  function applyQuinzenalToForm(){
    var servicoEl = document.getElementById('f_servico');
    var planoEl = document.getElementById('f_plano');
    var compEl = document.getElementById('f_competencia');
    if(!servicoEl || !compEl) return;
    var monthKey = compEl.value;
    var wk = weeksInMonth(monthKey);
    var mock = { servico: servicoEl.value, plano: planoEl ? planoEl.value : undefined };
    var essencial = isEssencialMensal(mock);
    var ativosCheckin = activeWeekIndexes(mock, monthKey);
    var ativosEng = activeEngagementIndexes(mock, monthKey);
    for(var i=0;i<wk;i++){
      var ativoChk = ativosCheckin.indexOf(i) !== -1;
      var ativoEng = ativosEng.indexOf(i) !== -1;
      ['f_chk_','f_obscheckin_'].forEach(function(prefix){
        var el = document.getElementById(prefix+i);
        if(!el) return;
        el.disabled = !ativoChk;
        var box = el.parentElement;
        if(box) box.style.opacity = ativoChk ? '' : '.45';
      });
      // peso continua semanal mesmo no plano Essencial — so check-in/engajamento tem
      // cadencia diferente; no quinzenal ("so Treino") o peso ja seguia o mesmo padrao
      // de antes, entao isso so muda pro Essencial.
      var el2 = document.getElementById('f_peso_'+i);
      if(el2){
        var ativoPeso = essencial ? true : ativoChk;
        el2.disabled = !ativoPeso;
        var box2 = el2.parentElement;
        if(box2) box2.style.opacity = ativoPeso ? '' : '.45';
      }
      var engEl = document.getElementById('f_eng_'+i);
      if(engEl){
        engEl.disabled = !ativoEng;
        var engBox = engEl.parentElement;
        if(engBox) engBox.style.opacity = ativoEng ? '' : '.45';
      }
    }
    var aviso = document.getElementById('quinzenalFormAviso');
    if(aviso) aviso.style.display = (!essencial && isTreinoQuinzenal(mock)) ? '' : 'none';
    var avisoMensal = document.getElementById('mensalFormAviso');
    if(avisoMensal) avisoMensal.style.display = essencial ? '' : 'none';
  }

  function collectFormData(){
    var nome = document.getElementById('f_nome').value.trim();
    if(!nome){
      alert('O campo Nome é obrigatório.');
      return null;
    }
    var monthKey = document.getElementById('f_competencia').value;
    var wk = weeksInMonth(monthKey);
    var eng = [];
    for(var i=0;i<wk;i++){
      var raw = document.getElementById('f_eng_'+i).value;
      eng.push(raw === '' ? null : clamp(parseInt(raw,10), 0, 10));
    }
    var chk = [];
    for(var j=0;j<wk;j++){
      var rawChk = document.getElementById('f_chk_'+j).value;
      chk.push(rawChk === 'sim' ? true : rawChk === 'nao' ? false : null);
    }
    var peso = [];
    for(var m=0;m<wk;m++){
      var rawPeso = document.getElementById('f_peso_'+m).value;
      peso.push(rawPeso === '' ? null : parseFloat(rawPeso));
    }
    var obsCheckin = [];
    for(var o=0;o<wk;o++){
      obsCheckin.push(document.getElementById('f_obscheckin_'+o).value.trim());
    }
    var metaTipo = document.getElementById('f_meta_tipo').value;
    var jornadaInicioEl = document.getElementById('f_jornada_inicio');
    var jornadaModeloEl = document.getElementById('f_jornada_modelo');
    return {
      core: {
        nome: nome,
        email: document.getElementById('f_email').value.trim(),
        telefone: document.getElementById('f_telefone').value.trim(),
        plano: document.getElementById('f_plano').value,
        servico: document.getElementById('f_servico').value,
        prioridade: document.getElementById('f_prioridade').value,
        vencimento: document.getElementById('f_venc').value,
        consulta: document.getElementById('f_consulta').value,
        nascimento: document.getElementById('f_nascimento').value,
        materialPos: document.getElementById('f_material').checked,
        isNovoPaciente: document.getElementById('f_novo_paciente').checked,
        fichasTreino: JSON.parse(JSON.stringify(state.formDraftFichas)),
        fichasDieta: JSON.parse(JSON.stringify(state.formDraftFichasDieta))
      },
      jornadaInicio: jornadaInicioEl ? jornadaInicioEl.value : '',
      jornadaModelo: jornadaModeloEl ? jornadaModeloEl.value : '',
      monthKey: monthKey,
      weekly: {
        metaMes: document.getElementById('f_meta').value.trim(),
        metaTipo: metaTipo,
        metaPesoMin: metaTipo === 'peso' ? document.getElementById('f_meta_peso_min').value : '',
        metaPesoMax: metaTipo === 'peso' ? document.getElementById('f_meta_peso_max').value : '',
        metaPesoInicio: metaTipo === 'peso' ? document.getElementById('f_meta_peso_inicio').value : '',
        observacoes: document.getElementById('f_obs').value.trim(),
        engajamento: eng,
        checkin: chk,

    };
