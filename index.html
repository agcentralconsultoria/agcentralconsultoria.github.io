<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angelo Garcia CRM</title>
<style>
  :root{
    --primary:#EA580C;
    --primary-dark:#C2410C;
    --primary-light:#FFEDD5;
    --secondary:#111111;
    --bg:#F4F5F7;
    --white:#FFFFFF;
    --border:#E4E4E7;
    --text:#18181B;
    --text-muted:#6B7280;
    --success:#16A34A;
    --success-bg:#DCFCE7;
    --warning:#CA8A04;
    --warning-bg:#FEF9C3;
    --danger:#DC2626;
    --danger-bg:#FEE2E2;
    --info:#2563EB;
    --info-bg:#DBEAFE;
    --gray-badge:#6B7280;
    --gray-badge-bg:#F0F0F1;
    --baby:#DB2777;
    --baby-bg:#FCE7F3;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.18);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg,var(--secondary) 0%,#1f1f1f 55%,var(--primary-dark) 130%);
    padding:20px;
  }
  .login-card{
    background:var(--white);
    width:100%;
    max-width:400px;
    border-radius:16px;
    padding:40px 36px;
    box-shadow:var(--shadow-lg);
  }
  .login-logo{
    width:56px;height:56px;border-radius:50%;
    object-fit:cover;display:block;
    margin:0 auto 18px;
  }
  .login-card h1{
    text-align:center;font-size:20px;margin:0 0 2px;color:var(--secondary);
  }
  .login-card p.sub{
    text-align:center;color:var(--text-muted);font-size:13px;margin:0 0 26px;
  }
  .form-group{margin-bottom:16px;}
  .form-group label{
    display:block;font-size:12.5px;font-weight:600;color:var(--secondary);margin-bottom:6px;
  }
  .form-group input[type=text],
  .form-group input[type=email],
  .form-group input[type=password],
  .form-group input[type=date],
  .form-group input[type=number],
  .form-group select,
  .form-group textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:var(--white);
    color:var(--text);
    transition:border-color .15s, box-shadow .15s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-light);
  }
  .form-group textarea{resize:vertical;min-height:70px;}
  .login-error{
    background:var(--danger-bg);
    color:var(--danger);
    font-size:13px;
    padding:9px 12px;
    border-radius:8px;
    margin-bottom:14px;
    display:none;
  }
  .login-error.show{display:block;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:8px;
    padding:10px 18px;
    font-size:14px;font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s, opacity .15s, transform .05s;
  }
  .btn:active{transform:scale(.98);}
  .btn-block{width:100%;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary{background:var(--white);color:var(--secondary);border:1px solid var(--border);}
  .btn-secondary:hover{background:#F5F5F5;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#B91C1C;}
  .btn-dark{background:var(--secondary);color:#fff;}
  .btn-dark:hover{background:#000;}
  .login-hint{margin-top:18px;text-align:center;font-size:11.5px;color:var(--text-muted);}

  /* ---------- Header / Nav ---------- */
  header.topbar{
    background:var(--secondary);
    color:#fff;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:64px;
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .logo-box{
    width:38px;height:38px;border-radius:50%;
    object-fit:cover;flex-shrink:0;
  }
  .brand-text{line-height:1.15;}
  .brand-text strong{display:block;font-size:15.5px;letter-spacing:.2px;}
  .brand-text span{display:block;font-size:11px;color:#9CA3AF;}
  .nav-tabs{display:flex;gap:6px;}
  .nav-tab{
    background:transparent;border:none;color:#D1D5DB;
    padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .nav-tab:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-tab.active{background:var(--primary);color:#fff;}
  .header-right{display:flex;align-items:center;gap:14px;}
  .header-user{font-size:12.5px;color:#9CA3AF;}
  .logout-btn{
    background:transparent;color:#D1D5DB;border:1px solid #3A3A3A;
    padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .logout-btn:hover{background:#1f1f1f;color:#fff;border-color:#4b4b4b;}

  .container{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}

  /* ---------- Dashboard ---------- */
  .page-title{font-size:22px;margin:0 0 4px;color:var(--secondary);}
  .page-sub{color:var(--text-muted);font-size:13.5px;margin:0 0 24px;}
  .kpi-grid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-bottom:32px;
  }
  .kpi-card{
    background:var(--white);border-radius:var(--radius);padding:20px 22px;
    box-shadow:var(--shadow);border-left:4px solid var(--primary);
    cursor:pointer;text-align:left;border-top:none;border-right:none;border-bottom:none;
    font-family:inherit;width:100%;transition:box-shadow .15s, transform .05s;
  }
  .kpi-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);}
  .kpi-card:active{transform:scale(.99);}
  .kpi-card.selected{outline:2px solid var(--primary);outline-offset:-1px;}
  .kpi-grid-sm{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:32px;max-width:640px;}
  .quick-access-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:32px;}
  .quick-access-grid .quick-access-full{grid-column:1/-1;}
  .kpi-card.alt{border-left-color:var(--warning);}
  .kpi-card.danger{border-left-color:var(--danger);}
  .ficha-treino-item{border:1px solid var(--border);border-radius:9px;margin-bottom:8px;overflow:hidden;background:var(--white);}
  .ficha-treino-header{
    width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 12px;background:none;border:none;font-family:inherit;font-size:13.5px;
    color:var(--text);cursor:pointer;text-align:left;
  }
  .ficha-treino-header:hover{background:#FAFAFA;}
  .ficha-treino-summary{flex:1;min-width:150px;font-weight:600;}
  .ficha-treino-arrow{color:var(--text-muted);font-size:12px;}
  .ficha-treino-body{padding:0 12px 12px;border-top:1px solid var(--border);}
  .ficha-treino-body .jornada-select-row{margin-top:12px;}
  .ficha-treino-body input[type=date]{
    padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    font-size:13.5px;font-family:inherit;background:var(--white);color:var(--text);
  }
  .ficha-treino-body textarea{
    width:100%;margin:4px 0 10px;padding:10px 12px;border:1px solid var(--border);
    border-radius:8px;font-size:13.5px;font-family:inherit;background:var(--white);
    color:var(--text);resize:vertical;min-height:90px;line-height:1.5;
  }
  .ficha-treino-body textarea:focus,.ficha-treino-body input[type=date]:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);
  }
  .volume-grupo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px;}
  .volume-grupo-grid input[type=number]{
    width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:7px;
    font-size:13px;font-family:inherit;background:var(--white);color:var(--text);text-align:center;
  }
  .volume-grupo-grid input[type=number]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
  .grupo-muscular-manager{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .compare-chips{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px;}
  .compare-chip{
    display:inline-flex;align-items:center;gap:5px;padding:2px 5px 2px 8px;
    border:1.5px solid var(--border);border-radius:999px;font-size:11.5px;background:var(--white);color:var(--text);
  }
  .compare-chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .compare-chip button{
    background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;line-height:1;
    padding:2px 3px;font-family:inherit;
  }
  .compare-chip button:hover{color:var(--danger);}
  .compare-chips select{
    padding:4px 6px;border:1px solid var(--border);border-radius:7px;font-size:11.5px;
    font-family:inherit;background:var(--white);color:var(--text);max-width:200px;
  }
  .compare-legend{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 2px;}
  .compare-legend-item{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-muted);}
  .volume-compare-chart{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;padding:8px 4px 0;}
  .volume-compare-group{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
  .volume-compare-bars{display:flex;align-items:flex-end;gap:2px;height:90px;}
  .volume-compare-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:13px;height:100%;}
  .volume-compare-bar-val{font-size:9px;font-weight:700;margin-bottom:1px;color:var(--text);white-space:nowrap;}
  .volume-compare-bar{width:100%;border-radius:2px 2px 0 0;min-height:1px;}
  .volume-compare-label{font-size:9.5px;color:var(--text-muted);margin-top:3px;text-align:center;max-width:60px;line-height:1.2;}
  .compare-expand-btn{
    background:none;border:1px solid var(--border);border-radius:6px;width:24px;height:24px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);
    font-size:13px;line-height:1;flex-shrink:0;padding:0;
  }
  .compare-expand-btn:hover{background:#FAFAFA;color:var(--text);}
  .compare-expanded-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;background:var(--white);
    padding:20px 26px 26px;overflow:auto;
  }
  .compare-expanded-overlay .volume-compare-chart{padding-top:14px;}
  .compare-expanded-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .compare-expanded-header h3{margin:0;font-size:16px;}
  .kpi-card.info{border-left-color:var(--info);}
  .kpi-card.pink{border-left-color:var(--baby);}
  .kpi-card.muted{border-left-color:var(--gray-badge);}
  .kpi-label{font-size:12.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .kpi-value{font-size:32px;font-weight:800;color:var(--secondary);margin-top:8px;}
  .section-title{font-size:16px;font-weight:700;color:var(--secondary);margin:0 0 14px;}
  .section-header-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .section-header-row .section-title{margin:0;}
  .info-icon-btn{
    width:18px;height:18px;border-radius:50%;flex-shrink:0;
    background:var(--white);color:var(--gray-badge);border:1.5px solid var(--gray-badge);
    font-size:11px;font-weight:800;font-family:inherit;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:0;line-height:1;
  }
  .info-icon-btn:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary);}
  .info-icon-btn.active{background:var(--primary);color:#fff;}
  .info-popover{
    display:none;background:#FAFAFA;border:1px solid var(--border);border-radius:9px;
    padding:10px 14px;font-size:13px;color:var(--text-muted);line-height:1.5;margin:-6px 0 14px;
  }
  .info-popover.open{display:block;}

  /* ---------- Jornada do Paciente ---------- */
  .jornada-select-row{display:flex;gap:12px;flex-wrap:wrap;}
  .jornada-select-row > div{flex:1;min-width:150px;}
  .jornada-select-row select, .jornada-select-row input{width:100%;}
  .jornada-template-task{
    display:flex;gap:8px;align-items:center;padding:8px 10px;
    border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--white);
  }
  .jornada-template-task input, .jornada-template-task select{
    padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;font-family:inherit;color:var(--text);
  }
  .jornada-template-task input:focus, .jornada-template-task select:focus{outline:none;border-color:var(--primary);}
  .jornada-template-nome{flex:3;min-width:160px;}
  .jornada-template-dia{flex:0 0 72px;}
  .jornada-template-fase{flex:2;min-width:180px;}
  .jornada-fase-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin:18px 0 8px;}
  .jornada-fase-title:first-child{margin-top:0;}
  .jornada-fase-toggle{cursor:pointer;user-select:none;}
  .jornada-fase-toggle:hover{color:var(--primary);}
  .fase-collapse-arrow{display:inline-block;width:10px;color:var(--primary);}
  .jornada-task{
    display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;
    border:1px solid var(--border);margin-bottom:6px;background:var(--white);
  }
  .jornada-task.status-atrasado{border-color:#FCA5A5;background:var(--danger-bg);}
  .jornada-task.status-hoje,.jornada-task.status-semana{border-color:#FDE68A;background:var(--warning-bg);}
  .jornada-task.status-concluido{opacity:.6;}
  .jornada-task input[type=checkbox]{width:17px;height:17px;margin-top:2px;flex-shrink:0;cursor:pointer;}
  .jornada-task-body{flex:1;min-width:0;}
  .jornada-task-name{font-size:13.5px;font-weight:600;color:var(--text);}
  .jornada-task.status-concluido .jornada-task-name{text-decoration:line-through;}
  .jornada-task-date{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .jornada-task-edit-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  input.jornada-task-name{border:none;background:transparent;padding:2px 0;flex:1;min-width:140px;}
  input.jornada-task-name:focus{outline:none;border-bottom:1px solid var(--primary);}
  .jornada-task-date-input{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;font-family:inherit;color:var(--text);}
  .jornada-task-date-input:focus{outline:none;border-color:var(--primary);}
  .jornada-day-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .jornada-day-badge.day-weekday{background:var(--success-bg);color:var(--success);}
  .jornada-day-badge.day-weekend{background:var(--danger-bg);color:var(--danger);}
  .jornada-day-badge.day-none{background:var(--gray-badge-bg);color:var(--text-muted);}
  .jornada-date-field-wrap{position:relative;display:inline-flex;align-items:center;gap:4px;}
  .jornada-date-manual-input{
    padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:11px;
    font-family:inherit;color:var(--text);background:var(--white);width:118px;
  }
  .jornada-date-manual-input::-webkit-calendar-picker-indicator{display:none;-webkit-appearance:none;}
  .jornada-date-manual-input:focus{outline:none;border-color:var(--primary);}
  .jornada-date-cal-btn{
    padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;
    font-family:inherit;background:var(--white);cursor:pointer;line-height:1;
  }
  .jornada-date-cal-btn:hover,.jornada-date-cal-btn.open{border-color:var(--primary);}
  .jornada-cal-popover{
    position:absolute;top:calc(100% + 4px);left:0;z-index:60;
    background:var(--white);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow-lg);padding:7px;width:190px;
  }
  .jornada-cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;font-size:11px;font-weight:700;color:var(--secondary);}
  .jornada-cal-nav{
    width:17px;height:17px;border:1px solid var(--border);border-radius:5px;background:var(--white);
    cursor:pointer;font-size:11px;line-height:1;color:var(--text);font-family:inherit;
  }
  .jornada-cal-nav:hover{border-color:var(--primary);color:var(--primary);}
  .jornada-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
  .jornada-cal-wd{font-size:9px;text-align:center;color:var(--text-muted);font-weight:700;padding:1px 0;}
  .jornada-cal-cell{
    position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:10px;border:none;border-radius:5px;background:none;color:var(--text);
    cursor:pointer;font-family:inherit;
  }
  .jornada-cal-cell.empty{cursor:default;}
  .jornada-cal-cell.weekend{background:var(--danger-bg);}
  .jornada-cal-cell.today{outline:1.5px solid var(--primary);outline-offset:-1.5px;}
  .jornada-cal-cell.selected{background:var(--primary);color:var(--white);font-weight:700;}
  .jornada-cal-cell:not(.empty):hover{outline:1.5px solid var(--primary);outline-offset:-1.5px;}
  .jornada-cal-cell.readonly-cal-cell{cursor:default;}
  .jornada-cal-cell.readonly-cal-cell:hover{outline:none;}
  .jornada-cal-dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--success);}
  .jornada-cal-cell.selected .jornada-cal-dot{background:var(--white);}
  .jornada-task-obs{
    width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;
    font-size:12.5px;font-family:inherit;color:var(--text);background:var(--white);
  }
  .jornada-kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;max-width:calc(6 * 260px + 5 * 14px);}
  .jornada-kanban-col{
    flex:0 0 260px;background:#FAFAFA;border:1px solid var(--border);border-radius:10px;padding:12px;
  }
  .jornada-kanban-col-header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);
  }
  .jornada-kanban-cards{max-height:494px;overflow-y:auto;padding-right:4px;}
  .jornada-kanban-card,.jornada-task,.jornada-template-task{cursor:grab;}
  .jornada-kanban-card.dragging,.jornada-task.dragging,.jornada-template-task.dragging{opacity:.4;cursor:grabbing;}
  .jornada-kanban-card.drag-over-top,.jornada-task.drag-over-top,.jornada-template-task.drag-over-top{box-shadow:0 -2px 0 0 var(--primary);}
  .jornada-kanban-card.drag-over-bottom,.jornada-task.drag-over-bottom,.jornada-template-task.drag-over-bottom{box-shadow:0 2px 0 0 var(--primary);}
  .jornada-kanban-card{
    padding:8px 9px;border-radius:8px;
    border:1px solid var(--border);margin-bottom:6px;background:var(--white);
  }
  .jornada-kanban-card.status-atrasado{border-color:#FCA5A5;background:var(--danger-bg);}
  .jornada-kanban-card.status-hoje{border-color:#FDE68A;background:var(--warning-bg);}
  .jornada-kanban-card.status-semana{border-color:#86EFAC;background:var(--success-bg);}
  .jornada-kanban-card.status-concluido{opacity:.65;}
  .jornada-kanban-card.status-concluido .jornada-kanban-card-name{text-decoration:line-through;}
  .jornada-kanban-card-top{display:flex;align-items:flex-start;gap:8px;}
  .jornada-kanban-card input[type=checkbox]{width:16px;height:16px;flex-shrink:0;cursor:pointer;margin-top:1px;}
  .jornada-kanban-card-body{flex:1;min-width:0;cursor:pointer;}
  .jornada-kanban-card-name{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:4px;}
  .jornada-kanban-archive-btn{
    flex-shrink:0;background:none;border:none;cursor:pointer;font-size:13px;

      '<div class="volume-grupo-grid">'+rows+'</div>';

  function macroDistributionHtml(f){
    var prot = parseFloat(f.proteinas) || 0;
    var carbo = parseFloat(f.carboidratos) || 0;
    var gord = parseFloat(f.gorduras) || 0;
    var kcalProt = prot*4, kcalCarbo = carbo*4, kcalGord = gord*9;
    var total = kcalProt + kcalCarbo + kcalGord;
    if(total <= 0){
      return '<div class="mini-label" style="text-align:left;margin-top:8px;">Preencha proteínas, carboidratos e gorduras pra ver a distribuição.</div>';
    }
    var pcts = [kcalProt/total*100, kcalCarbo/total*100, kcalGord/total*100];
    var labels = ['Proteínas','Carboidratos','Gorduras'];
    var colors = [chartColorFor(0), chartColorFor(1), chartColorFor(2)];
    var circumference = 2*Math.PI*40;
    var offset = 0;
    var arcs = pcts.map(function(pct, i){
      var len = (pct/100)*circumference;
      var gap = pct > 0 ? 2 : 0;
      var dash = Math.max(len-gap, 0);
      var circle = '<circle cx="50" cy="50" r="40" fill="none" stroke="'+colors[i]+'" stroke-width="16" stroke-dasharray="'+dash+' '+(circumference-dash)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 50 50)"></circle>';
      offset += len;
      return circle;
    }).join('');
    var legend = labels.map(function(lab, i){
      return '<div style="text-align:center;min-width:70px;">'+
        '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+colors[i]+';margin-right:4px;"></span>'+
        '<span style="font-size:12px;color:var(--text-muted);">'+lab+'</span>'+
        '<div style="font-weight:700;font-size:14px;">'+pcts[i].toFixed(1)+'%</div>'+
      '</div>';
    }).join('');
    return '<div class="mini-label" style="text-align:left;margin-top:8px;">Distribuição de macronutrientes</div>'+
      '<div style="display:flex;flex-direction:column;align-items:center;padding:8px 0;">'+
        '<svg viewBox="0 0 100 100" width="130" height="130">'+arcs+'</svg>'+
        '<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px;">'+legend+'</div>'+
      '</div>';
  }

  function showToast(msg, type){
    var root = document.getElementById('toast-root');
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' toast-' + type : '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2600);
  }

  /* ---------------- helpers ---------------- */
  function esc(str){
    return String(str === undefined || str === null ? '' : str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function clamp(n,min,max){ n = isNaN(n)?0:n; return Math.min(max, Math.max(min,n)); }
  function whatsappDigits(tel){
    var raw = String(tel||'');
    var hasPlus = raw.trim().charAt(0) === '+';
    var digits = raw.replace(/\D/g,'');
    if(!digits) return '';
    if(!hasPlus && digits.length <= 11) digits = '55' + digits;
    return digits;
  }
  function formatDate(str){
    if(!str) return '—';
    var parts = str.split('-');
    if(parts.length!==3) return str;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }
  function getPatient(id){
    return state.patients.filter(function(p){ return p.id === id; })[0];
  }
  var MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  function monthKeyOf(date){
    return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0');
  }
  function parseMonthKey(key){
    var parts = key.split('-');
    return { year: parseInt(parts[0],10), month: parseInt(parts[1],10)-1 };
  }
  function monthLabel(key){
    var p = parseMonthKey(key);
    return MONTH_NAMES[p.month] + ' de ' + p.year;
  }
  function getFridaysInMonth(year, monthIndex0){
    var count = 0;
    var d = new Date(year, monthIndex0, 1);
    while(d.getMonth() === monthIndex0){
      if(d.getDay() === 5) count++;
      d.setDate(d.getDate()+1);
    }
    return count;
  }
  function weeksInMonth(key){
    var p = parseMonthKey(key);
    return getFridaysInMonth(p.year, p.month);
  }
  function getCurrentMonthKey(){
    return monthKeyOf(new Date());
  }
  function todayISODate(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function getAvailableMonths(){
    var set = {};
    var now = new Date();
    for(var i=-6;i<=2;i++){
      var d = new Date(now.getFullYear(), now.getMonth()+i, 1);
      set[monthKeyOf(d)] = true;
    }
    state.patients.forEach(function(p){
      if(p.meses){ Object.keys(p.meses).forEach(function(k){ set[k] = true; }); }
    });
    return Object.keys(set).sort().reverse();
  }
  function monthSelectOptions(selectedKey){
    var cur = getCurrentMonthKey();
    return getAvailableMonths().map(function(k){
      var label = monthLabel(k) + (k === cur ? ' (atual)' : '');
      return '<option value="'+k+'"'+(k===selectedKey?' selected':'')+'>'+label+'</option>';
    }).join('');
  }
  function metaBoxText(data){
    if(data.metaTipo === 'peso'){
      if(data.metaPesoMin === '' && data.metaPesoMax === '') return 'Meta de peso ativa, mas sem valores preenchidos ainda.';
      return 'Meta de Peso: '+esc(String(data.metaPesoMin))+' a '+esc(String(data.metaPesoMax))+' kg (desde '+formatDate(data.metaPesoInicio)+')';
    }
    return esc(data.metaMes || 'Nenhuma meta definida.');
  }
  function daysBetween(dateStrA, dateStrB){
    if(!dateStrA || !dateStrB) return null;
    var a = new Date(dateStrA+'T00:00:00');
    var b = new Date(dateStrB+'T00:00:00');
    return Math.round((b-a)/86400000);
  }
  function nthFridayDate(monthKey, weekIndex){
    var parsed = parseMonthKey(monthKey);
    var d = new Date(parsed.year, parsed.month, 1);
    var fridays = [];
    while(d.getMonth() === parsed.month){
      if(d.getDay() === 5) fridays.push(isoDate(d));
      d.setDate(d.getDate()+1);
    }
    return fridays[weekIndex] || null;
  }
  function pesoHistoryList(p){
    var entries = [];
    if(p.meses){
      Object.keys(p.meses).forEach(function(monthKey){
        var arr = p.meses[monthKey].peso;
        if(!Array.isArray(arr)) return;
        var dataArr = p.meses[monthKey].pesoData;
        arr.forEach(function(v, i){
          if(v === null || v === undefined || v === '') return;
          var explicit = Array.isArray(dataArr) ? dataArr[i] : null;
          var d = explicit || nthFridayDate(monthKey, i);
          if(!d) return;
          entries.push({ date: d, value: parseFloat(v), monthKey: monthKey, weekIndex: i });
        });
      });
    }
    entries.sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    return entries;
  }
  function updatePesoEntry(patientId, monthKey, weekIndex, value, dateStr){
    var p = getPatient(patientId);
    if(!p) return;
    if(!p.meses) p.meses = {};
    if(!p.meses[monthKey]) p.meses[monthKey] = {};
    var m = p.meses[monthKey];
    var wk = weeksInMonth(monthKey);
    if(!Array.isArray(m.peso)) m.peso = [];
    if(!Array.isArray(m.pesoData)) m.pesoData = [];
    while(m.peso.length < wk) m.peso.push(null);
    while(m.pesoData.length < wk) m.pesoData.push(null);
    m.peso[weekIndex] = value;
    m.pesoData[weekIndex] = dateStr;
    savePatients();
  }
  function updateWeekEntry(patientId, monthKey, weekIndex, engVal, chkVal, obsVal){
    var p = getPatient(patientId);
    if(!p) return;
    if(!p.meses) p.meses = {};
    if(!p.meses[monthKey]) p.meses[monthKey] = {};
    var m = p.meses[monthKey];
    var wk = weeksInMonth(monthKey);
    if(!Array.isArray(m.engajamento)) m.engajamento = [];
    if(!Array.isArray(m.checkin)) m.checkin = [];
    if(!Array.isArray(m.obsCheckin)) m.obsCheckin = [];
    while(m.engajamento.length < wk) m.engajamento.push(null);
    while(m.checkin.length < wk) m.checkin.push(null);
    while(m.obsCheckin.length < wk) m.obsCheckin.push('');
    m.engajamento[weekIndex] = engVal;
    m.checkin[weekIndex] = chkVal;
    m.obsCheckin[weekIndex] = obsVal;
    savePatients();
  }
  function pesoGoalPace(p){
    var data = p.meses && p.meses[state.competencia];
    if(!data || data.metaTipo !== 'peso') return null;
    var min = parseFloat(data.metaPesoMin), max = parseFloat(data.metaPesoMax);
    if(isNaN(min) || isNaN(max) || !data.metaPesoInicio || !p.consulta) return null;
    var history = pesoHistoryList(p);
    if(!history.length) return null;
    var latest = history[0];
    var baseline = null;
    for(var i=history.length-1;i>=0;i--){
      if(history[i].date >= data.metaPesoInicio){ baseline = history[i]; break; }
    }
    if(!baseline) return null;
    var totalDays = daysBetween(data.metaPesoInicio, p.consulta);
    if(totalDays === null || totalDays <= 0) return null;
    var elapsedDays = daysBetween(data.metaPesoInicio, todayISODate());
    var clampedElapsed = Math.min(Math.max(elapsedDays, 0), totalDays);
    var targetDelta = (min + max) / 2;
    var actualDelta = latest.value - baseline.value;
    var expectedDelta = (clampedElapsed / totalDays) * targetDelta;
    var dir = targetDelta >= 0 ? 1 : -1;
    var status;
    if(actualDelta * dir < 0) status = 'fora';
    else if(actualDelta * dir >= expectedDelta * dir * 0.9) status = 'noritmo';
    else status = 'atrasado';
    return { status: status, min: min, max: max, actualDelta: actualDelta, expectedDelta: expectedDelta };

  function getMonthData(p, key){

    while(eng.length < wk) eng.push(null);
    var chk = (stored && Array.isArray(stored.checkin)) ? stored.checkin.slice(0, wk) : [];
    while(chk.length < wk) chk.push(null);
    var peso = (stored && Array.isArray(stored.peso)) ? stored.peso.slice(0, wk) : [];
    while(peso.length < wk) peso.push(null);

    while(obsCheckin.length < wk) obsCheckin.push('');
    return {
      metaMes: stored ? (stored.metaMes || '') : '',
      metaTipo: stored ? (stored.metaTipo || 'outro') : 'outro',
      metaPesoMin: stored && stored.metaPesoMin !== undefined ? stored.metaPesoMin : '',
      metaPesoMax: stored && stored.metaPesoMax !== undefined ? stored.metaPesoMax : '',

  function migratePatient(p){
    if(!p.createdDate) p.createdDate = todayISODate();
    if(!Array.isArray(p.fichasTreino)) p.fichasTreino = [];
    if(p.prioridade === 'Resolver esta semana') p.prioridade = 'Moderada';
    if(p.jornada && Array.isArray(p.jornada.tarefas)){
      p.jornada.tarefas.forEach(function(t, idx){
        if(t.ordem === undefined || t.ordem === null) t.ordem = idx;
      });
    }
    if(p.meses) return p;
    var key = getCurrentMonthKey();
    var wk = weeksInMonth(key);
    var eng = Array.isArray(p.engajamento) ? p.engajamento.slice(0, wk) : [];
    while(eng.length < wk) eng.push(null);
    var chk = Array.isArray(p.checkin) ? p.checkin.slice(0, wk) : [];
    while(chk.length < wk) chk.push(null);
    p.meses = {};
    p.meses[key] = {
      metaMes: p.metaMes || '',
      observacoes: p.observacoes || '',
      engajamento: eng,
      checkin: chk
    };
    delete p.metaMes; delete p.observacoes; delete p.engajamento; delete p.checkin;
    return p;
  }

  function seedJornadaTemplates(source){
    var clone = JSON.parse(JSON.stringify(source));
    var wrapped = {};
    Object.keys(clone).forEach(function(tipo){
      wrapped[tipo] = {};
      Object.keys(clone[tipo]).forEach(function(foco){
        clone[tipo][foco].forEach(function(t, idx){ t._tid = jornadaTemplateIdSeq++; if(t.ordem === undefined) t.ordem = idx; });
        wrapped[tipo][foco] = [{ id: 'default', isDefault: true, tarefas: clone[tipo][foco] }];
      });
    });
    return wrapped;
  }
  function parseJornadaTemplatesRaw(parsed){
    var ok = parsed && parsed.trimestral && parsed.trimestral.treino_dieta &&
      Array.isArray(parsed.trimestral.treino_dieta) && parsed.trimestral.treino_dieta[0] &&
      Array.isArray(parsed.trimestral.treino_dieta[0].tarefas);
    if(!ok) return null;
    var maxTid = 0, maxVariant = 0;
    Object.keys(parsed).forEach(function(tipo){
      Object.keys(parsed[tipo]).forEach(function(foco){
        parsed[tipo][foco].forEach(function(v){
          var m = /^copy_(\d+)$/.exec(v.id);
          if(m && parseInt(m[1],10) > maxVariant) maxVariant = parseInt(m[1],10);
          v.tarefas.forEach(function(t, idx){
            if(t._tid > maxTid) maxTid = t._tid;
            if(t.ordem === undefined || t.ordem === null) t.ordem = idx;
          });
        });
      });
    });
    jornadaTemplateIdSeq = maxTid + 1;
    jornadaVariantIdSeq = maxVariant + 1;
    return parsed;
  }

  function bindDragReorder(rootEl, itemSelector, groupSelector, getKey, onReorder){
    if(!rootEl) return;
    var items = rootEl.querySelectorAll(itemSelector);
    var draggedItem = null;
    function clearIndicators(){
      items.forEach(function(i){ i.classList.remove('drag-over-top','drag-over-bottom'); });
    }
    items.forEach(function(item){
      item.setAttribute('draggable', 'true');
      item.addEventListener('dragstart', function(e){
        draggedItem = item;
        item.classList.add('dragging');
        if(e.dataTransfer){
          e.dataTransfer.effectAllowed = 'move';
          try{ e.dataTransfer.setData('text/plain', getKey(item)); }catch(err){}
        }
      });
      item.addEventListener('dragend', function(){
        item.classList.remove('dragging');
        clearIndicators();
        draggedItem = null;
      });
      item.addEventListener('dragover', function(e){
        if(!draggedItem || draggedItem === item) return;
        var group = item.closest(groupSelector);
        if(!group || group !== draggedItem.closest(groupSelector)) return;
        e.preventDefault();
        var rect = item.getBoundingClientRect();
        var before = (e.clientY - rect.top) < rect.height/2;
        clearIndicators();
        item.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
      });
      item.addEventListener('drop', function(e){
        if(!draggedItem || draggedItem === item) return;
        var group = item.closest(groupSelector);
        if(!group || group !== draggedItem.closest(groupSelector)) return;
        e.preventDefault();
        var rect = item.getBoundingClientRect();
        var before = (e.clientY - rect.top) < rect.height/2;
        clearIndicators();
        var groupItems = Array.prototype.filter.call(group.querySelectorAll(itemSelector), function(i){ return i.closest(groupSelector) === group; });
        var orderedKeys = groupItems.map(getKey);
        var draggedKey = getKey(draggedItem);
        var targetKey = getKey(item);
        orderedKeys = orderedKeys.filter(function(k){ return k !== draggedKey; });
        var targetIdx = orderedKeys.indexOf(targetKey);
        var insertIdx = before ? targetIdx : targetIdx+1;
        orderedKeys.splice(insertIdx, 0, draggedKey);
        onReorder(orderedKeys);
      });
    });
  }
  function jornadaCalendarGlobalClick(e){
    var openBtn = e.target.closest('[data-jornada-cal-open]');

      if(state.jornadaCalendarOpen && state.jornadaCalendarOpen.key === key){
        state.jornadaCalendarOpen = null;

        state.jornadaCalendarOpen = { key: key, viewMonthKey: null };
      }
      jornadaCalendarRefreshForKey(key);
      return;
    }
    var navBtn = e.target.closest('[data-jornada-cal-nav]');
    if(navBtn){
      var navParts = navBtn.getAttribute('data-jornada-cal-nav').split('|');
      var navKey = navParts[0], dir = navParts[1];
      if(state.jornadaCalendarOpen && state.jornadaCalendarOpen.key === navKey){
        var baseKey = state.jornadaCalendarOpen.viewMonthKey || getCurrentMonthKey();
        state.jornadaCalendarOpen.viewMonthKey = addMonthsToKey(baseKey, dir==='next'?1:-1);
        jornadaCalendarRefreshForKey(navKey);
      }
      return;
    }
    var pickBtn = e.target.closest('[data-jornada-cal-pick]');
    if(pickBtn){
      var pickParts = pickBtn.getAttribute('data-jornada-cal-pick').split('|');
      var pickKey = pickParts[0], dateStr = pickParts[1];

      updatePatientTask(pid, tid, 'dataAlvo', dateStr);
      state.jornadaCalendarOpen = null;
      jornadaCalendarRefreshForKey(pickKey);

    }

  function diasParaAniversario(nascStr){
    if(!nascStr) return null;
    var b = new Date(nascStr + 'T00:00:00');
    var today = new Date();
    today.setHours(0,0,0,0);
    var nextBday = new Date(today.getFullYear(), b.getMonth(), b.getDate());
    if(nextBday < today) nextBday = new Date(today.getFullYear() + 1, b.getMonth(), b.getDate());
    return Math.round((nextBday - today) / 86400000);
  }

  }

  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function addDaysIso(dateStr, n){
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return isoDate(d);
  }
  function nextBusinessDayIso(dateStr){
    var d = weekdayIndex(dateStr);
    if(d === 0) return addDaysIso(dateStr, 1);
    if(d === 6) return addDaysIso(dateStr, 2);
    return dateStr;
  }
  function firstFridayFrom(dateStr){
    var d = new Date(dateStr + 'T00:00:00');
    while(d.getDay() !== 5) d.setDate(d.getDate() + 1);
    return d;
  }
  function servicoToFoco(servico){
    if(servico === 'Treino + Dieta') return 'treino_dieta';
    if(servico === 'Treino') return 'treino';
    if(servico === 'Dieta') return 'dieta';
    return null;
  }
  function planoToTipo(plano){
    if(plano === 'Trimestral') return 'trimestral';
    if(plano === 'Semestral') return 'semestral';
    return null;
  }
  function gerarJornada(dataInicio, tipo, foco, variantId){
    var variant = getJornadaVariant(tipo, foco, variantId || 'default');
    var template = variant.tarefas;
    var sexta = firstFridayFrom(dataInicio);
    var sextaIso = isoDate(sexta);
    var sabadoIso = addDaysIso(sextaIso, 1);
    return template.map(function(t, idx){
      var dataAlvo;
      if(t.dia === 'primeira-sexta') dataAlvo = sextaIso;
      else if(t.dia === 'primeiro-sabado') dataAlvo = sabadoIso;
      else dataAlvo = nextBusinessDayIso(addDaysIso(dataInicio, t.dia));
      return { id: idx, nome: t.nome, fase: t.fase, dataAlvo: dataAlvo, concluido: false, dataConclusao: null, observacao: '', arquivado: false, ordem: idx };
    });
  }
  function resetJornadaTemplate(tipo, foco){
    var fresh = seedJornadaTemplates(JORNADA_TEMPLATES_DEFAULT)[tipo][foco][0].tarefas;
    getJornadaVariant(tipo, foco, 'default').tarefas = fresh;
    saveJornadaTemplates();
  }
  function addTemplateTask(tipo, foco, variantId, fase){
    var tplList = getJornadaVariant(tipo, foco, variantId).tarefas;
    var tplMaxOrdem = tplList.reduce(function(m,t){ return Math.max(m, t.ordem||0); }, -1);
    tplList.push({ fase: fase, nome: 'Nova tarefa', dia: 0, _tid: jornadaTemplateIdSeq++, ordem: tplMaxOrdem+1 });
    saveJornadaTemplates();
  }
  function removeTemplateTask(tipo, foco, variantId, tid){
    var list = getJornadaVariant(tipo, foco, variantId).tarefas;
    var idx = list.findIndex(function(t){ return t._tid === tid; });
    if(idx !== -1) list.splice(idx, 1);
    saveJornadaTemplates();
  }
  function updateTemplateTask(tipo, foco, variantId, tid, field, value){
    var task = getJornadaVariant(tipo, foco, variantId).tarefas.find(function(t){ return t._tid === tid; });
    if(!task) return;
    if(field === 'fase') task.fase = parseInt(value, 10);
    else if(field === 'dia') task.dia = parseInt(value, 10) || 0;
    else if(field === 'nome') task.nome = value;
    saveJornadaTemplates();
  }
  function jornadaTaskStatus(task){
    if(task.concluido) return 'concluido';
    var diff = diasParaVencer(task.dataAlvo);
    if(diff < 0) return 'atrasado';
    if(diff === 0) return 'hoje';
    if(diff <= 7) return 'semana';
    return 'futuro';
  }
  function jornadaKanbanColumns(){
    var byPatient = {};
    state.patients.forEach(function(p){
      if(!p.jornada || renovacaoStatus(p) === 'Vencido') return;
      p.jornada.tarefas.forEach(function(t){
        if(t.arquivado) return;
        var diff = diasParaVencer(t.dataAlvo);
        if(diff > 7) return;
        if(!byPatient[p.id]) byPatient[p.id] = { patient: p, tasks: [] };
        byPatient[p.id].tasks.push({ task: t, diff: diff });
      });
    });
    var columns = Object.keys(byPatient).map(function(id){ return byPatient[id]; });
    columns.forEach(function(col){
      col.minDiff = Math.min.apply(null, col.tasks.map(function(t){ return t.diff; }));
      col.tasks.sort(function(a,b){ return (a.task.ordem||0) - (b.task.ordem||0); });
    });
    columns.sort(function(a,b){
      var pa = PRIORITY_RANK[a.patient.prioridade], pb = PRIORITY_RANK[b.patient.prioridade];
      if(pa !== pb) return pa - pb;
      return a.minDiff - b.minDiff;
    });
    return columns;
  }
  function jornadaKanbanFilteredColumns(){
    var term = state.jornadaKanbanSearch.trim().toLowerCase();
    var columns = jornadaKanbanColumns().filter(function(col){
      var p = col.patient;
      if(term && p.nome.toLowerCase().indexOf(term) === -1) return false;
      if(state.jornadaKanbanPrioridadeFilter !== 'todos' && p.prioridade !== state.jornadaKanbanPrioridadeFilter) return false;
      if(state.jornadaKanbanStatusFilter !== 'todos' && renovacaoStatusSimplified(p) !== state.jornadaKanbanStatusFilter) return false;
      return true;
    });
    if(state.jornadaKanbanSortBy === 'nome'){
      var dir = state.jornadaKanbanSortDir === 'asc' ? 1 : -1;
      columns = columns.slice().sort(function(a,b){ return a.patient.nome.localeCompare(b.patient.nome, 'pt-BR') * dir; });
    }
    return columns;
  }
  function jornadaUrgencyCounts(){
    var counts = { atrasado:0, hoje:0, semana:0, concluido:0 };
    jornadaKanbanColumns().forEach(function(col){
      col.tasks.forEach(function(item){
        if(item.task.concluido){ counts.concluido++; return; }
        if(item.diff < 0) counts.atrasado++;
        else if(item.diff === 0) counts.hoje++;
        else counts.semana++;
      });
    });
    return counts;
  }
  function jornadaUrgencyChartHtml(){
    var c = jornadaUrgencyCounts();
    var bars = [
      { label:'Atrasado', value:c.atrasado, cls:'chart-bar-danger' },
      { label:'Hoje', value:c.hoje, cls:'chart-bar-warning' },
      { label:'Essa Semana', value:c.semana, cls:'chart-bar-gray' },
      { label:'Concluído', value:c.concluido, cls:'chart-bar-success' }
    ];
    var total = c.atrasado + c.hoje + c.semana + c.concluido;
    if(!total){
      return '<div class="empty-state">Nenhum dado ainda pra mostrar no gráfico.</div>';
    }
    var max = Math.max.apply(null, bars.map(function(b){ return b.value; }).concat([1]));
    return '<div class="jornada-chart">'+bars.map(function(b){
      var pct = Math.round((b.value/max)*100);
      return ''+
        '<div class="jornada-chart-row">'+
          '<div class="jornada-chart-label">'+b.label+'</div>'+
          '<div class="jornada-chart-track"><div class="jornada-chart-fill '+b.cls+'" style="width:'+pct+'%;"></div></div>'+
          '<div class="jornada-chart-value">'+b.value+'</div>'+
        '</div>';
    }).join('')+'</div>';
  }
  function jornadaAfazeresGroups(){
    var byPatient = {};
    jornadaKanbanColumns().forEach(function(col){
      col.tasks.forEach(function(item){
        if(item.diff > 0) return;
        if(!byPatient[col.patient.id]) byPatient[col.patient.id] = { patient: col.patient, items: [] };
        byPatient[col.patient.id].items.push(item);
      });
    });
    var groups = Object.keys(byPatient).map(function(id){ return byPatient[id]; });
    groups.forEach(function(g){
      g.items.sort(function(a,b){
        if(a.task.concluido !== b.task.concluido) return a.task.concluido ? 1 : -1;
        return a.diff - b.diff;
      });
    });
    groups.sort(function(a,b){
      var pa = PRIORITY_RANK[a.patient.prioridade], pb = PRIORITY_RANK[b.patient.prioridade];
      if(pa !== pb) return pa - pb;
      return a.items[0].diff - b.items[0].diff;
    });
    return groups;
  }

  function jornadaResumoModeloOptions(){
    var set = {};
    state.patients.forEach(function(p){
      if(!p.jornada || renovacaoStatus(p) === 'Vencido') return;
      set[p.jornada.modeloNome || defaultVariantLabel(p.jornada.tipo, p.jornada.foco)] = true;
    });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'pt-BR'); });
  }
  function jornadaResumoFilteredSorted(){
    var term = state.jornadaResumoSearch.trim().toLowerCase();
    var list = state.patients.filter(function(p){
      if(!p.jornada || renovacaoStatus(p) === 'Vencido') return false;
      if(term && p.nome.toLowerCase().indexOf(term) === -1) return false;
      if(state.jornadaResumoTipoFilter !== 'todos' && p.jornada.tipo !== state.jornadaResumoTipoFilter) return false;
      if(state.jornadaResumoModeloFilter !== 'todos'){
        var modeloNome = p.jornada.modeloNome || defaultVariantLabel(p.jornada.tipo, p.jornada.foco);
        if(modeloNome !== state.jornadaResumoModeloFilter) return false;
      }
      return true;
    });
    var dir = state.jornadaResumoSortDir === 'asc' ? 1 : -1;
    var col = state.jornadaResumoSortBy;
    function progresso(p){
      var total = p.jornada.tarefas.length;
      return total ? p.jornada.tarefas.filter(function(t){ return t.concluido; }).length/total : 0;
    }
    list.sort(function(a,b){
      var av, bv;
      if(col === 'dataInicio'){ av = a.jornada.dataInicio; bv = b.jornada.dataInicio; }
      else if(col === 'dataFimPrevista'){ av = a.jornada.dataFimPrevista; bv = b.jornada.dataFimPrevista; }
      else if(col === 'progresso'){ av = progresso(a); bv = progresso(b); }
      else { av = a.nome.toLowerCase(); bv = b.nome.toLowerCase(); }
      if(av < bv) return -1*dir;
      if(av > bv) return 1*dir;
      return a.nome.localeCompare(b.nome, 'pt-BR');
    });
    return list;
  }
  function jornadaResumoSortArrow(col){
    if(state.jornadaResumoSortBy !== col) return '';
    return ' <span class="sort-arrow">' + (state.jornadaResumoSortDir === 'asc' ? '▲' : '▼') + '</span>';
  }
  function jornadaResumoRows(){
    var list = jornadaResumoFilteredSorted();
    if(!list.length){
      return '<tr><td colspan="6"><div class="empty-state">Nenhum paciente encontrado.</div></td></tr>';
    }
    return list.map(function(p){
      var total = p.jornada.tarefas.length;
      var feitas = p.jornada.tarefas.filter(function(t){ return t.concluido; }).length;
      var pct = total ? Math.round(feitas/total*100) : 0;
      var modeloNome = p.jornada.modeloNome || defaultVariantLabel(p.jornada.tipo, p.jornada.foco);
      return '<tr>'+
        '<td><button class="link-btn" data-open-profile="'+p.id+'">'+esc(p.nome)+' '+renovacaoStatusEmoji(p)+'</button></td>'+
        '<td>'+(p.jornada.tipo==='trimestral'?'Trimestral':'Semestral')+'</td>'+
        '<td>'+esc(modeloNome)+'</td>'+
        '<td class="cell-muted">'+formatDate(p.jornada.dataInicio)+'</td>'+

      '</tr>';
    }).join('');
  }

  function jornadaVariantOptionsHtml(selectedValue, includeNenhuma){
    var all = allJornadaVariantsFlat();

    var custom = all.filter(function(v){ return !getJornadaVariant(v.tipo, v.foco, v.variantId).isDefault; });
    function opt(v){ return '<option value="'+esc(v.value)+'"'+(v.value===selectedValue?' selected':'')+'>'+esc(v.label)+'</option>'; }
    var html = includeNenhuma ? '<option value=""'+(selectedValue===''?' selected':'')+'>Nenhuma</option>' : '';
    html += '<optgroup label="Modelos Padrão">'+defaults.map(opt).join('')+'</optgroup>';
    if(custom.length){
      html += '<optgroup label="Modelos Personalizados">'+custom.map(opt).join('')+'</optgroup>';

  /* ================= DASHBOARD ================= */
  function computeKPIs(){
    var today = new Date();
    today.setHours(0,0,0,0);
    var ativos = 0, vencendo = 0, consultaProximo = 0;
    state.patients.forEach(function(p){
      if(renovacaoStatus(p) !== 'Vencido') ativos++;
      if(consultaStatus(p) === 'proximo') consultaProximo++;
      if(p.vencimento){
        var v = new Date(p.vencimento + 'T00:00:00');
        var diff = Math.ceil((v - today) / 86400000);
        if(diff >= 0 && diff <= 15) vencendo++;
      }
    });
    return { ativos: ativos, vencendo: vencendo, consultaProximo: consultaProximo };
  }
  function ultimosPacientes(){
    var today = new Date();
    today.setHours(0,0,0,0);
    return state.patients.filter(function(p){
      if(renovacaoStatus(p) === 'Vencido') return false;
      if(p.prioridade === 'Modo Bebezinho') return true;
      if(!p.createdDate) return false;
      var created = new Date(p.createdDate + 'T00:00:00');
      var diffDays = Math.floor((today - created) / 86400000);
      return diffDays <= 30;
    }).sort(function(a,b){ return b.createdAt - a.createdAt; });
  }
  var DASHBOARD_FILTER_META = {
    ativos: { title: 'Pacientes Ativos' },
    vencendo: { title: 'Vencendo em 15 dias' },

    aniversariantes: { title: 'Aniversariantes da Semana' },
    inativos: { title: 'Pacientes Inativos' },
    treinoVencido: { title: 'Ficha de Treino Vencida' },
    treinoAVencer: { title: 'Ficha de Treino a Vencer' },
    renovacaoAntecipada: { title: 'Renovação Antecipada' }
  };
  function dashboardFilterPatients(key){
    var today = new Date();
    today.setHours(0,0,0,0);
    var list = state.patients.filter(function(p){
      if(key === 'ativos') return renovacaoStatus(p) !== 'Vencido';
      if(key === 'vencendo'){
        if(!p.vencimento) return false;
        var v = new Date(p.vencimento + 'T00:00:00');
        var diff = Math.ceil((v - today) / 86400000);
        return diff >= 0 && diff <= 15;
      }
      if(key === 'consulta') return consultaStatus(p) === 'proximo';
      if(key === 'inativos') return renovacaoStatus(p) === 'Vencido';
      if(key === 'renovacaoAntecipada') return renovacaoStatus(p) === 'Renovação antecipada';
      return false;
    });
    return list.sort(function(a,b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
  }

  function pacientesEmRisco(monthKey){
    return state.patients.filter(function(p){ return renovacaoStatus(p) !== 'Vencido' && engagementRisk(p, monthKey).atRisk; })
      .sort(function(a,b){
        var ra = engagementRisk(a, monthKey).avg, rb = engagementRisk(b, monthKey).avg;
        if(ra === null) return -1;
        if(rb === null) return 1;
        return ra - rb;
      });
  }
  var MONTH_ABBR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  function monthShortLabel(key){
    var p = parseMonthKey(key);

  }
  function lastNMonths(n){
    var result = [];
    var base = new Date();
    base.setDate(1);
    for(var i=n-1;i>=0;i--){
      var dt = new Date(base.getFullYear(), base.getMonth()-i, 1);
      result.push(monthKeyOf(dt));
    }
    return result;
  }
  function monthlyEngagementAvg(monthKey){
    var vals = [];
    state.patients.forEach(function(p){
      if(renovacaoStatus(p) === 'Vencido') return;
      getMonthData(p, monthKey).engajamento.forEach(function(v){ if(v !== null && v !== undefined) vals.push(v); });
    });
    if(!vals.length) return null;
    return vals.reduce(function(a,b){ return a+b; }, 0) / vals.length;
  }
  function monthlyCheckinPct(monthKey){
    var sim = 0, nao = 0;
    state.patients.forEach(function(p){
      if(renovacaoStatus(p) === 'Vencido') return;
      getMonthData(p, monthKey).checkin.forEach(function(v){ if(v === true) sim++; else if(v === false) nao++; });
    });
    var total = sim + nao;
    if(!total) return null;
    return Math.round((sim/total)*100);
  }

  function monthlyTrendChartHtml(metricKey, months, valueFn, formatFn, colorClass){
    var points = months.map(function(k){ return { key: k, value: valueFn(k) }; });
    var max = Math.max.apply(null, points.map(function(p){ return p.value || 0; }).concat([1]));
    var currentMonth = getCurrentMonthKey();
    var drill = state.dashboardTrendDrill;
    return '<div class="monthly-trend-chart">'+points.map(function(p){
      var pct = p.value ? Math.max(Math.round((p.value/max)*100), 4) : 0;
      var label = (p.value === null || p.value === undefined) ? '—' : formatFn(p.value);
      var isCurrent = p.key === currentMonth;
      var isSelected = drill && drill.metric === metricKey && drill.monthKey === p.key;
      return ''+
        '<button type="button" class="monthly-trend-col'+(isSelected?' selected':'')+'" data-trend-drill-metric="'+metricKey+'" data-trend-drill-month="'+p.key+'" title="'+esc(monthLabel(p.key))+': '+esc(label)+'">'+
          '<div class="monthly-trend-value">'+label+'</div>'+
          '<div class="monthly-trend-track"><div class="monthly-trend-fill '+colorClass+(isCurrent?' current':'')+'" style="height:'+pct+'%;"></div></div>'+
          '<div class="monthly-trend-label">'+monthShortLabel(p.key)+'</div>'+
        '</button>';
    }).join('')+'</div>';
  }
  function trendDrillRowsHtml(metric, monthKey){
    if(metric === 'risco'){
      var riscoList = pacientesEmRisco(monthKey);
      if(!riscoList.length) return '<div class="empty-state">Nenhum paciente em risco nesse mês.</div>';
      return '<table><thead><tr><th>Nome</th><th>Engajamento Médio</th><th>Check-ins</th><th>Prioridade</th></tr></thead><tbody>'+
        riscoList.map(function(p){
          var r = engagementRisk(p, monthKey);
          var avgText = r.avg === null ? '—' : r.avg.toFixed(1);
          return '<tr><td><button class="link-btn" data-open-profile="'+p.id+'">'+esc(p.nome)+'</button></td><td><span class="badge '+avgBadgeClass(r.avg)+'">'+avgText+'</span></td><td>'+r.sent+'/'+r.total+' enviados</td><td>'+priorityBadge(p.prioridade)+'</td></tr>';
        }).join('')+'</tbody></table>';
    }
    if(metric === 'novos'){
      var novosList = state.patients.filter(function(p){ return p.isNovoPaciente !== false && p.createdDate && p.createdDate.slice(0,7) === monthKey; });
      if(!novosList.length) return '<div class="empty-state">Nenhum paciente novo nesse mês.</div>';
      return '<table><thead><tr><th>Nome</th><th>Data de Cadastro</th></tr></thead><tbody>'+
        novosList.map(function(p){ return '<tr><td><button class="link-btn" data-open-profile="'+p.id+'">'+esc(p.nome)+'</button></td><td class="cell-muted">'+formatDate(p.createdDate)+'</td></tr>'; }).join('')+
        '</tbody></table>';
    }
    var rows = state.patients.filter(function(p){ return renovacaoStatus(p) !== 'Vencido'; })
      .map(function(p){ return { p: p, r: engagementRisk(p, monthKey) }; })
      .filter(function(x){ return x.r.avg !== null || x.r.total > 0; });
    if(!rows.length) return '<div class="empty-state">Nenhum dado registrado nesse mês.</div>';
    if(metric === 'engajamento'){
      rows.sort(function(a,b){
        if(a.r.avg === null) return 1;
        if(b.r.avg === null) return -1;
        return a.r.avg - b.r.avg;
      });
      return '<table><thead><tr><th>Nome</th><th>Engajamento Médio</th></tr></thead><tbody>'+

        }).join('')+'</tbody></table>';
    }
    rows.sort(function(a,b){
      var pa = a.r.total ? a.r.sent/a.r.total : 1;
      var pb = b.r.total ? b.r.sent/b.r.total : 1;
      return pa - pb;
    });
    return '<table><thead><tr><th>Nome</th><th>Check-ins</th></tr></thead><tbody>'+
      rows.map(function(x){
        return '<tr><td><button class="link-btn" data-open-profile="'+x.p.id+'">'+esc(x.p.nome)+'</button></td><td>'+x.r.sent+'/'+x.r.total+' enviados</td></tr>';
      }).join('')+'</tbody></table>';
  }

  function updatePatientTask(patientId, taskId, field, value){

    var task = p.jornada.tarefas.filter(function(t){ return t.id === taskId; })[0];

  function reorderPatientTasks(patientId, orderedTaskIds){
    var p = getPatient(patientId);

    orderedTaskIds.forEach(function(tid, idx){

  function reorderTemplateTasks(tipo, foco, variantId, orderedTids){

    orderedTids.forEach(function(tid, idx){

      if(task) task.ordem = idx;
    });

  function addPatientTask(patientId, fase){
    var p = getPatient(patientId);
    if(!p || !p.jornada) return;
    var maxId = p.jornada.tarefas.reduce(function(m,t){ return Math.max(m, t.id); }, -1);
    var maxOrdem = p.jornada.tarefas.reduce(function(m,t){ return Math.max(m, t.ordem||0); }, -1);
    p.jornada.tarefas.push({ id: maxId+1, nome: 'Nova tarefa', fase: fase, dataAlvo: todayISODate(), concluido: false, dataConclusao: null, observacao: '', arquivado: false, ordem: maxOrdem+1 });
    savePatients();
  }
  function removePatientTask(patientId, taskId){
    var p = getPatient(patientId);
    if(!p || !p.jornada) return;
    var idx = p.jornada.tarefas.findIndex(function(t){ return t.id === taskId; });
    if(idx !== -1) p.jornada.tarefas.splice(idx, 1);
    savePatients();
  }

  /* ---- Fichas de Treino ---- */
  function temServicoTreino(p){
    return !!p && typeof p.servico === 'string' && p.servico.indexOf('Treino') !== -1;
  }
  function temServicoDieta(p){
    return !!p && typeof p.servico === 'string' && p.servico.indexOf('Dieta') !== -1;
  }
  function sortFichas(list){
    return (list || []).slice().sort(function(a,b){
      if(a.dataPassado !== b.dataPassado) return a.dataPassado < b.dataPassado ? 1 : -1;
      return b.id - a.id;
    });
  }
  function fichasTreinoOrdenadas(p){
    return sortFichas(p.fichasTreino);
  }
  function currentFichaTreino(p){
    return fichasTreinoOrdenadas(p)[0] || null;
  }
  function fichaTreinoDiasStatus(dataVencimento){
    if(!dataVencimento) return null;
    var diff = diasParaVencer(dataVencimento);
    if(diff < 0) return 'vencido';
    if(diff <= 15) return 'avencer';
    return 'emdia';
  }
  function addFichaTreino(patientId){
    var p = getPatient(patientId);
    if(!p) return;
    if(!p.fichasTreino) p.fichasTreino = [];
    var maxId = p.fichasTreino.reduce(function(m,f){ return Math.max(m, f.id); }, -1);
    var id = maxId + 1;
    p.fichasTreino.push({ id: id, dataPassado: todayISODate(), dataVencimento: '', expectativa: '', volumePorGrupo: {} });
    if(!state.fichaTreinoOpen[patientId]) state.fichaTreinoOpen[patientId] = {};
    state.fichaTreinoOpen[patientId][id] = true;
    savePatients();
  }
  function fichasDietaOrdenadas(p){
    return sortFichas(p.fichasDieta);
  }
  function addFichaDieta(patientId){
    var p = getPatient(patientId);
    if(!p) return;
    if(!p.fichasDieta) p.fichasDieta = [];
    var maxId = p.fichasDieta.reduce(function(m,f){ return Math.max(m, f.id); }, -1);
    var id = maxId + 1;
    p.fichasDieta.push({ id: id, dataPassado: todayISODate(), dataVencimento: '', expectativa: '', calorias: '', proteinas: '', carboidratos: '', gorduras: '' });
    if(!state.fichaDietaOpen[patientId]) state.fichaDietaOpen[patientId] = {};
    state.fichaDietaOpen[patientId][id] = true;
    savePatients();
  }

  /* ---- Acesso Rápido (Dashboard) ---- */
  function pacientesSemVigencia(){
    return state.patients.filter(function(p){
      return renovacaoStatus(p) !== 'Vencido' && !p.vencimento;
    }).sort(function(a,b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
  }
  function pacientesSemConsultaMarcada(){
    return state.patients.filter(function(p){
      if(renovacaoStatus(p) === 'Vencido') return false;
      var status = consultaStatus(p);
      return status === 'atrasado' || status === 'semdata';
    }).sort(function(a,b){ return a.nome.localeCompare(b.nome, 'pt-BR'); });
  }
  function pacientesVencimentosList(sortDir){
    var list = state.patients.filter(function(p){
      return renovacaoStatus(p) !== 'Vencido' && p.vencimento;
    });
    list.sort(function(a,b){
      if(a.vencimento === b.vencimento) return a.nome.localeCompare(b.nome, 'pt-BR');
      if(sortDir === 'asc') return a.vencimento < b.vencimento ? -1 : 1;
      return a.vencimento > b.vencimento ? -1 : 1;
    });
    return list;
  }
  function pacientesSemAtualizacao(kind, sortDir){
    var temServico = kind === 'treino' ? temServicoTreino : temServicoDieta;
    var fichasOrdenadas = kind === 'treino' ? fichasTreinoOrdenadas : fichasDietaOrdenadas;
    var list = state.patients.filter(function(p){
      return renovacaoStatus(p) !== 'Vencido' && temServico(p);
    }).map(function(p){
      var ultima = fichasOrdenadas(p)[0] || null;
      var dias = ultima ? daysBetween(ultima.dataPassado, todayISODate()) : null;
      return { p: p, dias: dias };
    });
    list.sort(function(a,b){
      var av = a.dias === null ? Infinity : a.dias;
      var bv = b.dias === null ? Infinity : b.dias;
      if(av === bv) return a.p.nome.localeCompare(b.p.nome, 'pt-BR');
      return sortDir === 'asc' ? av - bv : bv - av;
    });
    return list;
  }

  function compareChipsAndPicker(available, selectedIds, removeAttr, addAttr, addId){
    var chrono = selectedIds.map(function(id){ return available.filter(function(f){ return f.id===id; })[0]; }).filter(Boolean)
      .sort(function(a,b){ return a.dataPassado < b.dataPassado ? -1 : (a.dataPassado > b.dataPassado ? 1 : 0); });
    var chipsHtml = chrono.map(function(f, idx){
      return '<span class="compare-chip" style="border-color:'+chartColorFor(idx)+';"><span class="compare-chip-dot" style="background:'+chartColorFor(idx)+';"></span>'+formatDate(f.dataPassado)+'<button type="button" data-'+removeAttr+'="'+f.id+'" aria-label="Remover data">×</button></span>';
    }).join('');
    var optionsHtml = available.filter(function(f){ return selectedIds.indexOf(f.id) === -1; })
      .map(function(f){ return '<option value="'+f.id+'">'+formatDate(f.dataPassado)+'</option>'; }).join('');
    var picker = '<select data-'+addAttr+'="'+addId+'"><option value="">+ Adicionar data pra comparar...</option>'+optionsHtml+'</select>';
    return { chrono: chrono, html: '<div class="compare-chips">'+chipsHtml+picker+'</div>' };
  }
  function fmtNum(v){ return v % 1 === 0 ? String(v) : v.toFixed(1); }
  function compareBarsHtml(categories, chrono, getVal){
    var max = 0;
    categories.forEach(function(cat){ chrono.forEach(function(f){ max = Math.max(max, getVal(f, cat)); }); });
    if(max <= 0) max = 1;
    return categories.map(function(cat){
      var cols = chrono.map(function(f, idx){
        var val = getVal(f, cat);
        var pct = val>0 ? Math.max(Math.round((val/max)*100), 4) : 0;
        return '<div class="volume-compare-bar-col"><div class="volume-compare-bar-val">'+(val?fmtNum(val):'')+'</div><div class="volume-compare-bar" style="height:'+pct+'%;background:'+chartColorFor(idx)+';"></div></div>';
      }).join('');
      return '<div class="volume-compare-group"><div class="volume-compare-bars">'+cols+'</div><div class="volume-compare-label">'+esc(cat.label||cat)+'</div></div>';
    }).join('');
  }
  function compareLegendHtml(chrono){
    return '<div class="compare-legend">'+chrono.map(function(f,idx){
      return '<span class="compare-legend-item"><span class="compare-chip-dot" style="background:'+chartColorFor(idx)+';"></span>'+formatDate(f.dataPassado)+'</span>';
    }).join('')+'</div>';
  }

    return fichasTreinoOrdenadas(p).filter(function(f){

  function volumeCompareBodyHtml(p){
    var selectedIds = state.volumeCompareSelected[p.id] || [];
    var available = fichasTreinoComVolume(p);
    var cp = compareChipsAndPicker(available, selectedIds, 'volume-compare-remove', 'volume-compare-add', p.id);
    if(!available.length) return { chips: cp.html, chart: '<div class="empty-state" style="padding:12px;">Nenhuma ficha com volume por grupo muscular registrado ainda.</div>' };
    var chrono = cp.chrono;
    if(!chrono.length) return { chips: cp.html, chart: '<div class="empty-state" style="padding:12px;">Selecione uma data pra ver o gráfico (ou 2+ pra comparar).</div>' };
    var sortDir = state.volumeCompareSortDir;
    var groups = state.grupoMuscularList.filter(function(g){
      return chrono.some(function(f){ return (f.volumePorGrupo[g]||0) > 0; });
    });
    if(sortDir !== 'default'){
      var totals = {};
      groups.forEach(function(g){ totals[g] = chrono.reduce(function(sum,f){ return sum + (f.volumePorGrupo[g]||0); }, 0); });
      groups = groups.slice().sort(function(a,b){ return sortDir==='asc' ? totals[a]-totals[b] : totals[b]-totals[a]; });
    }
    var bars = compareBarsHtml(groups, chrono, function(f, g){ return f.volumePorGrupo[g] || 0; });
    var summary = '';
    if(chrono.length >= 2){
      var first = chrono[0], last = chrono[chrono.length-1];
      var totalFirst = 0, totalLast = 0;
      var deltas = groups.map(function(g){
        var vf = first.volumePorGrupo[g]||0, vl = last.volumePorGrupo[g]||0;
        totalFirst += vf; totalLast += vl;
        return { grupo: g, delta: vl - vf };
      });
      var totalDelta = totalLast - totalFirst;
      var pct = totalFirst ? (totalDelta/totalFirst*100) : 0;
      deltas.sort(function(a,b){ return Math.abs(b.delta) - Math.abs(a.delta); });
      var top3 = deltas.slice(0,3).filter(function(d){ return d.delta !== 0; });
      summary = '<div class="cell-muted" style="margin-top:8px;">Volume total ('+formatDate(first.dataPassado)+' → '+formatDate(last.dataPassado)+'): '+
        (totalDelta>=0?'↑ +':'↓ ')+totalDelta.toFixed(1)+' ('+(pct>=0?'+':'')+pct.toFixed(1)+'%)'+
        (top3.length ? ' · Maiores variações: '+top3.map(function(d){ return esc(d.grupo)+' '+(d.delta>=0?'↑ +':'↓ ')+d.delta.toFixed(1); }).join(', ') : '')+
      '</div>';
    }
    return { chips: cp.html, chart: compareLegendHtml(chrono) + '<div class="volume-compare-chart">'+bars+'</div>' + summary };
  }

  var PRIORITY_RANK = { 'Modo Bebezinho': 0, 'Urgente': 1, 'Moderada': 2, 'Sem urgência': 3 };
  function comparePatients(a, b){
    var dir = state.sortDir === 'asc' ? 1 : -1;
    var col = state.sortBy;
    var av, bv;
    if(col === 'prioridade'){
      av = PRIORITY_RANK[a.prioridade]; bv = PRIORITY_RANK[b.prioridade];
    } else if(col === 'renovacao'){
      av = RENOVACAO_RANK[renovacaoStatus(a)]; bv = RENOVACAO_RANK[renovacaoStatus(b)];
    } else {
      av = (a[col] || '').toString().toLowerCase();
      bv = (b[col] || '').toString().toLowerCase();
    }
    if(av < bv) return -1 * dir;
    if(av > bv) return 1 * dir;
    return a.nome.localeCompare(b.nome, 'pt-BR');
  }
  function sortArrow(col){
    if(state.sortBy !== col) return '';
    return ' <span class="sort-arrow">' + (state.sortDir === 'asc' ? '▲' : '▼') + '</span>';
  }
  function filteredPatients(){
    var term = state.search.trim().toLowerCase();
    return state.patients.filter(function(p){
      if(renovacaoStatus(p) === 'Vencido') return false;
      var matchesSearch = !term || p.nome.toLowerCase().indexOf(term) !== -1;
      var matchesStatus = state.statusFilter === 'todos' || renovacaoStatus(p) === state.statusFilter;
      var matchesPlano = state.planoFilter === 'todos' || p.plano === state.planoFilter;
      var matchesPrioridade = state.prioridadeFilter === 'todos' || p.prioridade === state.prioridadeFilter;
      return matchesSearch && matchesStatus && matchesPlano && matchesPrioridade;
    }).sort(comparePatients);
  }

  function overviewFilteredPatients(monthKey){
    var term = state.overviewNomeFilter.trim().toLowerCase();
    var list = state.patients.filter(function(p){
      if(renovacaoStatus(p) === 'Vencido') return false;
      if(term && p.nome.toLowerCase().indexOf(term) === -1) return false;
      if(state.overviewConsultaFilter !== 'todos' && consultaStatus(p) !== state.overviewConsultaFilter) return false;
      return true;
    });
    var withRisk = list.map(function(p){ return { p: p, r: engagementRisk(p, monthKey) }; });
    if(state.overviewMediaFilter !== 'todos'){
      withRisk = withRisk.filter(function(x){ return mediaBand(x.r.avg) === state.overviewMediaFilter; });
    }
    withRisk.sort(function(a,b){
      var av = a.r.avg, bv = b.r.avg;
      if(av === null && bv === null) return a.p.nome.localeCompare(b.p.nome, 'pt-BR');
      if(av === null) return 1;
      if(bv === null) return -1;
      if(av !== bv) return av - bv;
      return a.p.nome.localeCompare(b.p.nome, 'pt-BR');
    });
    return withRisk;
  }

  function weekMiniCalendarHtml(monthKey){
    var parsed = parseMonthKey(monthKey);
    var year = parsed.year, month = parsed.month;
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var fridays = [];
    for(var day=1; day<=daysInMonth; day++){
      if(new Date(year, month, day).getDay() === 5) fridays.push(day);
    }
    var startWeekday = new Date(year, month, 1).getDay();
    var weekdayHeaders = ['D','S','T','Q','Q','S','S'].map(function(w){ return '<span class="jornada-cal-wd">'+w+'</span>'; }).join('');
    var cells = '';
    for(var i=0;i<startWeekday;i++){ cells += '<span class="jornada-cal-cell empty"></span>'; }
    for(day=1; day<=daysInMonth; day++){
      var weekIdx = -1;
      for(var f=0; f<fridays.length; f++){ if(day <= fridays[f]){ weekIdx = f; break; } }
      var isFriday = fridays.indexOf(day) !== -1;
      var style = weekIdx !== -1 ? 'background:'+chartColorFor(weekIdx)+'33;' : '';
      if(isFriday) style += 'font-weight:700;box-shadow:inset 0 0 0 1.5px '+chartColorFor(weekIdx)+';';
      cells += '<span class="jornada-cal-cell readonly-cal-cell" style="'+style+'border-radius:5px;">'+day+'</span>';
    }
    var legend = fridays.map(function(f,i){
      return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px;">'+
        '<span style="width:11px;height:11px;border-radius:3px;background:'+chartColorFor(i)+';display:inline-block;flex-shrink:0;"></span>'+
        'Sem '+(i+1)+' — check-in dia '+f+' ('+monthLabel(monthKey)+')'+
      '</div>';
    }).join('');
    return '<div style="max-width:260px;">'+
      '<div class="jornada-cal-grid" style="margin-bottom:4px;">'+weekdayHeaders+cells+'</div>'+
      legend+
    '</div>';
  }

  var MAIN_TABLE_FILTER_KEYS = ['planoFilter','prioridadeFilter','statusFilter'];

  function attachPacientesEvents(){
    var content = document.getElementById('content');
    document.getElementById('searchInput').addEventListener('input', function(e){
      state.search = e.target.value;
      refreshPatientsTable();
    });
    document.getElementById('pacientesTableToggleBtn').addEventListener('click', function(){
      state.pacientesTableCollapsed = !state.pacientesTableCollapsed;
      document.getElementById('pacientesTableWrap').style.display = state.pacientesTableCollapsed ? 'none' : '';
      this.textContent = state.pacientesTableCollapsed ? 'Mostrar' : 'Recolher';
    });
    document.getElementById('visaoGeralToggleBtn').addEventListener('click', function(){
      state.visaoGeralCollapsed = !state.visaoGeralCollapsed;
      document.getElementById('visaoGeralWrap').style.display = state.visaoGeralCollapsed ? 'none' : '';
      this.textContent = state.visaoGeralCollapsed ? 'Mostrar' : 'Recolher';
    });
    document.getElementById('materialPendenteToggleBtn').addEventListener('click', function(){
      state.materialPendenteCollapsed = !state.materialPendenteCollapsed;
      document.getElementById('materialPendenteWrap').style.display = state.materialPendenteCollapsed ? 'none' : '';
      this.textContent = state.materialPendenteCollapsed ? 'Mostrar' : 'Recolher';
    });
    var overviewNomeInput = document.getElementById('overviewNomeFilterInput');
    if(overviewNomeInput){
      overviewNomeInput.addEventListener('input', function(e){
        state.overviewNomeFilter = e.target.value;
        e.target.closest('.th-filter').classList.toggle('active', e.target.value.trim() !== '');
        refreshOverviewTable();
      });
    }
    content.addEventListener('click', function(e){
      var weekEditBtn = e.target.closest('[data-week-edit]');
      if(weekEditBtn){
        var parts = weekEditBtn.getAttribute('data-week-edit').split('|');
        openWeekEditModal(parseInt(parts[0],10), parseInt(parts[1],10));
        return;
      }
      var pesoToggle = e.target.closest('[data-peso-toggle]');
      if(pesoToggle){
        var pid = parseInt(pesoToggle.getAttribute('data-peso-toggle'),10);
        state.pesoHistoryOpen[pid] = !state.pesoHistoryOpen[pid];
        refreshOverviewTable();
        return;
      }
      var pesoAddOpen = e.target.closest('[data-peso-add-open]');
      if(pesoAddOpen){
        state.pesoEditingKey = 'add|'+pesoAddOpen.getAttribute('data-peso-add-open');
        refreshOverviewTable();
        return;
      }
      var pesoAddSave = e.target.closest('[data-peso-add-save]');
      if(pesoAddSave){
        var addPid = parseInt(pesoAddSave.getAttribute('data-peso-add-save'),10);
        var addDate = document.getElementById('pesoAddDate').value;
        var addValue = parseFloat(document.getElementById('pesoAddValue').value);
        if(!addDate || isNaN(addValue)){
          showToast('Preencha data e peso.', 'danger');
          return;
        }
        var addMonthKey = addDate.slice(0,7);
        var addWeekIndex = weekIndexForDate(addMonthKey, addDate);
        updatePesoEntry(addPid, addMonthKey, addWeekIndex, addValue, addDate);
        state.pesoEditingKey = null;
        refreshOverviewTable();
        showToast('Peso registrado.', 'success');
        return;
      }
      var pesoEditOpen = e.target.closest('[data-peso-edit-open]');
      if(pesoEditOpen){
        state.pesoEditingKey = pesoEditOpen.getAttribute('data-peso-edit-open');
        refreshOverviewTable();
        return;
      }
      var pesoEditCancel = e.target.closest('[data-peso-edit-cancel]');
      if(pesoEditCancel){
        state.pesoEditingKey = null;
        refreshOverviewTable();
        return;
      }
      var pesoEditSave = e.target.closest('[data-peso-edit-save]');
      if(pesoEditSave){
        var editKey = pesoEditSave.getAttribute('data-peso-edit-save').split('|');
        var editPid = parseInt(editKey[0],10), editMonthKey = editKey[1], editWeekIndex = parseInt(editKey[2],10);
        var editDate = document.getElementById('pesoEditDate').value;
        var editValue = parseFloat(document.getElementById('pesoEditValue').value);
        if(!editDate || isNaN(editValue)){
          showToast('Preencha data e peso.', 'danger');
          return;
        }
        updatePesoEntry(editPid, editMonthKey, editWeekIndex, editValue, editDate);
        state.pesoEditingKey = null;
        refreshOverviewTable();
        showToast('Peso atualizado.', 'success');
        return;
      }
      var toggle = e.target.closest('[data-filter-toggle]');
      if(toggle){
        var key = toggle.getAttribute('data-filter-toggle');
        var menu = toggle.closest('.th-filter').querySelector('.filter-menu');
        var willOpen = !menu.classList.contains('open');
        document.querySelectorAll('.filter-menu.open').forEach(function(m){ m.classList.remove('open'); });
        if(willOpen) menu.classList.add('open');
        document.querySelectorAll('.card').forEach(function(c){
          c.classList.toggle('menu-open', !!c.querySelector('.filter-menu.open'));
        });
        if(willOpen && key === 'overviewNomeFilter' && overviewNomeInput){
          overviewNomeInput.focus();
        }
        return;
      }
      var option = e.target.closest('.filter-menu-option');
      if(option){
        var fKey = option.getAttribute('data-filter-key');
        var fValue = option.getAttribute('data-filter-value');
        applyFilterSelection(fKey, fValue);
        if(MAIN_TABLE_FILTER_KEYS.indexOf(fKey) !== -1) refreshPatientsTable();
        if(OVERVIEW_FILTER_KEYS.indexOf(fKey) !== -1) refreshOverviewTable();
      }
    });
    document.getElementById('pacientesCompetenciaSelect').addEventListener('change', function(){
      state.competencia = this.value;
      render();
    });
    document.getElementById('newPatientBtn').addEventListener('click', function(){
      openFormModal('add', null);
    });
    document.getElementById('exportBtn').addEventListener('click', exportData);
    var importInput = document.getElementById('importFileInput');
    document.getElementById('importBtn').addEventListener('click', function(){
      importInput.click();
    });
    importInput.addEventListener('change', function(){
      handleImportFile(this.files[0]);
      this.value = '';
    });
    var sortHeaders = content.querySelectorAll('.th-sort');
    for(var s=0;s<sortHeaders.length;s++){
      sortHeaders[s].addEventListener('click', function(){
        var col = this.getAttribute('data-sort');
        if(state.sortBy === col){
          state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortBy = col;
          state.sortDir = 'asc';
        }
        render();
      });
    }
    bindProfileOpeners(content);
    bindRowActions(content);
    bindInfoIcons(content);
  }

  function exportData(){
    var dataStr = JSON.stringify(state.patients, null, 2);
    var blob = new Blob([dataStr], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'angelo-garcia-pacientes-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup exportado com sucesso.', 'success');
  }
  function handleImportFile(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var parsed;
      try{
        parsed = JSON.parse(e.target.result);
        if(!Array.isArray(parsed)) throw new Error('formato inválido');
      }catch(err){
        alert('Arquivo inválido. Selecione um backup JSON exportado pelo CRM.');
        return;
      }
      var ok = confirm('Importar ' + parsed.length + ' paciente(s)? Isso vai substituir todos os dados atuais.');
      if(!ok) return;
      state.patients = parsed;
      savePatients();
      render();
      showToast('Dados importados com sucesso.', 'success');
    };
    reader.readAsText(file);
  }

  function jornadaSectionHtml(p){

  function maybeStartJornada(patient, jornadaInicio, modeloValue){
    if(!jornadaInicio || patient.jornada || !modeloValue) return;
    var parts = modeloValue.split('|');
    var tipo = parts[0], foco = parts[1], variantId = parts[2];
    var variant = getJornadaVariant(tipo, foco, variantId);
    if(!variant) return;
    patient.jornada = {
      tipo: tipo,
      foco: foco,
      variantId: variantId,
      modeloNome: jornadaVariantLabel(variant, tipo, foco),
      dataInicio: jornadaInicio,
      dataFimPrevista: addDaysIso(jornadaInicio, JORNADA_DURACAO[tipo]),
      tarefas: gerarJornada(jornadaInicio, tipo, foco, variantId)
    };
  }
