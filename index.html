  /* Quem faz só Treino tem check-in a cada 14 dias, ou seja 2 por mês, e não toda semana.
     Em vez de encurtar os arrays (o que perderia dado e bagunçaria os índices), a gente
     mantém o tamanho e diz aqui QUAIS posições valem: 1ª e 3ª, que ficam 14 dias distantes. */
  function isTreinoQuinzenal(p){
    return !!p && p.servico === 'Treino';
  }
  /* Planos Essencial (Trimestral/Semestral) nao tem engajamento nem check-in semanal —
     so 1 check-in por mes, cobrindo o mes inteiro. Tem precedencia sobre o quinzenal
     de "so Treino" caso as duas regras se apliquem ao mesmo paciente. */
  function isEssencialMensal(p){
    return !!p && (p.plano === 'Essencial Trimestral' || p.plano === 'Essencial Semestral');
  }
  function activeWeekIndexes(p, monthKey){
    var wk = weeksInMonth(monthKey);
    if(isEssencialMensal(p)) return [0];
    if(!isTreinoQuinzenal(p)){
      var todas = [];
      for(var i=0;i<wk;i++) todas.push(i);
      return todas;
    }
    return [0, 2].filter(function(i){ return i < wk; });
  }
  /* Indices com engajamento valido: igual ao check-in, exceto no plano Essencial, que
     nao tem engajamento nenhum (so o check-in mensal). */
  function activeEngagementIndexes(p, monthKey){
    if(isEssencialMensal(p)) return [];
    return activeWeekIndexes(p, monthKey);
  }
  function isWeekActive(p, monthKey, weekIdx){
    return activeWeekIndexes(p, monthKey).indexOf(weekIdx) !== -1;
  }
  /* Rotulo das caixas de quem e so Treino (quinzenal): a 1a caixa cobre as semanas 1-2,
     a 2a cobre 3-4 (ou 3-4-5, em mes com 5 sextas). weekIdx e o indice real (0 ou 2). */
  function quinzenalBoxLabel(weekIdx, wk){
    if(weekIdx === 0) return 'Sem 1/2';
    return 'Sem 3/4' + (wk >= 5 ? '/5' : '');
  }
  function mensalBoxLabel(){
    return 'Check-in do mês';
  }
  function engagementRisk(p, monthKey){
    var data = getMonthData(p, monthKey);
    var ativos = activeWeekIndexes(p, monthKey);
    var ativosEng = activeEngagementIndexes(p, monthKey);
    var eng = ativosEng.map(function(i){ return data.engajamento[i]; });
    var chk = ativos.map(function(i){ return data.checkin[i]; });
    var filledEng = eng.filter(function(v){ return v !== null && v !== undefined; });
    var avg = filledEng.length ? (filledEng.reduce(function(a,b){ return a+b; }, 0) / filledEng.length) : null;
    var missed = chk.filter(function(v){ return v === false; }).length;
    var sent = chk.filter(function(v){ return v === true; }).length;
    // quinzenal tem metade dos check-ins, então o limite de faltas também cai pela metade;
    // Essencial tem só 1 check-in no mês, então perder essa 1 chance já conta como risco
    var limiteFaltas = isEssencialMensal(p) ? 0 : (isTreinoQuinzenal(p) ? 1 : 2);
    var atRisk = missed > limiteFaltas || (avg !== null && avg < 8);
    return { avg: avg, missed: missed, sent: sent, total: chk.length, atRisk: atRisk };
  }
  function consultaDiffDays(p){
    if(!p.consulta) return null;
    var today = new Date();
    today.setHours(0,0,0,0);
    var c = new Date(p.consulta + 'T00:00:00');
    return Math.ceil((c - today) / 86400000);
  }
  function consultaStatus(p){
    var diff = consultaDiffDays(p);
    if(diff === null) return 'semdata';
    if(diff < 0) return 'atrasado';
    if(diff <= 15) return 'proximo';
    return 'emdia';
  }
  function consultaBadge(p){
    var status = consultaStatus(p);
    var diff = consultaDiffDays(p);
    var map = { proximo:['Próximo','badge-warning'], emdia:['Em dia','badge-success'], atrasado:['Atrasado','badge-danger'], semdata:['Sem data','badge-gray'] };
    var e = map[status] || [status,'badge-gray'];
    var label = e[0] + (diff !== null ? ' (' + diff + ')' : '');
    return '<span class="badge '+e[1]+'">'+esc(label)+'</span>';
  }
  function diasParaVencer(dateStr){

  function bindDragReorder(rootEl, itemSelector, groupSelector, getKey, onReorder){
    if(!rootEl) return;
    var items = rootEl.querySelectorAll(itemSelector);
    var draggedItem = null;
    function clearIndicators(){
      items.forEach(function(i){ i.classList.remove('drag-over-top','drag-over-bottom'); });
    }
    items.forEach(function(item){
      item.setAttribute('draggable', 'true');
      /* Campo de texto dentro de um item arrastavel: o navegador sequestra o
         clique-e-arrastar pra comecar o arraste, entao nao dava pra selecionar o texto
         com o mouse (so com duplo/triplo clique). Enquanto o cursor estiver dentro de um
         campo, o item para de ser arrastavel; ao sair do campo, volta a ser. */
      item.querySelectorAll('input, textarea, select').forEach(function(campo){
        campo.addEventListener('mousedown', function(){ item.setAttribute('draggable', 'false'); });
        campo.addEventListener('focus', function(){ item.setAttribute('draggable', 'false'); });
        campo.addEventListener('blur', function(){ item.setAttribute('draggable', 'true'); });
      });
      item.addEventListener('dragstart', function(e){
        // se o arraste comecou de dentro de um campo, ignora (o usuario esta escrevendo)
        if(item.getAttribute('draggable') === 'false'){ e.preventDefault(); return; }
        draggedItem = item;
        item.classList.add('dragging');
        if(e.dataTransfer){
          e.dataTransfer.effectAllowed = 'move';
          try{ e.dataTransfer.setData('text/plain', getKey(item)); }catch(err){}
        }
      });
      item.addEventListener('dragend', function(){
        item.classList.remove('dragging');
        clearIndicators();
        draggedItem = null;
      });
      item.addEventListener('dragover', function(e){
        if(!draggedItem || draggedItem === item) return;
        var group = item.closest(groupSelector);
        if(!group || group !== draggedItem.closest(groupSelector)) return;
        e.preventDefault();
        var rect = item.getBoundingClientRect();
        var before = (e.clientY - rect.top) < rect.height/2;
        clearIndicators();
        item.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
      });
      item.addEventListener('drop', function(e){
        if(!draggedItem || draggedItem === item) return;
        var group = item.closest(groupSelector);
        if(!group || group !== draggedItem.closest(groupSelector)) return;
        e.preventDefault();
        var rect = item.getBoundingClientRect();
        var before = (e.clientY - rect.top) < rect.height/2;
        clearIndicators();
        var groupItems = Array.prototype.filter.call(group.querySelectorAll(itemSelector), function(i){ return i.closest(groupSelector) === group; });
        var orderedKeys = groupItems.map(getKey);
        var draggedKey = getKey(draggedItem);
        var targetKey = getKey(item);
        orderedKeys = orderedKeys.filter(function(k){ return k !== draggedKey; });
        var targetIdx = orderedKeys.indexOf(targetKey);
        var insertIdx = before ? targetIdx : targetIdx+1;
        orderedKeys.splice(insertIdx, 0, draggedKey);
        onReorder(orderedKeys);
      });
    });
  }
  function jornadaCalendarGlobalClick(e){
    var openBtn = e.target.closest('[data-jornada-cal-open]');
    if(openBtn){
      var key = openBtn.getAttribute('data-jornada-cal-open');
      var wasOpenSameKey = state.jornadaCalendarOpen && state.jornadaCalendarOpen.key === key;
      if(wasOpenSameKey){
        state.jornadaCalendarOpen = null;
      } else {
        state.jornadaCalendarOpen = { key: key, viewMonthKey: null };
      }
      jornadaCalendarRefreshForKey(key);
      if(!wasOpenSameKey){
        var pop = document.querySelector('.jornada-cal-popover');
        if(pop) pop.scrollIntoView({behavior:'smooth', block:'nearest'});
      }
      return;
    }
    var navBtn = e.target.closest('[data-jornada-cal-nav]');
    if(navBtn){
      var navParts = navBtn.getAttribute('data-jornada-cal-nav').split('|');
      var navKey = navParts[0], dir = navParts[1];
      if(state.jornadaCalendarOpen && state.jornadaCalendarOpen.key === navKey){
        var baseKey = state.jornadaCalendarOpen.viewMonthKey || getCurrentMonthKey();
        state.jornadaCalendarOpen.viewMonthKey = addMonthsToKey(baseKey, dir==='next'?1:-1);
        jornadaCalendarRefreshForKey(navKey);
      }
      return;
    }
    var pickBtn = e.target.closest('[data-jornada-cal-pick]');
    if(pickBtn){
      var pickParts = pickBtn.getAttribute('data-jornada-cal-pick').split('|');
      var pickKey = pickParts[0], dateStr = pickParts[1];
      var keyParts = pickKey.split('-');
      var pid = parseInt(keyParts[1],10), tid = parseInt(keyParts[2],10);
      if(pickKey.indexOf('kanban-') === 0) freezeKanbanTaskSort(pid, tid);
      updatePatientTask(pid, tid, 'dataAlvo', dateStr);
      state.jornadaCalendarOpen = null;
      jornadaCalendarRefreshForKey(pickKey);
      return;
    }
    if(state.jornadaCalendarOpen && !e.target.closest('.jornada-cal-popover') && !e.target.closest('[data-jornada-cal-open]')){
      var closingKey = state.jornadaCalendarOpen.key;
      state.jornadaCalendarOpen = null;
      jornadaCalendarRefreshForKey(closingKey);
    }
  }

  function diasParaAniversario(nascStr){
    if(!nascStr) return null;
    var b = new Date(nascStr + 'T00:00:00');
    var today = new Date();
    today.setHours(0,0,0,0);
    var nextBday = new Date(today.getFullYear(), b.getMonth(), b.getDate());
    if(nextBday < today) nextBday = new Date(today.getFullYear() + 1, b.getMonth(), b.getDate());
    return Math.round((nextBday - today) / 86400000);
  }

  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function addDaysIso(dateStr, n){
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return isoDate(d);
  }
  function nextBusinessDayIso(dateStr){
    var d = weekdayIndex(dateStr);
    if(d === 0) return addDaysIso(dateStr, 1);
    if(d === 6) return addDaysIso(dateStr, 2);
    return dateStr;
  }
  function firstFridayFrom(dateStr){
    var d = new Date(dateStr + 'T00:00:00');
    while(d.getDay() !== 5) d.setDate(d.getDate() + 1);
    return d;
  }
  function servicoToFoco(servico){
    if(servico === 'Treino + Dieta') return 'treino_dieta';

    return null;

  function gerarJornada(dataInicio, tipo, foco, variantId){
    var variant = getJornadaVariant(tipo, foco, variantId || 'default');
    var template = variant.tarefas;
    var sexta = firstFridayFrom(dataInicio);
    var sextaIso = isoDate(sexta);
    var sabadoIso = addDaysIso(sextaIso, 1);
    return template.map(function(t, idx){
      var dataAlvo;
      if(t.dia === 'primeira-sexta') dataAlvo = sextaIso;
      else if(t.dia === 'primeiro-sabado') dataAlvo = sabadoIso;
      else dataAlvo = nextBusinessDayIso(addDaysIso(dataInicio, t.dia));
      return { id: idx, nome: t.nome, fase: t.fase, dataAlvo: dataAlvo, concluido: false, dataConclusao: null, observacao: '', arquivado: false, ordem: idx };
    });
  }

    var list = getJornadaVariant(tipo, foco, variantId).tarefas;

  function updateTemplateTask(tipo, foco, variantId, tid, field, value){
    var task = getJornadaVariant(tipo, foco, variantId).tarefas.find(function(t){ return t._tid === tid; });
    if(!task) return;
    if(field === 'fase') task.fase = parseInt(value, 10);
    else if(field === 'dia') task.dia = parseInt(value, 10) || 0;
    else if(field === 'nome') task.nome = value;

  function jornadaTaskStatus(task){
    if(task.concluido) return 'concluido';
    var diff = diasParaVencer(task.dataAlvo);
    if(diff < 0) return 'atrasado';
    if(diff === 0) return 'hoje';
    if(diff <= 7) return 'semana';
    return 'futuro';
  }
  function freezeKanbanTaskSort(pid, tid){
    var ovKey = pid+':'+tid;
    if(state.jornadaKanbanSortOverride[ovKey] !== undefined) return;
    var p = getPatient(pid);
    var task = p && p.jornada ? p.jornada.tarefas.filter(function(t){ return t.id === tid; })[0] : null;
    var oldDiff = task ? diasParaVencer(task.dataAlvo) : null;
    state.jornadaKanbanSortOverride[ovKey] = oldDiff === null ? Infinity : oldDiff;
  }
  function jornadaKanbanColumns(){
    var byPatient = {};
    state.patients.forEach(function(p){
      // Paciente vencido sai do quadro (vai pra inativos). As tarefas dele NAO sao
      // apagadas — se renovar a vigencia, ele volta com o Kanban do jeito que estava.
      if(!p.jornada || renovacaoStatus(p) === 'Vencido') return;
      // A coluna existe pelo paciente, nao pela tarefa: quem arquivou tudo continua no
      // quadro (com a coluna vazia) pra poder recomeçar do zero pelo "+ Adicionar".
      byPatient[p.id] = { patient: p, tasks: [] };
      p.jornada.tarefas.forEach(function(t){
        if(t.arquivado) return;
        // sem corte por data: tarefa marcada pra daqui a 3 meses continua no quadro
        var diff = diasParaVencer(t.dataAlvo);
        var ov = state.jornadaKanbanSortOverride[p.id+':'+t.id];
        var sortDiff = ov !== undefined ? ov : (diff === null ? Infinity : diff);
        byPatient[p.id].tasks.push({ task: t, diff: diff, sortDiff: sortDiff });
      });
    });
    var columns = Object.keys(byPatient).map(function(id){ return byPatient[id]; });
    columns.forEach(function(col){
      var trueDiffs = col.tasks.map(function(t){ return t.diff; }).filter(function(d){ return d !== null; });
      col.minDiff = trueDiffs.length ? Math.min.apply(null, trueDiffs) : Infinity;
      // data manda na ordem: o que vence antes fica em cima, sempre. A ordem manual
      // (arrastar) so decide entre tarefas que caem no MESMO dia. Uma tarefa recem-editada
      // fica congelada no lugar (sortDiff) ate a pessoa fechar o cartao de novo.
      col.tasks.sort(function(a,b){
        if(a.sortDiff !== b.sortDiff) return a.sortDiff - b.sortDiff;
        return (a.task.ordem||0) - (b.task.ordem||0);
      });
    });
    columns.sort(function(a,b){
      var pa = PRIORITY_RANK[a.patient.prioridade], pb = PRIORITY_RANK[b.patient.prioridade];
      if(pa !== pb) return pa - pb;
      return a.minDiff - b.minDiff;
    });
    return columns;
  }
  function jornadaKanbanFilteredColumns(){
    var term = state.jornadaKanbanSearch.trim().toLowerCase();
    var columns = jornadaKanbanColumns().filter(function(col){
      var p = col.patient;
      if(term && p.nome.toLowerCase().indexOf(term) === -1) return false;
      if(state.jornadaKanbanPrioridadeFilter !== 'todos' && p.prioridade !== state.jornadaKanbanPrioridadeFilter) return false;
      if(state.jornadaKanbanStatusFilter !== 'todos' && renovacaoStatusSimplified(p) !== state.jornadaKanbanStatusFilter) return false;
      return true;
    });
    if(state.jornadaKanbanSortBy === 'nome'){
      var dir = state.jornadaKanbanSortDir === 'asc' ? 1 : -1;
      columns = columns.slice().sort(function(a,b){ return a.patient.nome.localeCompare(b.patient.nome, 'pt-BR') * dir; });
    }
    return columns;
  }
  function jornadaUrgencyCounts(){
    var counts = { atrasado:0, hoje:0, semana:0, depois:0, concluido:0 };
    jornadaKanbanColumns().forEach(function(col){
      col.tasks.forEach(function(item){
        if(item.task.concluido){ counts.concluido++; return; }
        if(item.diff === null) return;
        if(item.diff < 0) counts.atrasado++;
        else if(item.diff === 0) counts.hoje++;
        else if(item.diff <= 7) counts.semana++;
        else counts.depois++; // agora o Kanban mostra tarefa distante, mas ela nao e urgente
      });
    });
    return counts;
  }
  function jornadaUrgencyChartHtml(){

  function jornadaAfazeresGroups(){
    var byPatient = {};

        if(item.diff === null || item.diff > 0) return;

    });
    var groups = Object.keys(byPatient).map(function(id){ return byPatient[id]; });

      g.items.sort(function(a,b){
        if(a.task.concluido !== b.task.concluido) return a.task.concluido ? 1 : -1;
        return a.diff - b.diff;
      });
    });
    groups.sort(function(a,b){
      var pa = PRIORITY_RANK[a.patient.prioridade], pb = PRIORITY_RANK[b.patient.prioridade];
      if(pa !== pb) return pa - pb;

  /* Tarefa marcada pra depois do fim da vigencia: naquela data o paciente ja nao estaria
     mais em acompanhamento, a nao ser que renove. A tarefa continua no quadro (ele pode
     renovar), mas ganha destaque proprio pra isso nao passar batido. Sem vencimento
     cadastrado nao da pra comparar, entao nao marca nada. */
  function tarefaDepoisDaVigencia(p, t){
    if(!p || !p.vencimento || !t || !t.dataAlvo || t.concluido) return false;
    return t.dataAlvo > p.vencimento;
  }
  /* Tarefa que cai dentro da janela de renovacao antecipada (os 40 dias antes do
     vencimento). Aqui a cor do cartao NAO muda — entra so o aviso escrito, pra lembrar

  function tarefaNaRenovacaoAntecipada(p, t){
    if(!p || !p.vencimento || !t || !t.dataAlvo || t.concluido) return false;
    if(t.dataAlvo > p.vencimento) return false; // depois do vencimento e o caso do vermelho forte
    var venc = new Date(p.vencimento + 'T00:00:00');
    var alvo = new Date(t.dataAlvo + 'T00:00:00');
    var diff = Math.ceil((venc - alvo) / 86400000);
    return diff <= DIAS_RENOVACAO_ANTECIPADA;
  }

  function refreshJornadaKanban(){
    var root = document.getElementById('jornadaKanbanRoot');
    if(!root) return;
    var scrollBox = root.querySelector('.jornada-kanban');
    var savedScrollLeft = scrollBox ? scrollBox.scrollLeft : 0;
    var savedColScroll = {};
    root.querySelectorAll('.jornada-kanban-col').forEach(function(col){
      var opener = col.querySelector('[data-open-profile]');
      var cardsBox = col.querySelector('.jornada-kanban-cards');
      if(opener && cardsBox) savedColScroll[opener.getAttribute('data-open-profile')] = cardsBox.scrollTop;
    });
    root.innerHTML = jornadaKanbanHtml();
    bindJornadaKanbanEvents();
    var newScrollBox = root.querySelector('.jornada-kanban');
    if(newScrollBox) newScrollBox.scrollLeft = savedScrollLeft;
    root.querySelectorAll('.jornada-kanban-col').forEach(function(col){
      var opener = col.querySelector('[data-open-profile]');
      var cardsBox = col.querySelector('.jornada-kanban-cards');
      if(opener && cardsBox && savedColScroll[opener.getAttribute('data-open-profile')] !== undefined){
        cardsBox.scrollTop = savedColScroll[opener.getAttribute('data-open-profile')];
      }
    });
    var toolbar = document.getElementById('jornadaKanbanToolbarRoot');
    if(toolbar){
      var sortBtn = document.getElementById('jornadaKanbanNomeSortBtn');
      // innerHTML (nao textContent) porque o rotulo tem <br> pra quebrar em 2 linhas
      if(sortBtn) sortBtn.innerHTML = jornadaKanbanSortLabel();
    }
  }
  function bindJornadaKanbanEvents(){
    var root = document.getElementById('jornadaKanbanRoot');
    if(!root) return;
    bindProfileOpeners(root);
    root.querySelectorAll('[data-jornada-done]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var parts = this.getAttribute('data-jornada-done').split(':');
        setJornadaTaskDone(parseInt(parts[0],10), parseInt(parts[1],10), this.checked);
        refreshAllJornadaViews();
      });
    });
    root.querySelectorAll('[data-kanban-archive]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var parts = this.getAttribute('data-kanban-archive').split(':');
        setJornadaTaskArquivado(parseInt(parts[0],10), parseInt(parts[1],10), true);
        refreshAllJornadaViews();
        refreshJornadaArquivo();
        showToast('Tarefa arquivada. Você pode restaurar no Histórico.', 'success');
      });
    });
    root.querySelectorAll('[data-kanban-card-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        var key = this.getAttribute('data-kanban-card-toggle');
        var willExpand = !state.jornadaKanbanExpanded[key];
        state.jornadaKanbanExpanded[key] = willExpand;
        if(!willExpand) delete state.jornadaKanbanSortOverride[key];
        refreshJornadaKanban();
        if(willExpand){
          var cardEl = document.querySelector('.jornada-kanban-card[data-kanban-drag-key="'+key+'"]');
          if(cardEl) cardEl.scrollIntoView({behavior:'smooth', block:'nearest'});
        }
      });
    });
    root.querySelectorAll('[data-kanban-task-nome]').forEach(function(el){
      el.addEventListener('blur', function(){
        var parts = this.getAttribute('data-kanban-task-nome').split(':');
        updatePatientTask(parseInt(parts[0],10), parseInt(parts[1],10), 'nome', this.value.trim());
      });
      el.addEventListener('click', function(e){ e.stopPropagation(); });
    });
    root.querySelectorAll('[data-kanban-task-obs]').forEach(function(el){
      el.addEventListener('blur', function(){
        var parts = this.getAttribute('data-kanban-task-obs').split(':');
        var p = getPatient(parseInt(parts[0],10));
        var task = p.jornada.tarefas.filter(function(t){ return t.id === parseInt(parts[1],10); })[0];
        if(task){ task.observacao = this.value.trim(); savePatients(); }
      });
      el.addEventListener('click', function(e){ e.stopPropagation(); });
    });
    bindObsCheckinAutosize();
    root.querySelectorAll('[data-kanban-col-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = parseInt(this.getAttribute('data-kanban-col-toggle'),10);
        state.jornadaKanbanCollapsed[id] = !state.jornadaKanbanCollapsed[id];
        refreshJornadaKanban();
      });
    });
    root.querySelectorAll('[data-kanban-task-add]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = this.getAttribute('data-kanban-task-add').split('|');
        var pid = parseInt(parts[0],10);
        var newId = addPatientTask(pid, parseInt(parts[1],10));
        refreshAllJornadaViews();
        var cardEl = document.querySelector('.jornada-kanban-card[data-kanban-drag-key="'+pid+':'+newId+'"]');
        if(cardEl) cardEl.scrollIntoView({behavior:'smooth', block:'nearest'});
      });
    });
    root.querySelectorAll('[data-kanban-duplicate]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var parts = this.getAttribute('data-kanban-duplicate').split(':');
        var pid = parseInt(parts[0],10), tid = parseInt(parts[1],10);
        var p = getPatient(pid);
        var original = p && p.jornada ? p.jornada.tarefas.filter(function(t){ return t.id === tid; })[0] : null;
        if(!original) return;
        // guarda onde a original esta ordenada AGORA (pode ja estar congelada por uma
        // edicao anterior), pra colar a copia logo atras dela — nao no fim da coluna
        // como uma tarefa nova (a copia nao tem data ainda, entao sozinha iria pro fim).
        var origDiff = diasParaVencer(original.dataAlvo);
        var origOv = state.jornadaKanbanSortOverride[pid+':'+tid];
        var origSortDiff = origOv !== undefined ? origOv : (origDiff === null ? Infinity : origDiff);
        var newId = duplicatePatientTask(pid, tid);
        if(newId === null) return;
        var copia = p.jornada.tarefas.filter(function(t){ return t.id === newId; })[0];
        if(copia) copia.ordem = (original.ordem||0) + 0.5; // entre a original e a proxima
        state.jornadaKanbanSortOverride[pid+':'+newId] = origSortDiff;
        savePatients();
        // a copia ja abre expandida, pronta pra so preencher a data
        state.jornadaKanbanExpanded[pid+':'+newId] = true;
        refreshAllJornadaViews();
        var cardEl = document.querySelector('.jornada-kanban-card[data-kanban-drag-key="'+pid+':'+newId+'"]');
        if(cardEl) cardEl.scrollIntoView({behavior:'smooth', block:'nearest'});
        showToast('Tarefa duplicada logo abaixo da original.', 'success');
      });
    });
    root.querySelectorAll('.jornada-kanban-cards').forEach(function(colEl){
      bindDragReorder(colEl, '.jornada-kanban-card', '.jornada-kanban-cards',
        function(item){ return item.getAttribute('data-kanban-drag-key'); },
        function(orderedKeys){
          var pid = parseInt(orderedKeys[0].split(':')[0], 10);
          var tids = orderedKeys.map(function(k){ return parseInt(k.split(':')[1],10); });
          reorderPatientTasks(pid, tids);
          refreshJornadaKanban();
        });
    });
  }

  function jornadaResumoModeloOptions(){
    var set = {};
    state.patients.forEach(function(p){
      if(!p.jornada || renovacaoStatus(p) === 'Vencido') return;
      set[p.jornada.modeloNome || defaultVariantLabel(p.jornada.tipo, p.jornada.foco)] = true;
    });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'pt-BR'); });
  }
  function jornadaResumoFilteredSorted(){
    var term = state.jornadaResumoSearch.trim().toLowerCase();
    var list = state.patients.filter(function(p){
      if(!p.jornada || renovacaoStatus(p) === 'Vencido') return false;
      if(term && p.nome.toLowerCase().indexOf(term) === -1) return false;
      if(state.jornadaResumoTipoFilter !== 'todos' && p.jornada.tipo !== state.jornadaResumoTipoFilter) return false;
      if(state.jornadaResumoModeloFilter !== 'todos'){
        var modeloNome = p.jornada.modeloNome || defaultVariantLabel(p.jornada.tipo, p.jornada.foco);
        if(modeloNome !== state.jornadaResumoModeloFilter) return false;
      }
      return true;
    });
    var dir = state.jornadaResumoSortDir === 'asc' ? 1 : -1;
    var col = state.jornadaResumoSortBy;
    function progresso(p){
      var total = p.jornada.tarefas.length;
      return total ? p.jornada.tarefas.filter(function(t){ return t.concluido; }).length/total : 0;
    }
    list.sort(function(a,b){
      var av, bv;
      if(col === 'dataInicio'){ av = a.jornada.dataInicio; bv = b.jornada.dataInicio; }
      else if(col === 'dataFimPrevista'){ av = a.jornada.dataFimPrevista; bv = b.jornada.dataFimPrevista; }
      else if(col === 'progresso'){ av = progresso(a); bv = progresso(b); }
      else { av = a.nome.toLowerCase(); bv = b.nome.toLowerCase(); }
      if(av < bv) return -1*dir;
      if(av > bv) return 1*dir;
      return a.nome.localeCompare(b.nome, 'pt-BR');
    });
    return list;
  }
  function jornadaResumoSortArrow(col){
    if(state.jornadaResumoSortBy !== col) return '';
    return ' <span class="sort-arrow">' + (state.jornadaResumoSortDir === 'asc' ? '▲' : '▼') + '</span>';
  }
  function jornadaResumoRows(){
    var list = jornadaResumoFilteredSorted();
    if(!list.length){
      return '<tr><td colspan="6"><div class="empty-state">Nenhum paciente encontrado.</div></td></tr>';
    }
    return list.map(function(p){
      var total = p.jornada.tarefas.length;
      var feitas = p.jornada.tarefas.filter(function(t){ return t.concluido; }).length;
      var pct = total ? Math.round(feitas/total*100) : 0;
      var modeloNome = p.jornada.modeloNome || defaultVariantLabel(p.jornada.tipo, p.jornada.foco);
      return '<tr>'+
        '<td><button class="link-btn" data-open-profile="'+p.id+'">'+esc(p.nome)+' '+renovacaoStatusEmoji(p)+'</button></td>'+
        '<td>'+(p.jornada.tipo==='trimestral'?'Trimestral':'Semestral')+'</td>'+
        '<td>'+esc(modeloNome)+'</td>'+
        '<td class="cell-muted">'+formatDate(p.jornada.dataInicio)+'</td>'+

      '</tr>';
    }).join('');
  }

  function jornadaVariantOptionsHtml(selectedValue, includeNenhuma){
    var all = allJornadaVariantsFlat();
    var defaults = all.filter(function(v){ return getJornadaVariant(v.tipo, v.foco, v.variantId).isDefault; });
    var custom = all.filter(function(v){ return !getJornadaVariant(v.tipo, v.foco, v.variantId).isDefault; });
    function opt(v){ return '<option value="'+esc(v.value)+'"'+(v.value===selectedValue?' selected':'')+'>'+esc(v.label)+'</option>'; }
    var html = includeNenhuma ? '<option value=""'+(selectedValue===''?' selected':'')+'>Nenhuma</option>' : '';
    html += '<optgroup label="Modelos Padrão">'+defaults.map(opt).join('')+'</optgroup>';
    if(custom.length){
      html += '<optgroup label="Modelos Personalizados">'+custom.map(opt).join('')+'</optgroup>';
    }
    return html;
  }

    if(!variant){ state.jornadaEditorModelo = 'trimestral|treino_dieta|default'; return jornadaTemplateEditorHtml(); }
    var faseLabels = JORNADA_FASES[tipo];
    var tasks = variant.tarefas;
    var groups = faseLabels.map(function(label, fase){
      var collapsed = !!state.jornadaEditorCollapsedFases[fase];
      var faseTasks = tasks.filter(function(t){ return t.fase === fase; }).sort(function(a,b){ return (a.ordem||0) - (b.ordem||0); });
      var faseOptions = faseLabels.map(function(l, i){ return '<option value="'+i+'"'+(i===fase?' selected':'')+'>'+esc(l)+'</option>'; }).join('');
      var rows = faseTasks.map(function(t){
        var diaValue = (t.dia === 'primeira-sexta' || t.dia === 'primeiro-sabado') ? '' : t.dia;
        var diaTitle = t.dia === 'primeira-sexta' ? 'Hoje: 1ª sexta após o início. Editar substitui por um número fixo de dias.' : t.dia === 'primeiro-sabado' ? 'Hoje: 1º sábado após o início. Editar substitui por um número fixo de dias.' : 'Dias após o início';
        return ''+
          '<div class="jornada-template-task" data-tpl-drag-key="'+t._tid+'">'+
            '<input type="text" class="jornada-template-nome" data-tpl-field="nome" data-tpl-tid="'+t._tid+'" value="'+esc(t.nome)+'">'+
            '<input type="number" class="jornada-template-dia" data-tpl-field="dia" data-tpl-tid="'+t._tid+'" value="'+diaValue+'" title="'+esc(diaTitle)+'" placeholder="dias">'+
            '<select class="jornada-template-fase" data-tpl-field="fase" data-tpl-tid="'+t._tid+'">'+faseOptions+'</select>'+
            '<button type="button" class="btn-icon btn-danger-outline" data-tpl-remove="'+t._tid+'">Remover</button>'+
          '</div>';
      }).join('');
      return ''+
        '<div class="jornada-fase-title jornada-fase-toggle" data-fase-toggle="'+fase+'">'+
          '<span class="fase-collapse-arrow">'+(collapsed?'▸':'▾')+'</span> '+esc(label)+' <span class="cell-muted">('+faseTasks.length+')</span>'+
        '</div>'+
        '<div class="jornada-fase-group-body"'+(collapsed?' style="display:none;"':'')+'>'+
          (rows || '<div class="cell-muted" style="margin-bottom:8px;">Nenhuma tarefa nessa fase.</div>')+
          '<button type="button" class="btn-icon" data-tpl-add-fase="'+fase+'">+ Adicionar tarefa nesta fase</button>'+
        '</div>';
    }).join('');
    var nomeHeader = variant.isDefault ?
      '<div class="mini-label">Modelo</div><div style="font-weight:700;font-size:14px;padding:6px 0;">'+esc(defaultVariantLabel(tipo,foco))+'</div>' :
      '<div class="mini-label">Nome da cópia</div><input type="text" id="jornadaVariantNomeInput" value="'+esc(variant.nome)+'">';
    var actionBtn = variant.isDefault ?
      '<button type="button" class="btn-icon" id="jornadaResetTemplateBtn">Restaurar padrão</button>' :
      '<button type="button" class="btn-icon btn-danger-outline" id="jornadaDeleteVariantBtn">Excluir esta cópia</button>';
    return ''+
      '<div class="jornada-select-row" style="margin-bottom:16px;align-items:flex-end;">'+
        '<div><div class="mini-label">Jornada</div>'+jornadaModeloSelectHtml('jornadaEditorModeloSelect', state.jornadaEditorModelo)+'</div>'+
        '<div>'+nomeHeader+'</div>'+
        '<div style="display:flex;gap:8px;">'+
          '<button type="button" class="btn-icon" id="jornadaDuplicateBtn">Duplicar</button>'+
          actionBtn+
        '</div>'+
      '</div>'+
      groups;
  }

  function bindJornadaTemplateEditorEvents(){
    var root = document.getElementById('jornadaTemplateEditorRoot');
    if(!root) return;
    var parts = state.jornadaEditorModelo.split('|');
    var tipo = parts[0], foco = parts[1], variantId = parts[2];
    root.querySelectorAll('[data-tpl-field]').forEach(function(el){
      var evt = el.tagName === 'SELECT' ? 'change' : 'blur';
      el.addEventListener(evt, function(){
        updateTemplateTask(tipo, foco, variantId, parseInt(this.getAttribute('data-tpl-tid'),10), this.getAttribute('data-tpl-field'), this.value);
        if(this.getAttribute('data-tpl-field') === 'fase') refreshJornadaTemplateEditor();
      });
    });
    root.querySelectorAll('[data-tpl-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        removeTemplateTask(tipo, foco, variantId, parseInt(this.getAttribute('data-tpl-remove'),10));
        refreshJornadaTemplateEditor();
      });
    });
    root.querySelectorAll('[data-tpl-add-fase]').forEach(function(btn){
      btn.addEventListener('click', function(){
        addTemplateTask(tipo, foco, variantId, parseInt(this.getAttribute('data-tpl-add-fase'),10));
        refreshJornadaTemplateEditor();
      });
    });
    root.querySelectorAll('[data-fase-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        var fase = this.getAttribute('data-fase-toggle');
        state.jornadaEditorCollapsedFases[fase] = !state.jornadaEditorCollapsedFases[fase];
        refreshJornadaTemplateEditor();
      });
    });
    document.getElementById('jornadaEditorModeloSelect').addEventListener('change', function(){
      state.jornadaEditorModelo = this.value;
      refreshJornadaTemplateEditor();
    });
    document.getElementById('jornadaDuplicateBtn').addEventListener('click', function(){
      var variant = getJornadaVariant(tipo, foco, variantId);
      var sugestao = (variant.isDefault ? defaultVariantLabel(tipo, foco) : variant.nome) + ' (cópia)';
      var nome = prompt('Nome da nova cópia:', sugestao);
      if(!nome) return;
      var nova = duplicateJornadaVariant(tipo, foco, variantId, nome.trim());
      state.jornadaEditorModelo = tipo+'|'+foco+'|'+nova.id;
      refreshJornadaTemplateEditor();
      showToast('Cópia "'+nova.nome+'" criada.', 'success');
    });
    var renameInput = document.getElementById('jornadaVariantNomeInput');
    if(renameInput){
      renameInput.addEventListener('blur', function(){
        var val = this.value.trim();
        if(val){ renameJornadaVariant(tipo, foco, variantId, val); }
      });
    }
    var resetBtn = document.getElementById('jornadaResetTemplateBtn');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        if(confirm('Restaurar essa jornada pro padrão original? As edições feitas nela serão perdidas (pacientes que já têm jornada não são afetados).')){
          resetJornadaTemplate(tipo, foco);
          refreshJornadaTemplateEditor();
        }
      });
    }
    var deleteBtn = document.getElementById('jornadaDeleteVariantBtn');
    if(deleteBtn){
      deleteBtn.addEventListener('click', function(){
        if(confirm('Excluir essa cópia? Pacientes que já têm jornada baseada nela não são afetados.')){
          deleteJornadaVariant(tipo, foco, variantId);
          state.jornadaEditorModelo = tipo+'|'+foco+'|default';
          refreshJornadaTemplateEditor();
        }
      });
    }
    root.querySelectorAll('.jornada-fase-group-body').forEach(function(groupEl){
      bindDragReorder(groupEl, '.jornada-template-task', '.jornada-fase-group-body',
        function(item){ return parseInt(item.getAttribute('data-tpl-drag-key'),10); },
        function(orderedKeys){
          reorderTemplateTasks(tipo, foco, variantId, orderedKeys);
          refreshJornadaTemplateEditor();
        });
    });
  }

  function loadAllDataAndRender(){

  function attachLoginEvents(){
    var form = document.getElementById('loginForm');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var errBox = document.getElementById('loginError');
      var submitBtn = form.querySelector('button[type="submit"]');
      errBox.classList.remove('show');
      if(!mfa){
        errBox.textContent = 'Ainda carregando, espera um instante e tenta de novo.';
        errBox.classList.add('show');
        return;
      }
      submitBtn.disabled = true;
      if(state.loginMfaStep){
        var code = document.getElementById('loginTotpCode').value.trim();
        var assertion = mfa.TotpMultiFactorGenerator.assertionForSignIn(pendingMfaResolver.hints[0].uid, code);
        pendingMfaResolver.resolveSignIn(assertion).then(function(){
          state.loginMfaStep = false;
          pendingMfaResolver = null;
          state.loggedIn = true;
          state.booting = true;
          render();
          loadAllDataAndRender();
        }).catch(function(){
          submitBtn.disabled = false;
          errBox.textContent = 'Código inválido ou expirado. Confira o código atual no app.';
          errBox.classList.add('show');
        });
        return;
      }
      var email = document.getElementById('loginEmail').value.trim();
      var pass = document.getElementById('loginPassword').value;
      mfa.signInWithEmailAndPassword(mfa.auth, email, pass).then(function(){
        state.loggedIn = true;
        state.booting = true;
        render();
        loadAllDataAndRender();
      }).catch(function(error){
        submitBtn.disabled = false;
        if(error && error.code === 'auth/multi-factor-auth-required'){
          pendingMfaResolver = mfa.getMultiFactorResolver(mfa.auth, error);
          state.loginMfaStep = true;
          render();
          return;
        }
        errBox.textContent = 'E-mail ou senha inválidos.';
        errBox.classList.add('show');
      });
    });
    var backBtn = document.getElementById('loginMfaBackBtn');
    if(backBtn){
      backBtn.addEventListener('click', function(){
        state.loginMfaStep = false;
        pendingMfaResolver = null;
        render();
      });
    }
  }

     por ultimo (ela depende das outras existirem). O que ainda nao existe mostra o que
     vai entrar ali, pra navegacao ja funcionar inteira desde agora. */
  var CAPTACAO_EM_BREVE = {
    'cap-visao': { titulo:'Visão Geral', desc:'Indicadores da captação (mês atual × mês anterior) e a Agenda de Captação, reunindo as tarefas de todas as áreas.' },
    'cap-leads': { titulo:'Leads', desc:'Kanban do funil comercial: Novo → Em conversa → Negociação → Fechado / Sem avanço.' },
    'cap-parcerias': { titulo:'Parcerias', desc:'Relacionamento com médicos, academias, clínicas e parceiros — com jornadas de manutenção.' },
    'cap-indica': { titulo:'Indicações', desc:'Quem indicou quem, conversões e as recompensas conquistadas.' },
    'cap-comunidade': { titulo:'Comunidade', desc:'Cronograma de conteúdos e ações do grupo de WhatsApp.' }
  };
  function captacaoTemplate(tab){
    if(tab === 'cap-leads') return leadsTemplate();
    if(tab === 'cap-parcerias') return parceriasTemplate();
    if(tab === 'cap-visao') return captacaoVisaoTemplate();
    if(tab === 'cap-indica') return indicacoesTemplate();
    if(tab === 'cap-comunidade') return comunidadeTemplate();
    var info = CAPTACAO_EM_BREVE[tab] || CAPTACAO_EM_BREVE['cap-visao'];
    return ''+
      '<h1 class="page-title">'+esc(info.titulo)+'</h1>'+
      '<p class="page-sub">Captação</p>'+
      '<div class="card" style="padding:28px;">'+
        '<div class="empty-state" style="padding:32px 20px;">'+
          '<div style="font-size:15px;color:var(--text);font-weight:600;margin-bottom:8px;">Em construção</div>'+
          '<div style="max-width:460px;margin:0 auto;line-height:1.6;">'+esc(info.desc)+'</div>'+
        '</div>'+
      '</div>';

  function attachCaptacaoEvents(tab){
    if(tab === 'cap-leads') attachLeadsEvents();
    if(tab === 'cap-parcerias') attachParceriasEvents();
    if(tab === 'cap-visao'){

      bindAgendaCaptacaoEvents();

    if(tab === 'cap-indica'){

      bindIndicacoesEvents();
    }

      bindInfoIcons(document.getElementById('content'));

  /* ---------- Leads: filtro e Kanban ---------- */
  /* Regra do mes: quem esta em andamento aparece sempre (precisa de acao agora);
     quem foi finalizado fica preso ao mes em que foi finalizado, pra o quadro nao
     virar um cemiterio e o historico daquele mes ficar guardado. */
  function leadVisivelNoMes(l, monthKey){
    if(!etapaEhFinal(l.etapa)) return true;
    return (l.mesFinalizado || (l.criadoEm||'').slice(0,7)) === monthKey;
  }
  function leadsFiltrados(monthKey){
    if(!state.captacao) return [];
    var termo = state.leadSearch.trim().toLowerCase();
    return state.captacao.leads.filter(function(l){
      if(!leadVisivelNoMes(l, monthKey)) return false;
      if(termo && (l.nome||'').toLowerCase().indexOf(termo) === -1) return false;
      if(state.leadTemperaturaFilter !== 'todos' && l.temperatura !== state.leadTemperaturaFilter) return false;
      if(state.leadEtiquetaFilter !== 'todos' && (l.etiquetas||[]).indexOf(state.leadEtiquetaFilter) === -1) return false;
      return true;
    });
  }
  function whatsappHref(tel){ return 'https://wa.me/' + whatsappDigits(tel); }
  function instagramHandle(v){ return String(v||'').trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/\/$/,''); }
  function instagramHref(v){ return 'https://instagram.com/' + instagramHandle(v); }
  /* Botao so aparece quando o dado existe — nunca botao vazio. */
  function leadAtalhosHtml(l){
    var btns = '';
    if(l.whatsapp) btns += '<a class="lead-link-btn wa" href="'+esc(whatsappHref(l.whatsapp))+'" target="_blank" rel="noopener" title="Abrir WhatsApp" data-stop="1">💬</a>';
    if(l.instagram) btns += '<a class="lead-link-btn ig" href="'+esc(instagramHref(l.instagram))+'" target="_blank" rel="noopener" title="Abrir Instagram" data-stop="1">📷</a>';
    return btns ? '<div class="lead-card-acoes">'+btns+'</div>' : '';
  }
  /* Proxima acao em aberto da jornada — e o que responde "o que eu faco com essa pessoa
     agora?" sem precisar abrir o lead. */
  function leadProximaAcao(l){
    if(!l.jornada || !l.jornada.tarefas) return null;
    var abertas = l.jornada.tarefas.filter(function(t){ return !t.concluido && !t.arquivado && t.dataAlvo; });
    if(!abertas.length) return null;
    abertas.sort(function(a,b){ return a.dataAlvo < b.dataAlvo ? -1 : a.dataAlvo > b.dataAlvo ? 1 : 0; });
    return abertas[0];
  }
  function leadCardHtml(l){
    var tags = (l.etiquetas||[]).slice(0,3).map(function(t){ return '<span class="lead-tag">'+esc(t)+'</span>'; }).join('');
    var extra = (l.etiquetas||[]).length > 3 ? '<span class="lead-tag">+'+((l.etiquetas.length)-3)+'</span>' : '';
    var virouPaciente = l.pacienteId ? '<span class="lead-tag" style="background:var(--success-bg);color:var(--success);">✓ paciente</span>' : '';
    var prox = leadProximaAcao(l);
    var proximaHtml = '';
    if(prox){
      var d = diasParaVencer(prox.dataAlvo);
      var quando = d < 0 ? 'atrasada ('+Math.abs(d)+'d)' : d === 0 ? 'hoje' : 'em '+d+'d';
      var cor = d < 0 ? 'var(--danger)' : d === 0 ? 'var(--warning)' : 'var(--text-muted)';
      proximaHtml = '<div class="lead-proxima"><span style="color:'+cor+';font-weight:700;">'+canalInfo(prox.canal).ico+' '+esc(quando)+'</span> · '+esc(prox.nome)+'</div>';
    }
    return ''+
      '<div class="lead-card" draggable="true" data-lead-id="'+l.id+'">'+
        '<div class="lead-card-nome" data-lead-open="'+l.id+'">'+esc(l.nome||'(sem nome)')+'</div>'+
        '<div class="lead-card-meta">'+
          '<span class="lead-temp temp-'+esc(l.temperatura||'Morno')+'">'+esc(l.temperatura||'Morno')+'</span>'+
          tags+extra+virouPaciente+
        '</div>'+
        proximaHtml+
        leadAtalhosHtml(l)+
      '</div>';
  }
  function leadKanbanHtml(monthKey){
    var lista = leadsFiltrados(monthKey);
    var cols = LEAD_ETAPAS.map(function(et){
      var doGrupo = lista.filter(function(l){ return l.etapa === et.key; })
                         .sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); });
      var cards = doGrupo.length
        ? doGrupo.map(leadCardHtml).join('')
        : '<div class="lead-empty-col">Arraste um lead pra cá</div>';
      return ''+
        '<div class="lead-col '+et.cls+'" data-lead-col="'+et.key+'">'+
          '<div class="lead-col-header">'+
            '<span class="lead-col-title"><span class="dot"></span>'+esc(et.label)+'</span>'+
            '<span class="badge badge-gray">'+doGrupo.length+'</span>'+
          '</div>'+
          '<div class="lead-cards">'+cards+'</div>'+
        '</div>';
    }).join('');
    return '<div class="lead-kanban">'+cols+'</div>';
  }

      '<div class="toolbar">'+
        '<div class="toolbar-filters">'+
          '<input type="text" id="leadSearchInput" class="search-input" placeholder="Buscar por nome..." value="'+esc(state.leadSearch)+'">'+
          filterChipHtml('leadTemperaturaFilter', 'Temperatura', 'Todas', LEAD_TEMPERATURAS)+

          '<select id="leadCompetenciaSelect" class="filter-select">'+monthSelectOptions(monthKey)+'</select></div>'+

      '<div id="leadKanbanRoot">'+leadKanbanHtml(monthKey)+'</div>'+
      '<div class="section-header-row" style="margin-top:30px;">'+
        '<h2 class="section-title">Modelos de Jornada de Lead</h2>'+
        '<button class="info-icon-btn" type="button" data-info-toggle="info-lead-modelos">i</button>'+
        '<button class="btn-icon" type="button" id="leadModelosToggleBtn" style="margin-left:auto;">'+(state.leadModelosCollapsed?'Mostrar':'Recolher')+'</button>'+
      '</div>'+
      '<div class="info-popover" id="info-lead-modelos">Os modelos que você aplica nos leads. O número em cada ação é quantos dias depois do início da jornada ela cai — Dia 0 é o próprio dia. Editar aqui muda o modelo pros próximos leads; quem já recebeu a jornada mantém a versão dele, sem ser afetado.</div>'+
      '<div class="card" style="padding:16px;margin-bottom:32px;'+(state.leadModelosCollapsed?'display:none;':'')+'" id="leadModelosCard">'+
        '<div id="leadModelosRoot">'+leadModelosHtml()+'</div>'+
      '</div>';
  }

  /* ---------- Parcerias: lista + jornada de manutencao ---------- */
  function parceriasFiltradas(){
    if(!state.captacao) return [];
    var termo = state.parceriaSearch.trim().toLowerCase();
    return state.captacao.parcerias.filter(function(pa){
      if(termo && (pa.nome||'').toLowerCase().indexOf(termo) === -1) return false;
      if(state.parceriaEstagioFilter !== 'todos' && pa.estagio !== state.parceriaEstagioFilter) return false;
      return true;
    }).sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||'','pt-BR'); });
  }
  function parceriaLinhaHtml(pa){
    var est = parceriaEstagioInfo(pa.estagio);
    var stats = parceriaIndicacoesStats(pa.id);
    var ultima = parceriaUltimaInteracao(pa);
    var prox = parceriaProximaAcao(pa);
    var proxHtml = '<span class="cell-muted">—</span>';
    if(prox){
      var d = diasParaVencer(prox.dataAlvo);
      var quando = d < 0 ? 'atrasada ('+Math.abs(d)+'d)' : d === 0 ? 'hoje' : 'em '+d+'d';
      var cor = d < 0 ? 'var(--danger)' : d === 0 ? 'var(--warning)' : 'var(--text-muted)';
      proxHtml = '<span style="color:'+cor+';font-weight:700;">'+canalInfo(prox.canal).ico+' '+esc(quando)+'</span> · '+esc(prox.nome);
    }
    return '<tr>'+
      '<td><button class="link-btn" data-parceria-abrir="'+pa.id+'">'+esc(pa.nome||'(sem nome)')+'</button>'+
        (pa.tipo ? '<div class="cell-muted" style="font-size:11.5px;">'+esc(pa.tipo)+'</div>' : '')+
      '</td>'+
      '<td><span class="badge '+est.badgeCls+'">'+esc(est.label)+'</span></td>'+
      '<td class="cell-muted">'+(ultima?formatDate(ultima):'—')+'</td>'+
      '<td>'+proxHtml+'</td>'+
      '<td>'+stats.total+' / '+stats.convertidas+'</td>'+
      '<td><button class="btn-icon btn-danger-outline" data-parceria-remover="'+pa.id+'">Excluir</button></td>'+
    '</tr>';
  }
  function parceriasListaHtml(){
    var lista = parceriasFiltradas();
    if(!lista.length) return '<tr><td colspan="6"><div class="empty-state">Nenhuma parceria encontrada.</div></td></tr>';
    return lista.map(parceriaLinhaHtml).join('');
  }
  function parceriasTemplate(){
    var estagioOpts = PARCERIA_ESTAGIOS.map(function(e){ return {value:e.key,label:e.label}; });
    return ''+
      '<div class="profile-top" style="margin-bottom:4px;">'+
        '<div><h1 class="page-title" style="margin-bottom:2px;">Parcerias</h1>'+
        '<p class="page-sub" style="margin:0;">Captação · relacionamento com parceiros</p></div>'+
        '<button class="btn btn-primary" id="parceriaNovoBtn">+ Nova Parceria</button>'+
      '</div>'+
      '<div class="section-header-row" style="margin-top:18px;">'+
        '<h2 class="section-title">Parceiros</h2>'+
        '<button class="info-icon-btn" type="button" data-info-toggle="info-parcerias">i</button>'+
      '</div>'+
      '<div class="info-popover" id="info-parcerias">Cultive o parceiro o ano todo. "Última interação" e "Indicações" são calculadas sozinhas a partir da jornada e das indicações — não se digita nada.</div>'+
      '<div class="toolbar">'+
        '<div class="toolbar-filters">'+
          '<input type="text" id="parceriaSearchInput" class="search-input" placeholder="Buscar por nome..." value="'+esc(state.parceriaSearch)+'">'+
          filterChipHtml('parceriaEstagioFilter', 'Estágio', 'Todos', estagioOpts)+
        '</div>'+
      '</div>'+
      '<div class="card" style="overflow-x:auto;">'+
        '<table><thead><tr><th>Parceiro</th><th>Estágio</th><th>Última interação</th><th>Próxima ação</th><th>Indicações (vieram/fecharam)</th><th></th></tr></thead>'+
        '<tbody id="parceriasListaRoot">'+parceriasListaHtml()+'</tbody></table>'+
      '</div>'+
      '<div class="section-header-row" style="margin-top:30px;">'+
        '<h2 class="section-title">Modelos de Jornada de Parceria</h2>'+
        '<button class="info-icon-btn" type="button" data-info-toggle="info-parceria-modelos">i</button>'+
        '<button class="btn-icon" type="button" id="parceriaModelosToggleBtn" style="margin-left:auto;">'+(state.parceriaModelosCollapsed?'Mostrar':'Recolher')+'</button>'+
      '</div>'+
      '<div class="info-popover" id="info-parceria-modelos">Os modelos que você aplica nas parcerias. O número em cada ação é quantos dias depois do início da jornada ela cai. Editar aqui muda o modelo pras próximas parcerias; quem já recebeu a jornada mantém a versão dela, sem ser afetada.</div>'+
      '<div class="card" style="padding:16px;margin-bottom:32px;'+(state.parceriaModelosCollapsed?'display:none;':'')+'" id="parceriaModelosCard">'+
        '<div id="parceriaModelosRoot">'+parceriaModelosHtml()+'</div>'+
      '</div>';
  }
  function refreshParceriasLista(){
    var root = document.getElementById('parceriasListaRoot');
    if(!root) return;
    root.innerHTML = parceriasListaHtml();
  }
  function attachParceriasEvents(){
    var content = document.getElementById('content');
    var busca = document.getElementById('parceriaSearchInput');
    if(busca){
      busca.addEventListener('input', function(){
        state.parceriaSearch = this.value;
        refreshParceriasLista();
      });
    }
    var novoBtn = document.getElementById('parceriaNovoBtn');
    if(novoBtn){
      novoBtn.addEventListener('click', function(){ abrirParceria(null); });
    }
    bindInfoIcons(content);
    content.addEventListener('click', function(e){
      var toggle = e.target.closest('[data-filter-toggle]');
      if(toggle){
        var menu = toggle.closest('.th-filter').querySelector('.filter-menu');
        var willOpen = !menu.classList.contains('open');
        document.querySelectorAll('.filter-menu.open').forEach(function(m){ m.classList.remove('open'); });
        if(willOpen) menu.classList.add('open');
        return;
      }
      var option = e.target.closest('.filter-menu-option');
      if(option){
        applyFilterSelection(option.getAttribute('data-filter-key'), option.getAttribute('data-filter-value'));
        refreshParceriasLista();
        return;
      }
      var abrirBtn = e.target.closest('[data-parceria-abrir]');
      if(abrirBtn){
        abrirParceria(parseInt(abrirBtn.getAttribute('data-parceria-abrir'),10));
        return;
      }
      var remBtn = e.target.closest('[data-parceria-remover]');
      if(remBtn){
        var pid = parseInt(remBtn.getAttribute('data-parceria-remover'),10);
        var pa = getParceria(pid);
        if(!pa) return;
        if(!confirm('Excluir a parceria "'+pa.nome+'"? Essa ação não pode ser desfeita.')) return;
        state.captacao.parcerias = state.captacao.parcerias.filter(function(x){ return x.id !== pid; });
        saveCaptacao();
        refreshParceriasLista();
        showToast('Parceria excluída.', 'success');
      }
    });
    var modelosToggle = document.getElementById('parceriaModelosToggleBtn');
    if(modelosToggle){
      modelosToggle.addEventListener('click', function(){
        state.parceriaModelosCollapsed = !state.parceriaModelosCollapsed;
        document.getElementById('parceriaModelosCard').style.display = state.parceriaModelosCollapsed ? 'none' : '';
        this.textContent = state.parceriaModelosCollapsed ? 'Mostrar' : 'Recolher';
      });
    }
    bindParceriaModelosEvents();
  }
  function refreshLeadKanban(){
    var root = document.getElementById('leadKanbanRoot');
    if(!root) return;
    root.innerHTML = leadKanbanHtml(state.competencia);
    bindLeadKanbanEvents();
  }
  /* Arrastar entre colunas: a coluna e o alvo do drop e define a etapa nova. */
  function bindLeadKanbanEvents(){
    var root = document.getElementById('leadKanbanRoot');
    if(!root) return;
    var arrastando = null;
    root.querySelectorAll('.lead-card').forEach(function(card){
      card.addEventListener('dragstart', function(e){
        arrastando = card;
        card.classList.add('dragging');
        if(e.dataTransfer){
          e.dataTransfer.effectAllowed = 'move';
          try{ e.dataTransfer.setData('text/plain', card.getAttribute('data-lead-id')); }catch(err){}
        }
      });
      card.addEventListener('dragend', function(){
        card.classList.remove('dragging');
        root.querySelectorAll('.lead-col').forEach(function(c){ c.classList.remove('drag-target'); });
        arrastando = null;
      });
    });
    root.querySelectorAll('.lead-col').forEach(function(col){
      col.addEventListener('dragover', function(e){
        if(!arrastando) return;
        e.preventDefault();
        col.classList.add('drag-target');
      });
      col.addEventListener('dragleave', function(){ col.classList.remove('drag-target'); });
      col.addEventListener('drop', function(e){
        if(!arrastando) return;
        e.preventDefault();
        col.classList.remove('drag-target');
        var id = parseInt(arrastando.getAttribute('data-lead-id'),10);
        moverLeadParaEtapa(id, col.getAttribute('data-lead-col'));
      });
    });
    root.querySelectorAll('[data-lead-open]').forEach(function(el){
      el.addEventListener('click', function(){
        abrirLead(parseInt(this.getAttribute('data-lead-open'),10));
      });
    });
    // clicar no atalho nao deve abrir o lead junto
    root.querySelectorAll('[data-stop]').forEach(function(a){
      a.addEventListener('click', function(e){ e.stopPropagation(); });
    });
  }
  function moverLeadParaEtapa(id, etapa){
    var l = getLead(id);
    if(!l || l.etapa === etapa) return;
    var anterior = l.etapa;
    l.etapa = etapa;
    if(etapaEhFinal(etapa)){
      // prende ao mes atual pra sumir quando trocar de competencia
      l.mesFinalizado = state.competencia;
      l.dataFinalizado = todayISODate();
    } else {
      l.mesFinalizado = null;
      l.dataFinalizado = null;
    }
    // ordem no fim da coluna nova
    var naEtapa = state.captacao.leads.filter(function(x){ return x.etapa === etapa && x.id !== id; });
    l.ordem = naEtapa.reduce(function(m,x){ return Math.max(m, x.ordem||0); }, -1) + 1;
    saveCaptacao();
    refreshLeadKanban();
    if(etapa === 'fechado' && anterior !== 'fechado'){
      // indicação vira convertida sozinha e o contador do indicador sobe
      avisarConversaoDeIndicacao(converterIndicacaoDoLead(id));
      if(!l.pacienteId){ criarPacienteDoLead(l); return; }
    }
    showToast('Lead movido para "'+etapaInfo(etapa).label+'".', 'success');
  }
  /* Avisa a conversão e, se bateu marco, a recompensa conquistada. */
  function avisarConversaoDeIndicacao(r){
    if(!r) return;
    if(r.conquistas.length){
      var lista = r.conquistas.map(function(c){ return c.recompensa; }).join(' e ');
      showToast('🎁 '+r.indicacao.indicadorNome+' conquistou: '+lista+' ('+r.total+' indicações convertidas)', 'success');
    } else {
      showToast('Indicação de '+r.indicacao.indicadorNome+' convertida ('+r.total+' no total).', 'success');
    }
  }
  /* Lead que fecha vira paciente automaticamente. O cadastro nasce incompleto de
     proposito — ele aparece no "Resumo de Entrega de Paciente" do Dashboard com tudo
     que falta preencher, entao nada se perde. */
  function criarPacienteDoLead(l){
    var novo = emptyPatientCore();
    novo.id = nextId();
    novo.nome = l.nome || 'Novo paciente';
    novo.telefone = l.whatsapp || '';
    novo.createdAt = nextCreatedAt();
    novo.createdDate = todayISODate();
    novo.meses = {};
    novo.leadId = l.id;
    if(l.observacoes) novo.observacoes = l.observacoes;
    state.patients.push(novo);
    l.pacienteId = novo.id;
    savePatients();
    saveCaptacao();
    refreshLeadKanban();
    showToast('Lead fechado! Paciente "'+novo.nome+'" criado — complete o cadastro.', 'success');
  }
  /* ---------- Indicações ----------
     Guarda so o VINCULO: quem indicou -> quem foi indicado. A pessoa indicada vira um
     Lead (fonte unica), nunca um cadastro paralelo. */
  var INDICADOR_TIPOS = [
    { key:'paciente', label:'Paciente' },
    { key:'lead',     label:'Lead' },
    { key:'parceria', label:'Parceria' },
    { key:'outro',    label:'Outra pessoa' }
  ];
  function nextIndicacaoId(){
    if(!state.captacao.indicacoes.length) return 1;
    return state.captacao.indicacoes.reduce(function(m,i){ return Math.max(m, i.id||0); }, 0) + 1;
  }
  /* Chave estavel do indicador, pra somar as conversoes e as recompensas dele. */
  function indicadorChave(ind){
    return ind.indicadorTipo + ':' + (ind.indicadorId !== null && ind.indicadorId !== undefined ? ind.indicadorId : (ind.indicadorNome||'').toLowerCase());
  }
  /* Procura a pessoa nas bases antes de criar qualquer coisa — e o que evita duplicata. */
  function acharLeadPorContato(nome, whatsapp, instagram){
    if(!state.captacao) return null;
    var wa = whatsappDigits(whatsapp||'');
    var ig = instagramHandle(instagram||'').toLowerCase();
    var n = (nome||'').trim().toLowerCase();
    return state.captacao.leads.filter(function(l){
      if(wa && whatsappDigits(l.whatsapp||'') === wa) return true;
      if(ig && instagramHandle(l.instagram||'').toLowerCase() === ig) return true;
      if(n && (l.nome||'').trim().toLowerCase() === n) return true;
      return false;
    })[0] || null;
  }
  /* Automação central: cadastrou indicação e a pessoa não existe -> cria o Lead sozinho,
     na coluna Novo, com Origem = Indicação e o indicador preenchido. Se já existe,
     apenas vincula. */
  function criarOuVincularLeadDaIndicacao(dados){
    var existente = acharLeadPorContato(dados.indicadoNome, dados.indicadoWhatsapp, dados.indicadoInstagram);
    if(existente){
      if(!existente.indicadoPor) existente.indicadoPor = dados.indicadorNome;
      if(!existente.origem || existente.origem === 'Orgânico') existente.origem = 'Indicação';
      return { lead: existente, criado: false };
    }
    var novo = {
      id: nextLeadId(), nome: dados.indicadoNome,
      whatsapp: dados.indicadoWhatsapp || '', instagram: dados.indicadoInstagram || '',
      origem: 'Indicação', indicadoPor: dados.indicadorNome,
      temperatura: 'Morno', etiquetas: [], etapa: 'novo',
      criadoEm: todayISODate(), mesFinalizado: null, pacienteId: null,
      observacoes: '', ordem: 0
    };
    state.captacao.leads.push(novo);
    return { lead: novo, criado: true };
  }
  function indicacoesDoIndicador(chave){
    return state.captacao.indicacoes.filter(function(i){ return indicadorChave(i) === chave; });
  }
  function conversoesDoIndicador(chave){
    return indicacoesDoIndicador(chave).filter(function(i){ return i.convertida; }).length;
  }
  /* Depois de uma conversão, confere se a pessoa bateu algum marco novo. As conquistas
     ficam registradas pra você controlar a entrega — e nunca são recalculadas pra trás. */
  function verificarMarcos(chave, indicadorNome){
    var total = conversoesDoIndicador(chave);
    var novas = [];
    (state.captacao.marcos||[]).forEach(function(m){
      if(total < m.fechamentos) return;
      var jaTem = state.captacao.conquistas.some(function(c){
        return c.chave === chave && c.fechamentos === m.fechamentos;
      });
      if(jaTem) return;
      var nova = { chave: chave, indicadorNome: indicadorNome, fechamentos: m.fechamentos,
                   recompensa: m.recompensa, dataConquista: todayISODate(),
                   entregue: false, dataEntrega: null };
      state.captacao.conquistas.push(nova);
      novas.push(nova);
    });
    return novas;
  }
  /* Chamado quando um lead entra em "Fechado": se ele veio de indicação, a indicação
     é marcada como convertida e o contador do indicador sobe. */
  function converterIndicacaoDoLead(leadId){
    if(!state.captacao) return null;
    var ind = state.captacao.indicacoes.filter(function(i){ return i.leadId === leadId && !i.convertida; })[0];
    if(!ind) return null;
    ind.convertida = true;
    ind.dataConversao = todayISODate();
    var chave = indicadorChave(ind);
    var novas = verificarMarcos(chave, ind.indicadorNome);
    saveCaptacao();
    return { indicacao: ind, conquistas: novas, total: conversoesDoIndicador(chave) };
  }

  function indicacoesRows(){
    var lista = (state.captacao ? state.captacao.indicacoes : []).slice()
      .sort(function(a,b){ return (b.data||'').localeCompare(a.data||''); });

  /* Placar por pessoa: quantas indicou, quantas fecharam. Tudo somado na hora a partir
     das indicações — não existe campo manual pra desencontrar. */
  function placarIndicadoresRows(){
    if(!state.captacao) return '';
    var porChave = {};
    state.captacao.indicacoes.forEach(function(i){
      var k = indicadorChave(i);
      if(!porChave[k]) porChave[k] = { nome:i.indicadorNome, total:0, convertidas:0 };
      porChave[k].total++;
      if(i.convertida) porChave[k].convertidas++;
    });
    var lista = Object.keys(porChave).map(function(k){
      var x = porChave[k]; x.chave = k;
      x.conquistas = state.captacao.conquistas.filter(function(c){ return c.chave === k; });
      return x;
    }).sort(function(a,b){ return b.convertidas - a.convertidas || b.total - a.total; });
    if(!lista.length) return '<tr><td colspan="4"><div class="empty-state">Ninguém indicou ainda.</div></td></tr>';
    return lista.map(function(x){
      var recompensas = x.conquistas.length
        ? x.conquistas.map(function(c){
            return '<div style="margin-bottom:3px;">'+
              '<span class="badge '+(c.entregue?'badge-success':'badge-warning')+'">'+(c.entregue?'✓ entregue':'a entregar')+'</span> '+
              '<span style="font-size:12.5px;">'+esc(c.recompensa)+'</span> '+
              (c.entregue
                ? '<span class="cell-muted" style="font-size:11px;">em '+formatDate(c.dataEntrega)+'</span>'
                : '<button class="btn-icon" data-conq-entregar="'+esc(c.chave)+'|'+c.fechamentos+'" style="padding:3px 8px;font-size:11px;">Marcar entregue</button>')+
            '</div>';
          }).join('')
        : '<span class="cell-muted" style="font-size:12.5px;">—</span>';
      return '<tr>'+
        '<td><b>'+esc(x.nome)+'</b></td>'+
        '<td>'+x.total+'</td>'+
        '<td><span class="badge '+(x.convertidas?'badge-success':'badge-gray')+'">'+x.convertidas+'</span></td>'+
        '<td>'+recompensas+'</td>'+
      '</tr>';
    }).join('');
  }
  function marcosRows(){
    var lista = (state.captacao ? state.captacao.marcos : []).slice()

        '<input type="text" class="jornada-template-nome" data-marco-recompensa="'+i+'" value="'+esc(m.recompensa)+'" placeholder="Recompensa">'+
        '<button type="button" class="btn-icon btn-danger-outline" data-marco-remover="'+i+'">×</button>'+
      '</div>';
    }).join('');
  }

  function refreshIndicacoes(){

  function bindIndicacoesEvents(){
    var content = document.getElementById('content');
    if(!content) return;
    content.querySelectorAll('[data-ind-abrir-lead]').forEach(function(btn){
      btn.addEventListener('click', function(){ abrirLead(parseInt(this.getAttribute('data-ind-abrir-lead'),10)); });
    });
    content.querySelectorAll('[data-ind-remover]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = parseInt(this.getAttribute('data-ind-remover'),10);
        if(!confirm('Excluir esta indicação? O lead criado a partir dela continua no funil.')) return;
        state.captacao.indicacoes = state.captacao.indicacoes.filter(function(i){ return i.id !== id; });
        saveCaptacao();
        refreshIndicacoes();
        showToast('Indicação excluída.', 'success');
      });
    });
    content.querySelectorAll('[data-conq-entregar]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = this.getAttribute('data-conq-entregar').split('|');
        var c = state.captacao.conquistas.filter(function(x){
          return x.chave === parts[0] && x.fechamentos === parseInt(parts[1],10);
        })[0];
        if(!c) return;
        c.entregue = true;
        c.dataEntrega = todayISODate();
        saveCaptacao();
        refreshIndicacoes();
        showToast('Recompensa marcada como entregue.', 'success');
      });
    });
    content.querySelectorAll('[data-marco-qtd]').forEach(function(el){
      el.addEventListener('change', function(){
        var v = parseInt(this.value,10);
        state.captacao.marcos[parseInt(this.getAttribute('data-marco-qtd'),10)].fechamentos = isNaN(v)||v<1 ? 1 : v;
        saveCaptacao();
        refreshIndicacoes();
      });
    });
    content.querySelectorAll('[data-marco-recompensa]').forEach(function(el){
      el.addEventListener('blur', function(){
        state.captacao.marcos[parseInt(this.getAttribute('data-marco-recompensa'),10)].recompensa = this.value.trim() || 'Recompensa';
        saveCaptacao();
      });
    });
    content.querySelectorAll('[data-marco-remover]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.captacao.marcos.splice(parseInt(this.getAttribute('data-marco-remover'),10), 1);
        saveCaptacao();
        refreshIndicacoes();
      });
    });
    var addBtn = document.getElementById('marcoAddBtn');
    if(addBtn && !addBtn.__bound){
      addBtn.__bound = true;
      addBtn.addEventListener('click', function(){
        var maior = state.captacao.marcos.reduce(function(m,x){ return Math.max(m, x.fechamentos||0); }, 0);
        state.captacao.marcos.push({ fechamentos: maior+1, recompensa: 'Nova recompensa' });
        saveCaptacao();
        refreshIndicacoes();
      });
    }
    var novaBtn = document.getElementById('indNovaBtn');
    if(novaBtn && !novaBtn.__bound){
      novaBtn.__bound = true;
      novaBtn.addEventListener('click', function(){ state.modal = 'indicacao'; renderModal(); });
    }
  }

  function bindIndicacaoModalEvents(){
    var tipo = 'paciente';
    function mostrarCampo(){
      document.getElementById('ind_paciente').style.display = tipo==='paciente' ? '' : 'none';
      document.getElementById('ind_lead').style.display     = tipo==='lead' ? '' : 'none';
      document.getElementById('ind_parceria').style.display = tipo==='parceria' ? '' : 'none';
      document.getElementById('ind_outro').style.display    = tipo==='outro' ? '' : 'none';
    }
    document.querySelectorAll('[data-ind-tipo]').forEach(function(btn){
      btn.addEventListener('click', function(){
        tipo = this.getAttribute('data-ind-tipo');
        document.querySelectorAll('[data-ind-tipo]').forEach(function(b){
          b.classList.toggle('active', b.getAttribute('data-ind-tipo') === tipo);
        });
        mostrarCampo();
      });
    });
    mostrarCampo();
    document.getElementById('indCancelBtn').addEventListener('click', closeModal);
    document.getElementById('indSalvarBtn').addEventListener('click', function(){
      var nome = document.getElementById('ind_nome').value.trim();
      if(!nome){ alert('Informe o nome de quem foi indicado.'); return; }
      var indicadorId = null, indicadorNome = '';
      if(tipo === 'paciente'){
        var pid = parseInt(document.getElementById('ind_paciente').value,10);
        var p = getPatient(pid);
        if(!p){ alert('Selecione quem indicou.'); return; }
        indicadorId = pid; indicadorNome = p.nome;
      } else if(tipo === 'lead'){
        var lid = parseInt(document.getElementById('ind_lead').value,10);
        var l = getLead(lid);
        if(!l){ alert('Selecione quem indicou.'); return; }
        indicadorId = lid; indicadorNome = l.nome;
      } else if(tipo === 'parceria'){
        var paid = parseInt(document.getElementById('ind_parceria').value,10);
        var pa = getParceria(paid);
        if(!pa){ alert('Selecione quem indicou.'); return; }
        indicadorId = paid; indicadorNome = pa.nome;
      } else {
        indicadorNome = document.getElementById('ind_outro').value.trim();
        if(!indicadorNome){ alert('Informe o nome de quem indicou.'); return; }
      }
      var dados = {
        indicadorNome: indicadorNome,
        indicadoNome: nome,
        indicadoWhatsapp: document.getElementById('ind_whatsapp').value.trim(),
        indicadoInstagram: document.getElementById('ind_instagram').value.trim()
      };
      var r = criarOuVincularLeadDaIndicacao(dados);
      var ind = {
        id: nextIndicacaoId(), indicadorTipo: tipo, indicadorId: indicadorId, indicadorNome: indicadorNome,
        leadId: r.lead.id, indicadoNome: nome, data: document.getElementById('ind_data').value || todayISODate(),
        convertida: false, dataConversao: null, observacoes: document.getElementById('ind_obs').value.trim()
      };
      // lead ja fechado no momento do cadastro? entao a indicacao ja nasce convertida
      if(r.lead.etapa === 'fechado'){
        ind.convertida = true;
        ind.dataConversao = todayISODate();
      }
      state.captacao.indicacoes.push(ind);
      var conquistas = ind.convertida ? verificarMarcos(indicadorChave(ind), indicadorNome) : [];
      saveCaptacao();
      closeModal();
      render();
      if(conquistas.length){
        showToast('🎁 '+indicadorNome+' conquistou: '+conquistas.map(function(c){return c.recompensa;}).join(' e '), 'success');
      } else {
        showToast(r.criado ? 'Indicação salva e Lead "'+nome+'" criado no funil.' : 'Indicação salva e vinculada ao lead existente.', 'success');
      }
    });
  }

  /* ---------- Agenda de Captação ----------
     Nao guarda nada: le as tarefas que ja existem nas outras areas. Concluir aqui
     conclui na origem porque e o MESMO registro, nao uma copia. Leads e Parcerias ja
     tem jornada — quando Indicacoes e Comunidade tiverem tambem, e so acrescentar
     nesta funcao e o resto da tela funciona sozinho. */
  /* ---------- Comunidade: cronograma de conteudos/acoes do grupo de WhatsApp e do Instagram ----------
     Diferente de Leads/Parcerias, aqui nao ha "uma pessoa = um registro" nem motor de jornada —
     e so uma agenda de itens datados, cadastrados um a um (sem recorrencia automatica). Cada item
     tem canal (whatsapp/instagram) e um tipo que muda de acordo com o canal. Itens pendentes com
     data entram tambem na Agenda de Captacao (ver agendaCaptacaoItens mais abaixo). */
  var COMUNIDADE_CANAIS = [
    { key:'whatsapp',  label:'WhatsApp',  ico:'💬', cor:'#25D366' },
    { key:'instagram', label:'Instagram', ico:'📷', cor:'#DD2A7B' }
  ];
  var COMUNIDADE_TIPOS = {
    whatsapp: [
      { key:'conteudo',   label:'Conteúdo/Post', ico:'📝' },
      { key:'desafio',    label:'Desafio interno', ico:'🏆' },
      { key:'presencial', label:'Ação presencial', ico:'🤝' }
    ],
    instagram: [
      { key:'reels',     label:'Reels', ico:'🎬' },
      { key:'carrossel', label:'Carrossel', ico:'🖼️' }
    ]
  };
  function comunidadeCanalInfo(key){
    return COMUNIDADE_CANAIS.filter(function(c){ return c.key === key; })[0] || COMUNIDADE_CANAIS[0];
  }
  function comunidadeTipoInfo(canal, tipoKey){
    var lista = COMUNIDADE_TIPOS[canal] || [];
    return lista.filter(function(t){ return t.key === tipoKey; })[0] || lista[0];

  function nextComunidadeId(){

  function comunidadeItensPorDia(mesKey){
    var mapa = {};
    comunidadeItensFiltrados().forEach(function(it){
      if(!it.data || it.data.slice(0,7) !== mesKey) return;
      if(!mapa[it.data]) mapa[it.data] = [];
      mapa[it.data].push(it);
    });
    return mapa;
  }

  function comunidadeCalendarioHtml(){
    var mesKey = state.comunidadeCalMes || getCurrentMonthKey();
    var parsed = parseMonthKey(mesKey);
    var year = parsed.year, month = parsed.month;
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var startWeekday = new Date(year, month, 1).getDay();
    var todayIso = todayISODate();
    var porDia = comunidadeItensPorDia(mesKey);
    var weekdayHeaders = ['D','S','T','Q','Q','S','S'].map(function(w){ return '<span class="com-cal-wd">'+w+'</span>'; }).join('');
    var cells = '';
    for(var i=0;i<startWeekday;i++){ cells += '<span class="com-cal-cell empty"></span>'; }
    for(var day=1; day<=daysInMonth; day++){
      var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      var itensDia = porDia[dateStr] || [];
      var isToday = dateStr === todayIso;
      var isSelected = dateStr === state.comunidadeCalSelecionado;
      var dots = itensDia.slice(0,4).map(function(it){
        var cor = comunidadeCanalInfo(it.canal).cor;
        return '<span class="com-cal-dot" style="background:'+cor+(it.concluido?';opacity:.35':'')+'"></span>';
      }).join('');
      cells += '<button type="button" class="com-cal-cell'+(isToday?' today':'')+(isSelected?' selected':'')+'" data-com-cal-dia="'+dateStr+'">'+
        '<span class="com-cal-daynum">'+day+'</span>'+
        (dots ? '<span class="com-cal-dots">'+dots+'</span>' : '')+
      '</button>';
    }
    var painelDia = state.comunidadeCalSelecionado ? comunidadeDiaPainelHtml(state.comunidadeCalSelecionado, porDia[state.comunidadeCalSelecionado]||[]) : '';
    return ''+
      '<div class="com-cal-header">'+
        '<button type="button" class="jornada-cal-nav" data-com-cal-nav="prev">‹</button>'+
        '<span>'+monthLabel(mesKey)+'</span>'+
        '<button type="button" class="jornada-cal-nav" data-com-cal-nav="next">›</button>'+
      '</div>'+
      '<div class="com-cal-grid">'+weekdayHeaders+cells+'</div>'+
      '<div id="comCalPainel">'+painelDia+'</div>';
  }

  function bindComunidadeModalEvents(){
    var editing = state.activeComunidadeId ? getComunidadeItem(state.activeComunidadeId) : null;
    var canalAtual = editing ? editing.canal : 'whatsapp';
    function atualizarTipos(){
      document.getElementById('com_tipo').innerHTML = (COMUNIDADE_TIPOS[canalAtual]||[]).map(function(t){
        return '<option value="'+t.key+'">'+t.ico+' '+esc(t.label)+'</option>';

        it.canal = canalAtual; it.tipo = tipo; it.data = data; it.descricao = descricao;
      } else {
        state.captacao.comunidade.push({
          id: nextComunidadeId(), canal: canalAtual, tipo: tipo, data: data,
          descricao: descricao, concluido: false, dataConclusao: null
        });

      render();
      showToast('Cronograma atualizado.', 'success');

  /* Wiring dos botoes de acao de um item de Comunidade (concluir/editar/excluir), reaproveitado
     tanto na propria aba Comunidade quanto no bloco de Comunidade dentro da Agenda de Captacao —
     so muda o "onChange" (refresh completo numa, refresh so do root da agenda na outra). */
  function bindComunidadeItemActionsIn(root, onChange){
    if(!root) return;
    root.querySelectorAll('[data-com-done]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var id = parseInt(this.getAttribute('data-com-done'),10);
        var it = getComunidadeItem(id);
        if(!it) return;
        it.concluido = this.checked;
        it.dataConclusao = this.checked ? todayISODate() : null;
        saveCaptacao();
        onChange();
        showToast(this.checked ? 'Item concluído.' : 'Item reaberto.', 'success');
      });
    });
    root.querySelectorAll('[data-com-editar]').forEach(function(btn){
      btn.addEventListener('click', function(){ abrirComunidadeItem(parseInt(this.getAttribute('data-com-editar'),10), null); });
    });
    root.querySelectorAll('[data-com-excluir]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = parseInt(this.getAttribute('data-com-excluir'),10);
        if(!confirm('Excluir este item do cronograma?')) return;
        state.captacao.comunidade = state.captacao.comunidade.filter(function(it){ return it.id !== id; });
        saveCaptacao();
        onChange();
        showToast('Item excluído.', 'success');
      });
    });
  }

      });

  function agendaCaptacaoItens(){
    var itens = [];
    if(!state.captacao) return itens;
    state.captacao.leads.forEach(function(l){
      if(!l.jornada || !Array.isArray(l.jornada.tarefas)) return;
      l.jornada.tarefas.forEach(function(t){
        if(t.arquivado || t.concluido || !t.dataAlvo) return;
        itens.push({
          origem:'lead', origemLabel:'Lead', origemIco:'🎯',
          pessoaId:'lead-'+l.id, pessoaNome:l.nome,
          whatsapp:l.whatsapp, instagram:l.instagram,
          abrirAttr:'data-agenda-abrir-lead="'+l.id+'"',
          doneAttr:'data-agenda-done="lead:'+l.id+':'+t.id+'"',
          tarefa:t, diff:diasParaVencer(t.dataAlvo)
        });
      });
    });
    state.captacao.parcerias.forEach(function(pa){
      if(!pa.jornada || !Array.isArray(pa.jornada.tarefas)) return;
      pa.jornada.tarefas.forEach(function(t){
        if(t.arquivado || t.concluido || !t.dataAlvo) return;
        itens.push({
          origem:'parceria', origemLabel:'Parceria', origemIco:'🤝',
          pessoaId:'parceria-'+pa.id, pessoaNome:pa.nome,
          whatsapp:pa.whatsapp, instagram:pa.instagram,
          abrirAttr:'data-agenda-abrir-parceria="'+pa.id+'"',
          doneAttr:'data-agenda-done="parceria:'+pa.id+':'+t.id+'"',
          tarefa:t, diff:diasParaVencer(t.dataAlvo)
        });
      });
    });
    return itens;
  }
  var AGENDA_FAIXAS = [
