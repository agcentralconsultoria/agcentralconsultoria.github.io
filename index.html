<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angelo Garcia CRM</title>
<style>
  :root{
    --primary:#EA580C;
    --primary-dark:#C2410C;
    --primary-light:#FFEDD5;
    --secondary:#111111;
    --bg:#F4F5F7;
    --white:#FFFFFF;
    --border:#E4E4E7;
    --text:#18181B;
    --text-muted:#6B7280;
    --success:#16A34A;
    --success-bg:#DCFCE7;
    --warning:#CA8A04;
    --warning-bg:#FEF9C3;
    --danger:#DC2626;
    --danger-bg:#FEE2E2;
    --info:#2563EB;
    --info-bg:#DBEAFE;
    --gray-badge:#6B7280;
    --gray-badge-bg:#F0F0F1;
    --baby:#DB2777;
    --baby-bg:#FCE7F3;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.18);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg,var(--secondary) 0%,#1f1f1f 55%,var(--primary-dark) 130%);
    padding:20px;
  }
  .login-card{
    background:var(--white);
    width:100%;
    max-width:400px;
    border-radius:16px;
    padding:40px 36px;
    box-shadow:var(--shadow-lg);
  }
  .login-logo{
    width:56px;height:56px;border-radius:50%;
    object-fit:cover;display:block;
    margin:0 auto 18px;
  }
  .login-card h1{
    text-align:center;font-size:20px;margin:0 0 2px;color:var(--secondary);
  }
  .login-card p.sub{
    text-align:center;color:var(--text-muted);font-size:13px;margin:0 0 26px;
  }
  .form-group{margin-bottom:16px;}
  .form-group label{
    display:block;font-size:12.5px;font-weight:600;color:var(--secondary);margin-bottom:6px;
  }
  .form-group input[type=text],
  .form-group input[type=email],
  .form-group input[type=password],
  .form-group input[type=date],
  .form-group input[type=number],
  .form-group select,
  .form-group textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:var(--white);
    color:var(--text);
    transition:border-color .15s, box-shadow .15s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-light);
  }
  .form-group textarea{resize:vertical;min-height:70px;}
  .login-error{
    background:var(--danger-bg);
    color:var(--danger);
    font-size:13px;
    padding:9px 12px;
    border-radius:8px;
    margin-bottom:14px;
    display:none;
  }
  .login-error.show{display:block;}
  .security-secret-key{
    font-family:monospace;font-size:15px;font-weight:700;letter-spacing:1px;
    background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;margin:6px 0 14px;word-break:break-all;user-select:all;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:8px;
    padding:10px 18px;
    font-size:14px;font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s, opacity .15s, transform .05s;
  }
  .btn:active{transform:scale(.98);}
  .btn-block{width:100%;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary{background:var(--white);color:var(--secondary);border:1px solid var(--border);}
  .btn-secondary:hover{background:#F5F5F5;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#B91C1C;}
  .btn-dark{background:var(--secondary);color:#fff;}
  .btn-dark:hover{background:#000;}
  .login-hint{margin-top:18px;text-align:center;font-size:11.5px;color:var(--text-muted);}

  /* ---------- Header / Nav ---------- */
  header.topbar{
    background:var(--secondary);
    color:#fff;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:64px;
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .logo-box{
    width:38px;height:38px;border-radius:50%;
    object-fit:cover;flex-shrink:0;
  }
  .brand-text{line-height:1.15;}
  .brand-text strong{display:block;font-size:15.5px;letter-spacing:.2px;}
  .brand-text span{display:block;font-size:11px;color:#9CA3AF;}
  .nav-tabs{display:flex;gap:6px;}
  .nav-tab{
    background:transparent;border:none;color:#D1D5DB;
    padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .nav-tab:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-tab.active{background:var(--primary);color:#fff;}
  .header-right{display:flex;align-items:center;gap:14px;}
  .header-user{font-size:12.5px;color:#9CA3AF;}
  .logout-btn{
    background:transparent;color:#D1D5DB;border:1px solid #3A3A3A;
    padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .logout-btn:hover{background:#1f1f1f;color:#fff;border-color:#4b4b4b;}

  /* ---------- Kanban de Leads ---------- */
  .lead-kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;}
  .lead-col{
    flex:0 0 250px;background:#FAFAFA;border:1px solid var(--border);border-radius:10px;
    padding:11px;min-height:120px;
  }
  .lead-col.drag-target{border-color:var(--primary);background:var(--primary-light);}
  .lead-col-header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--border);
  }
  .lead-col-title{font-size:13px;font-weight:700;color:var(--secondary);}
  .lead-col-title .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .etapa-novo .dot{background:var(--gray-badge);}
  .etapa-conversa .dot{background:var(--info);}
  .etapa-negociacao .dot{background:var(--warning);}
  .etapa-fechado .dot{background:var(--success);}
  .etapa-sem-avanco .dot{background:var(--danger);}
  .lead-cards{min-height:40px;}
  .lead-card{
    background:var(--white);border:1px solid var(--border);border-radius:9px;
    padding:10px;margin-bottom:7px;cursor:grab;
  }
  .lead-card:hover{border-color:var(--primary);}
  .lead-card.dragging{opacity:.4;cursor:grabbing;}
  .lead-card-nome{font-size:13.5px;font-weight:700;color:var(--secondary);margin-bottom:5px;line-height:1.3;}
  .lead-card-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  .lead-temp{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;}
  .temp-Frio{background:var(--info-bg);color:var(--info);}
  .temp-Morno{background:var(--warning-bg);color:var(--warning);}
  .temp-Quente{background:var(--danger-bg);color:var(--danger);}
  .lead-tag{
    font-size:10.5px;padding:2px 7px;border-radius:999px;white-space:nowrap;
    background:var(--gray-badge-bg);color:var(--gray-badge);font-weight:600;
  }
  .lead-card-acoes{display:flex;gap:5px;margin-top:7px;}
  .lead-link-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:7px;text-decoration:none;font-size:13px;
    border:1px solid var(--border);background:var(--white);cursor:pointer;flex-shrink:0;
  }
  .lead-link-btn.wa{background:#25D366;border-color:#25D366;color:#fff;}
  .lead-link-btn.ig{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF);border-color:transparent;color:#fff;}
  .lead-link-btn:hover{opacity:.85;}
  .lead-empty-col{font-size:12px;color:var(--text-muted);text-align:center;padding:14px 6px;}
  /* Agenda de Captação */
  .agenda-faixa{margin-bottom:18px;}
  .agenda-faixa:last-child{margin-bottom:0;}
  .agenda-faixa-titulo{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .agenda-item{
    display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--border);margin-bottom:6px;background:var(--white);
  }
  .agenda-item input[type=checkbox]{width:17px;height:17px;flex-shrink:0;cursor:pointer;margin-top:2px;}
  .agenda-item-body{flex:1;min-width:0;}
  .agenda-item-nome{font-size:13px;font-weight:600;color:var(--text);line-height:1.35;}
  .agenda-item-meta{font-size:11.5px;margin-top:2px;}
  .agenda-item-acoes{display:flex;gap:5px;flex-shrink:0;}

  /* Ações da Jornada do Lead dentro do modal */
  .lead-tarefa{
    border:1px solid var(--border);border-radius:9px;padding:9px 10px;margin-bottom:6px;background:var(--white);
  }
  .lead-tarefa.status-atrasado{border-color:#FCA5A5;background:var(--danger-bg);}
  .lead-tarefa.status-hoje{border-color:#FDE68A;background:var(--warning-bg);}
  .lead-tarefa.feita{opacity:.6;}
  .lead-tarefa.feita .lead-tarefa-nome{text-decoration:line-through;}
  .lead-tarefa-top{display:flex;align-items:flex-start;gap:9px;}
  .lead-tarefa input[type=checkbox]{width:17px;height:17px;flex-shrink:0;cursor:pointer;margin-top:2px;}
  .lead-tarefa-body{flex:1;min-width:0;cursor:pointer;}
  .lead-tarefa-nome{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.35;}
  .lead-tarefa-edit{margin-top:9px;padding-top:9px;border-top:1px solid var(--border);}
  .lead-proxima{font-size:11px;color:var(--text-muted);margin-top:5px;line-height:1.35;}
  .etiqueta-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .etiqueta-btn{
    padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:var(--white);
    font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;
  }
  .etiqueta-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .etiqueta-btn:hover{border-color:var(--primary);}

  /* ---------- Barra lateral ----------
     No computador e uma coluna fixa a esquerda; no celular (regra la embaixo) vira
     uma gaveta que abre por cima do conteudo. Herda o preto do cabecalho e o laranja
     do item ativo, pra identidade visual continuar a mesma. */
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{
    background:var(--secondary);color:#fff;width:228px;flex:0 0 228px;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    transition:width .16s ease, flex-basis .16s ease;z-index:40;
  }
  .sidebar.collapsed{width:62px;flex-basis:62px;}
  .sidebar-brand{
    display:flex;align-items:center;gap:10px;padding:14px 12px;min-height:64px;
    border-bottom:1px solid #262626;
  }
  .sidebar-brand .brand-text{overflow:hidden;white-space:nowrap;}
  .sidebar.collapsed .sidebar-brand{justify-content:center;}
  .sidebar.collapsed .sidebar-brand .brand-text{display:none;}
  .sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px;}
  .side-item{
    width:100%;display:flex;align-items:center;gap:11px;
    background:transparent;border:none;color:#D1D5DB;
    padding:10px 11px;border-radius:8px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:inherit;text-align:left;margin-bottom:3px;
  }
  .side-item:hover{background:rgba(255,255,255,.07);color:#fff;}
  .side-item.active{background:var(--primary);color:#fff;}
  .side-ico{flex:0 0 20px;width:20px;text-align:center;font-size:15px;line-height:1;}
  .side-label{flex:1;min-width:0;overflow:hidden;white-space:nowrap;}
  .side-caret{flex:0 0 auto;font-size:10px;opacity:.7;}
  .sidebar.collapsed .side-label,.sidebar.collapsed .side-caret{display:none;}
  .sidebar.collapsed .side-item{justify-content:center;gap:0;padding:10px 0;}
  .side-sub{margin:1px 0 5px;}
  .side-sub .side-item{
    font-size:13px;font-weight:500;padding-left:34px;color:#A9A29A;
  }
  .side-sub .side-item.active{background:rgba(234,88,12,.18);color:#FDBA74;}
  .sidebar.collapsed .side-sub{display:none;}
  .sidebar-foot{padding:10px 8px;border-top:1px solid #262626;}
  .sidebar-foot .side-item{font-size:13px;font-weight:600;}
  .side-toggle-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    background:transparent;border:1px solid #3A3A3A;color:#D1D5DB;
    padding:7px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:inherit;margin-top:4px;
  }
  .side-toggle-btn:hover{background:#1f1f1f;color:#fff;border-color:#4b4b4b;}
  .app-main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .mobile-topbar{display:none;}
  .sidebar-backdrop{display:none;}

  .container{max-width:1180px;margin:0 auto;padding:28px 24px 60px;width:100%;}

  /* ---------- Dashboard ---------- */
  .page-title{font-size:22px;margin:0 0 4px;color:var(--secondary);}
  .page-sub{color:var(--text-muted);font-size:13.5px;margin:0 0 24px;}
  .kpi-grid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-bottom:32px;
  }
  .kpi-card{
    background:var(--white);border-radius:var(--radius);padding:20px 22px;
    box-shadow:var(--shadow);border-left:4px solid var(--primary);
    cursor:pointer;text-align:left;border-top:none;border-right:none;border-bottom:none;
    font-family:inherit;width:100%;transition:box-shadow .15s, transform .05s;
  }
  .kpi-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);}
  .kpi-card:active{transform:scale(.99);}
  .kpi-card.selected{outline:2px solid var(--primary);outline-offset:-1px;}
  .kpi-grid-sm{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:32px;max-width:640px;}
  .quick-access-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:32px;}
  .quick-access-grid .quick-access-full{grid-column:1/-1;}
  .kpi-card.alt{border-left-color:var(--warning);}
  .kpi-card.danger{border-left-color:var(--danger);}
  .ficha-treino-item{border:1px solid var(--border);border-radius:9px;margin-bottom:8px;overflow:hidden;background:var(--white);}
  .ficha-treino-item.current{outline:2px solid var(--primary);outline-offset:-1px;}
  .ficha-treino-header{
    width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 12px;background:none;border:none;font-family:inherit;font-size:13.5px;
    color:var(--text);cursor:pointer;text-align:left;
  }
  .ficha-treino-header:hover{background:#FAFAFA;}
  .ficha-treino-summary{flex:1;min-width:150px;font-weight:600;}
  .ficha-treino-arrow{color:var(--text-muted);font-size:12px;}
  .ficha-treino-body{padding:0 12px 12px;border-top:1px solid var(--border);}
  .ficha-treino-body .jornada-select-row{margin-top:12px;}
  .ficha-treino-body input[type=date]{
    padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    font-size:13.5px;font-family:inherit;background:var(--white);color:var(--text);
  }
  .ficha-treino-body textarea{
    width:100%;margin:4px 0 10px;padding:10px 12px;border:1px solid var(--border);
    border-radius:8px;font-size:13.5px;font-family:inherit;background:var(--white);
    color:var(--text);resize:vertical;min-height:90px;line-height:1.5;
  }
  .ficha-treino-body textarea:focus,.ficha-treino-body input[type=date]:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);
  }
  .volume-grupo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px;}
  .macro-columns{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap;align-items:flex-start;}
  .macro-col{flex:1 1 220px;min-width:200px;}
  @media (max-width:720px){ .macro-columns{flex-direction:column;} .macro-col{width:100%;} }
  .volume-grupo-grid input[type=number]{
    width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:7px;
    font-size:13px;font-family:inherit;background:var(--white);color:var(--text);text-align:center;
  }
  .volume-grupo-grid input[type=number]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
  .grupo-muscular-manager{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .compare-chips{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px;}
  .compare-chip{
    display:inline-flex;align-items:center;gap:5px;padding:2px 5px 2px 8px;
    border:1.5px solid var(--border);border-radius:999px;font-size:11.5px;background:var(--white);color:var(--text);
  }
  .compare-chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .compare-chip button{
    background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;line-height:1;
    padding:2px 3px;font-family:inherit;
  }
  .compare-chip button:hover{color:var(--danger);}
  .compare-chips select{
    padding:4px 6px;border:1px solid var(--border);border-radius:7px;font-size:11.5px;
    font-family:inherit;background:var(--white);color:var(--text);max-width:200px;
  }
  /* ---- Ficha de dieta: tipo linear x ciclo de carboidrato ---- */
  .dieta-variacao-box{
    border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:10px;background:#FAFAFA;
  }
  .dieta-variacao-nome{
    width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;
    font-size:13.5px;font-weight:600;font-family:inherit;color:var(--text);background:var(--white);
  }
  .dieta-variacao-nome:focus{outline:none;border-color:var(--primary);}
  .dias-semana-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
  .dia-semana-btn{
    padding:6px 11px;border:1px solid var(--border);border-radius:7px;background:var(--white);
    font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;
  }
  .dia-semana-btn:hover{border-color:var(--primary);color:var(--primary);}
  .dia-semana-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .dieta-livres-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:6px;}
  .dieta-livres-row > .mini-label{flex:1 1 180px;min-width:0;margin-bottom:0;}
  .dieta-livres-input{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .dieta-livres-input input{
    width:110px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;
    font-size:13.5px;font-family:inherit;color:var(--text);background:var(--white);text-align:center;
  }
  .dieta-livres-input input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
  .dieta-livres-input span{font-size:12.5px;color:var(--text-muted);font-weight:600;}
  .dieta-livres-obs-wrap{margin-top:8px;}
  textarea.dieta-livres-obs{width:110px;}
  .dieta-ciclo-aviso{font-size:12px;margin-top:8px;line-height:1.5;}
  .dieta-ciclo-aviso.ok{color:var(--success);}
  .dieta-ciclo-aviso.alerta{color:var(--danger);}
  .compare-legend{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 2px;}
  .compare-legend-item{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-muted);}
  .volume-compare-chart{display:flex;align-items:flex-end;gap:22px;overflow-x:auto;padding:8px 4px 0;}
  .volume-compare-group{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
  .volume-compare-bars{display:flex;align-items:flex-end;height:90px;}
  /* As barras de uma mesma ficha ficam juntas (gap menor); o espaco maior entre fichas
     vem do gap da .volume-compare-bars, definido no JS conforme o caso. O gap de 14px
     aqui e o minimo que impede os numeros em cima das barras de se encostarem. */
  .volume-compare-subgroup{display:flex;align-items:flex-end;gap:14px;height:100%;}
  .volume-compare-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:16px;height:100%;}
  .volume-compare-bar-val{font-size:9px;font-weight:700;margin-bottom:1px;color:var(--text);white-space:nowrap;}
  .volume-compare-bar-gkg{font-size:8px;color:var(--text-muted);margin-bottom:1px;white-space:nowrap;}
  .volume-compare-bar{width:100%;border-radius:2px 2px 0 0;min-height:1px;}
  .volume-compare-label{font-size:9.5px;color:var(--text-muted);margin-top:3px;text-align:center;max-width:60px;line-height:1.2;height:23px;overflow:hidden;}
  .compare-expand-btn{
    background:none;border:1px solid var(--border);border-radius:6px;width:24px;height:24px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);
    font-size:13px;line-height:1;flex-shrink:0;padding:0;
  }
  .compare-expand-btn:hover{background:#FAFAFA;color:var(--text);}
  .compare-gkg-toggle-btn{
    background:none;border:1px solid var(--border);border-radius:6px;height:24px;padding:0 8px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);
    font-size:11px;font-weight:700;line-height:1;flex-shrink:0;
  }
  .compare-gkg-toggle-btn:hover{background:#FAFAFA;color:var(--text);}
  .compare-gkg-toggle-btn.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary);}
  .compare-expanded-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;background:var(--white);
    padding:20px 26px 26px;overflow:auto;
  }
  .compare-expanded-overlay .volume-compare-chart{padding-top:14px;}
  .compare-expanded-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .compare-expanded-header h3{margin:0;font-size:16px;}
  .kpi-card.info{border-left-color:var(--info);}
  .kpi-card.pink{border-left-color:var(--baby);}
  .kpi-card.muted{border-left-color:var(--gray-badge);}
  .kpi-label{font-size:12.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .kpi-value{font-size:32px;font-weight:800;color:var(--secondary);margin-top:8px;}
  .section-title{font-size:16px;font-weight:700;color:var(--secondary);margin:0 0 14px;}
  .section-header-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .section-header-row .section-title{margin:0;}
  .info-icon-btn{
    width:18px;height:18px;border-radius:50%;flex-shrink:0;
    background:var(--white);color:var(--gray-badge);border:1.5px solid var(--gray-badge);
    font-size:11px;font-weight:800;font-family:inherit;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:0;line-height:1;
  }
  .info-icon-btn:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary);}
  .info-icon-btn.active{background:var(--primary);color:#fff;}
  .info-popover{
    display:none;background:#FAFAFA;border:1px solid var(--border);border-radius:9px;
    padding:10px 14px;font-size:13px;color:var(--text-muted);line-height:1.5;margin:-6px 0 14px;
  }
  .info-popover.open{display:block;}

  /* ---------- Jornada do Paciente ---------- */
  .jornada-select-row{display:flex;gap:12px;flex-wrap:wrap;}
  .jornada-select-row > div{flex:1;min-width:150px;}
  .jornada-select-row select, .jornada-select-row input{width:100%;}
  /* Barra "Buscar por nome" + botao de ordenar do Kanban. O botao tem o texto em 2 linhas
     ("Ordenar" em cima) pra ocupar menos largura e caber do lado da busca, inclusive no
     celular. O min-width fica aqui (e nao inline) pra a regra de celula poder reduzi-lo —
     estilo inline venceria a media query e a busca empurrava o botao pra cima dela. */
  .jornada-select-row > .jornada-kanban-search-wrap{flex:2 1 0%;min-width:200px;}
  .jornada-select-row > .jornada-kanban-sort-wrap{flex:0 0 auto;min-width:0;}
  /* .search-input tem min-width:240px; sem zerar aqui o campo transborda do proprio
     container em tela estreita e passa por cima do botao de ordenar. */
  .jornada-kanban-search-wrap .search-input{min-width:0;}
  .jornada-kanban-sort-btn{line-height:1.25;text-align:center;white-space:nowrap;}
  .jornada-template-task{
    display:flex;gap:8px;align-items:center;padding:8px 10px;
    border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--white);
  }
  .jornada-template-task input, .jornada-template-task select{
    padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;font-family:inherit;color:var(--text);
  }
  .jornada-template-task input:focus, .jornada-template-task select:focus{outline:none;border-color:var(--primary);}
  .jornada-template-nome{flex:3;min-width:160px;}
  .jornada-template-dia{flex:0 0 72px;}
  .jornada-template-fase{flex:2;min-width:180px;}
  .jornada-fase-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin:18px 0 8px;}
  .jornada-fase-title:first-child{margin-top:0;}
  .jornada-fase-toggle{cursor:pointer;user-select:none;}
  .jornada-fase-toggle:hover{color:var(--primary);}
  .fase-collapse-arrow{display:inline-block;width:10px;color:var(--primary);}
  .jornada-task{
    display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;
    border:1px solid var(--border);margin-bottom:6px;background:var(--white);
  }
  .jornada-task.status-atrasado{border-color:#FCA5A5;background:var(--danger-bg);}
  .jornada-task.status-hoje,.jornada-task.status-semana{border-color:#FDE68A;background:var(--warning-bg);}
  .jornada-task.status-concluido{opacity:.6;}
  .jornada-task input[type=checkbox]{width:17px;height:17px;margin-top:2px;flex-shrink:0;cursor:pointer;}
  .jornada-task-body{flex:1;min-width:0;}
  .jornada-task-name{font-size:13.5px;font-weight:600;color:var(--text);}
  .jornada-task.status-concluido .jornada-task-name{text-decoration:line-through;}
  .jornada-task-date{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .jornada-task-edit-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  input.jornada-task-name{border:none;background:transparent;padding:2px 0;flex:1;min-width:140px;}
  input.jornada-task-name:focus{outline:none;border-bottom:1px solid var(--primary);}
  .jornada-task-date-input{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;font-family:inherit;color:var(--text);}
  .jornada-task-date-input:focus{outline:none;border-color:var(--primary);}
  .jornada-day-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .jornada-day-badge.day-weekday{background:var(--success-bg);color:var(--success);}
  .jornada-day-badge.day-weekend{background:var(--danger-bg);color:var(--danger);}
  .jornada-day-badge.day-none{background:var(--gray-badge-bg);color:var(--text-muted);}
  .jornada-date-field-wrap{position:relative;display:inline-flex;align-items:center;gap:4px;}
  .jornada-date-manual-input{
    padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:11px;
    font-family:inherit;color:var(--text);background:var(--white);width:118px;
  }
  .jornada-date-manual-input::-webkit-calendar-picker-indicator{display:none;-webkit-appearance:none;}
  .jornada-date-manual-input:focus{outline:none;border-color:var(--primary);}
  .jornada-date-cal-btn{
    padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;
    font-family:inherit;background:var(--white);cursor:pointer;line-height:1;
  }
  .jornada-date-cal-btn:hover,.jornada-date-cal-btn.open{border-color:var(--primary);}
  .jornada-cal-popover{
    position:absolute;top:calc(100% + 4px);left:0;z-index:60;
    background:var(--white);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow-lg);padding:7px;width:190px;
  }
  .jornada-cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;font-size:11px;font-weight:700;color:var(--secondary);}
  .jornada-cal-nav{
    width:17px;height:17px;border:1px solid var(--border);border-radius:5px;background:var(--white);
    cursor:pointer;font-size:11px;line-height:1;color:var(--text);font-family:inherit;
  }
  .jornada-cal-nav:hover{border-color:var(--primary);color:var(--primary);}
  .jornada-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
  .jornada-cal-wd{font-size:9px;text-align:center;color:var(--text-muted);font-weight:700;padding:1px 0;}
  .jornada-cal-cell{
    position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:10px;border:none;border-radius:5px;background:none;color:var(--text);
    cursor:pointer;font-family:inherit;
  }
  .jornada-cal-cell.empty{cursor:default;}
  .jornada-cal-cell.weekend{background:var(--warning-bg);color:var(--warning);}
  /* a partir do vencimento do plano: vermelho, e vence o amarelo do fim de semana */
  .jornada-cal-cell.pos-vencimento{background:var(--danger-bg);color:var(--danger);font-weight:700;}
  .jornada-cal-cell.today{outline:1.5px solid var(--primary);outline-offset:-1.5px;}
  .jornada-cal-cell.selected{background:var(--primary);color:var(--white);font-weight:700;}
  .jornada-cal-cell:not(.empty):hover{outline:1.5px solid var(--primary);outline-offset:-1.5px;}
  .jornada-cal-cell.readonly-cal-cell{cursor:default;}
  .jornada-cal-cell.readonly-cal-cell:hover{outline:none;}
  .jornada-cal-dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--success);}
  .jornada-cal-cell.selected .jornada-cal-dot{background:var(--white);}
  /* Calendario de mes da Comunidade — celulas maiores que o jornada-cal-cell (que e feito
     pra um popover pequeno), com espaco pra bolinhas de cor por item do dia. */
  .com-cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--secondary);}
  .com-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .com-cal-wd{font-size:10px;text-align:center;color:var(--text-muted);font-weight:700;padding:2px 0;}
  .com-cal-cell{
    position:relative;aspect-ratio:1;border:1px solid var(--border);border-radius:8px;background:var(--white);
    cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:4px 2px;gap:2px;
  }
  .com-cal-cell.empty{border:none;cursor:default;background:transparent;}
  .com-cal-cell.today{outline:1.5px solid var(--primary);outline-offset:-1.5px;}
  .com-cal-cell.selected{background:var(--primary-light);border-color:var(--primary);}
  .com-cal-cell:not(.empty):hover{border-color:var(--primary);}
  .com-cal-daynum{font-size:12px;font-weight:600;color:var(--text);}
  .com-cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
  .com-cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .jornada-task-obs{
    width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;
    font-size:12.5px;font-family:inherit;color:var(--text);background:var(--white);
  }
  .jornada-kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;max-width:calc(6 * 260px + 5 * 14px);}
  .jornada-kanban-col{
    flex:0 0 260px;background:#FAFAFA;border:1px solid var(--border);border-radius:10px;padding:12px;
  }
  .jornada-kanban-col-header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);
  }
  .jornada-kanban-cards{max-height:494px;overflow-y:auto;padding-right:4px;}
  .jornada-kanban-card,.jornada-task,.jornada-template-task{cursor:grab;}
  .jornada-kanban-card.dragging,.jornada-task.dragging,.jornada-template-task.dragging{opacity:.4;cursor:grabbing;}
  .jornada-kanban-card.drag-over-top,.jornada-task.drag-over-top,.jornada-template-task.drag-over-top{box-shadow:0 -2px 0 0 var(--primary);}
  .jornada-kanban-card.drag-over-bottom,.jornada-task.drag-over-bottom,.jornada-template-task.drag-over-bottom{box-shadow:0 2px 0 0 var(--primary);}
  .jornada-kanban-card{
    padding:8px 9px;border-radius:8px;
    border:1px solid var(--border);margin-bottom:6px;background:var(--white);
  }
  .jornada-kanban-card.status-atrasado{border-color:#FCA5A5;background:var(--danger-bg);}
  .jornada-kanban-card.status-hoje{border-color:#FDE68A;background:var(--warning-bg);}
  .jornada-kanban-card.status-semana{border-color:#86EFAC;background:var(--success-bg);}
  /* Vermelho FORTE = a data cai depois do fim da vigencia. Diferente do vermelho claro
     de "atrasado": borda grossa e escura + fundo mais carregado, pra nao confundir os
     dois de relance. */
  .jornada-kanban-card.status-posvigencia{
    border:2px solid #991B1B;background:#F8A0A0;
    box-shadow:inset 4px 0 0 #7F1D1D;
  }
  .jornada-kanban-card.status-posvigencia .jornada-kanban-card-name{color:#5F1414;font-weight:700;}
  .badge-posvigencia{
    background:#B91C1C;color:#fff;font-size:10.5px;padding:3px 8px;
    margin-top:4px;display:inline-block;white-space:normal;line-height:1.35;
  }
  /* Mesmo desenho do aviso de vigencia, mas em azul — aqui a cor do cartao nao muda,
     o selo sozinho ja avisa que da pra tratar renovacao naquela data. */
  .badge-renovacao{
    background:var(--info);color:#fff;font-size:10.5px;padding:3px 8px;
    margin-top:4px;display:inline-block;white-space:normal;line-height:1.35;
  }
  .jornada-kanban-card.status-concluido{opacity:.65;}
  .jornada-kanban-card.status-concluido .jornada-kanban-card-name{text-decoration:line-through;}
  .jornada-kanban-card-top{display:flex;align-items:flex-start;gap:8px;}
  .jornada-kanban-card input[type=checkbox]{width:16px;height:16px;flex-shrink:0;cursor:pointer;margin-top:1px;}
  .jornada-kanban-card-body{flex:1;min-width:0;cursor:pointer;}
  .jornada-kanban-card-name{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:4px;}
  .jornada-kanban-archive-btn{
    flex-shrink:0;background:none;border:none;cursor:pointer;font-size:13px;
    color:var(--text-muted);padding:2px 4px;border-radius:5px;line-height:1;
  }
  .jornada-kanban-archive-btn:hover{background:var(--primary-light);color:var(--primary);}
  .jornada-kanban-card-expand{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
  .jornada-kanban-card-expand input,.jornada-kanban-card-expand textarea{
    padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;color:var(--text);background:var(--white);width:100%;
  }
  .jornada-kanban-card-expand input:focus,.jornada-kanban-card-expand textarea:focus{outline:none;border-color:var(--primary);}
  .jornada-kanban-card-expand textarea.obscheckin-autosize{resize:vertical;overflow:hidden;}
  .jornada-arquivo-row{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
    border:1px solid var(--border);margin-bottom:6px;background:var(--white);
  }
  .jornada-arquivo-row-body{flex:1;min-width:0;font-size:13px;}
  .jornada-afazer-row{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
    border:1px solid var(--border);margin-bottom:6px;background:var(--white);
  }
  .jornada-afazer-row.status-atrasado{border-color:#FCA5A5;background:var(--danger-bg);}
  .jornada-afazer-row.status-hoje{border-color:#FDE68A;background:var(--warning-bg);}
  .jornada-afazer-row.status-concluido{opacity:.6;}
  .jornada-afazer-row input[type=checkbox]{width:17px;height:17px;flex-shrink:0;cursor:pointer;}
  .jornada-afazer-group{margin-bottom:8px;}
  .jornada-afazer-group-header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:8px;background:#FAFAFA;border:1px solid var(--border);
  }
  .jornada-afazer-group-body{padding:8px 0 0 4px;}
  .jornada-afazer-body{flex:1;min-width:0;font-size:13px;}
  .jornada-chart{display:flex;flex-direction:column;gap:10px;}
  .jornada-chart-row{display:grid;grid-template-columns:100px 1fr 30px;align-items:center;gap:10px;}
  .jornada-chart-label{font-size:12.5px;color:var(--text-muted);font-weight:600;}
  .jornada-chart-track{background:#F0F0F1;border-radius:6px;height:16px;overflow:hidden;}
  .jornada-chart-fill{height:100%;border-radius:6px;}
  .jornada-chart-fill.chart-bar-danger{background:var(--danger);}
  .jornada-chart-fill.chart-bar-warning{background:var(--warning);}
  .jornada-chart-fill.chart-bar-gray{background:var(--gray-badge);}
  .jornada-chart-fill.chart-bar-success{background:var(--success);}
  .jornada-chart-value{font-size:12.5px;font-weight:700;text-align:right;}
  .monthly-trend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;}
  .monthly-trend-panel{min-width:0;}
  .monthly-trend-title{font-size:12.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
  .monthly-trend-chart{display:flex;align-items:flex-end;gap:8px;}
  .monthly-trend-col{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:1px solid transparent;border-radius:8px;padding:4px 2px;cursor:pointer;font-family:inherit;
  }
  .monthly-trend-col:hover{background:var(--primary-light);}
  .monthly-trend-col.selected{border-color:var(--primary);background:var(--primary-light);}
  .monthly-trend-drill{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
  .monthly-trend-drill-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12.5px;font-weight:600;}
  .monthly-trend-drill table{width:100%;font-size:12.5px;}
  .monthly-trend-drill th,.monthly-trend-drill td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);}
  .meta-type-toggle{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
  .meta-type-btn{
    padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--white);
    font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;
  }
  .meta-type-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
  .monthly-trend-value{font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;}
  .monthly-trend-track{width:100%;height:90px;display:flex;align-items:flex-end;background:#F4F5F7;border-radius:5px;overflow:hidden;}
  .monthly-trend-fill{width:100%;border-radius:4px 4px 0 0;background:var(--gray-badge);opacity:.55;}
  .monthly-trend-fill.trend-primary{background:var(--primary);opacity:.55;}
  .monthly-trend-fill.trend-primary.current{opacity:1;}
  .monthly-trend-fill.trend-danger{background:var(--danger);opacity:.5;}
  .monthly-trend-fill.trend-danger.current{opacity:1;}
  .monthly-trend-label{font-size:10.5px;color:var(--text-muted);white-space:nowrap;}
  .card{
    background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;
  }

  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{
    text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--text-muted);font-weight:700;padding:13px 18px;border-bottom:1px solid var(--border);
    background:#FAFAFA;
  }
  tbody td{padding:13px 18px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FCFCFC;}
  .link-btn{
    background:none;border:none;padding:0;color:var(--secondary);font-weight:700;
    font-size:14px;cursor:pointer;font-family:inherit;text-align:left;
  }
  .link-btn:hover{color:var(--primary);text-decoration:underline;}
  .link-btn-with-emoji{display:flex;align-items:flex-start;gap:6px;}
  .link-btn-with-emoji .servico-emoji{flex-shrink:0;}
  .cell-muted{color:var(--text-muted);font-size:13px;}
  .peso-toggle-btn{
    display:block;margin-top:2px;background:none;border:none;padding:0;cursor:pointer;
    font-size:11px;font-weight:600;color:var(--text-muted);font-family:inherit;
  }
  .peso-toggle-btn:hover{color:var(--primary);}
  .peso-history-tr td{background:#FAFAFA;padding:14px 16px !important;}
  .peso-history-table{width:100%;font-size:13px;}
  .peso-history-table th,.peso-history-table td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);}
  .peso-var-up,.peso-var-down{color:var(--text);font-weight:600;}
  .peso-history-pager{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .peso-history-pager button:disabled{opacity:.4;cursor:default;}
  .peso-history-layout{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .peso-history-left{flex:0 1 420px;min-width:300px;}
  .peso-history-right{flex:1 1 380px;min-width:300px;}
  .peso-chart-wrap{width:100%;}
  .peso-chart-svg{width:100%;height:auto;display:block;margin-top:4px;overflow:visible;}
  .peso-chart-empty{font-size:12px;color:var(--text-muted);padding:12px 0;}
  .peso-chart-pt{cursor:pointer;}
  .peso-chart-tip{opacity:0;pointer-events:none;transition:opacity .12s;}
  .peso-chart-pt:hover .peso-chart-tip{opacity:1;}
  @media (max-width:860px){ .peso-history-layout{flex-direction:column;} .peso-history-left,.peso-history-right{width:100%;flex-basis:auto;} }

  .badge{
    display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;
    white-space:nowrap;
  }
  .badge-success{background:var(--success-bg);color:var(--success);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-warning{background:var(--warning-bg);color:var(--warning);}
  .badge-info{background:var(--info-bg);color:var(--info);}
  .badge-gray{background:var(--gray-badge-bg);color:var(--gray-badge);}
  .badge-baby{background:var(--baby-bg);color:var(--baby);}

  .actions{display:flex;gap:6px;flex-wrap:wrap;}
  .wa-btn{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:24px;height:24px;border-radius:50%;background:#25D366;color:#fff;
    font-size:13px;text-decoration:none;line-height:1;
  }
  .wa-btn:hover{opacity:.85;}
  .copy-icon-btn{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:24px;height:24px;border-radius:50%;background:var(--white);border:1px solid var(--border);
    font-size:12px;cursor:pointer;font-family:inherit;line-height:1;padding:0;
  }
  .copy-icon-btn:hover{border-color:var(--primary);}
  .btn-icon{
    background:var(--white);border:1px solid var(--border);color:var(--secondary);
    padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;
    font-family:inherit;
  }
  .btn-icon:hover{border-color:var(--primary);color:var(--primary);}
  .btn-icon.btn-danger-outline{color:var(--danger);}
  .btn-icon.btn-danger-outline:hover{border-color:var(--danger);background:var(--danger-bg);}

  .empty-state{padding:48px 20px;text-align:center;color:var(--text-muted);font-size:14px;}

  /* ---------- Pacientes toolbar ---------- */
  .toolbar{
    display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;
  }
  .toolbar-filters{display:flex;gap:10px;flex-wrap:wrap;flex:1;}
  .search-input{
    min-width:240px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;font-family:inherit;background:var(--white);
  }
  .search-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
  .filter-select{
    padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;
    font-family:inherit;background:var(--white);color:var(--text);
  }
  .filter-select:focus{outline:none;border-color:var(--primary);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(17,17,17,.55);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:100;
  }
  .modal{
    background:var(--white);border-radius:14px;width:100%;max-width:620px;
    box-shadow:var(--shadow-lg);animation:modalIn .15s ease-out;
  }
  .modal.modal-wide{max-width:780px;}
  @keyframes modalIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .modal-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;border-bottom:1px solid var(--border);
  }
  .modal-header h2{margin:0;font-size:17px;color:var(--secondary);}
  .modal-close{
    background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:var(--text-muted);
    padding:4px 8px;border-radius:6px;
  }
  .modal-close:hover{background:#F0F0F0;color:var(--secondary);}
  .modal-body{padding:22px 24px;max-height:70vh;overflow-y:auto;}
  .modal-footer{
    padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;
  }
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  .form-grid .full{grid-column:1 / -1;}
  .field-row5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .field-row5 .mini-label{font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:4px;font-weight:600;}
  .field-row5 input[type=number]{text-align:center;padding:8px 4px;}
  .checkin-form-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1px solid var(--border);border-radius:8px;}
  .checkin-form-item input{width:16px;height:16px;}
  .checkbox-inline{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .checkbox-inline input{width:16px;height:16px;}
  .checkbox-inline label{margin:0;font-size:13.5px;font-weight:500;color:var(--text);}

  /* ---------- Profile ---------- */
  .profile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .profile-name{font-size:19px;font-weight:800;color:var(--secondary);margin:0 0 6px;}
  .profile-badges{display:flex;gap:8px;flex-wrap:wrap;}
  .info-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0;
  }
  .info-item{background:#FAFAFA;border:1px solid var(--border);border-radius:9px;padding:12px 14px;}
  .info-item .lab{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);font-weight:700;margin-bottom:5px;}
  .info-item .val{font-size:14.5px;font-weight:700;color:var(--secondary);}
  .profile-section{margin-top:22px;}
  .profile-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin:0 0 10px;font-weight:700;}
  .meta-box{background:var(--primary-light);border:1px solid #FDBA74;color:#9A3412;padding:12px 14px;border-radius:9px;font-size:14px;font-weight:600;}
  .obs-box{background:#FAFAFA;border:1px solid var(--border);padding:12px 14px;border-radius:9px;font-size:14px;color:var(--text);line-height:1.5;white-space:pre-wrap;}
  .obscheckin-item{margin-bottom:6px;}
  .obscheckin-item:last-child{margin-bottom:0;}
  .obscheckin-autosize{
    width:100%;min-height:34px;resize:vertical;overflow:hidden;font-family:inherit;
    font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;
  }
  .engagement-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .eng-item{border-radius:9px;padding:14px 6px;text-align:center;}
  .eng-item .wk{font-size:10.5px;font-weight:700;text-transform:uppercase;opacity:.85;}
  .eng-item .num{font-size:20px;font-weight:800;margin-top:4px;}
  .eng-green{background:var(--success-bg);color:var(--success);}
  .eng-yellow{background:var(--warning-bg);color:var(--warning);}
  .eng-red{background:var(--danger-bg);color:var(--danger);}
  .eng-empty{background:#FAFAFA;color:#C4C4C8;border:1px dashed var(--border);}
  /* semana que nao se aplica ao paciente (ex: so Treino, que e quinzenal) */
  .eng-inativa,.checkin-inativa{background:#F4F5F7;color:#C4C4C8;opacity:.55;}
  .eng-inativa .num,.checkin-inativa .mark{color:#C4C4C8;}
  .checkin-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .checkin-item{border-radius:9px;padding:12px 6px;text-align:center;border:1px solid var(--border);}
  .checkin-item .wk{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--text-muted);}
  .checkin-item .mark{font-size:18px;font-weight:800;margin-top:4px;}
  .checkin-yes .mark{color:var(--success);}
  .checkin-no .mark{color:var(--danger);}
  .checkin-empty{border-style:dashed;}
  .checkin-empty .mark{color:#C4C4C8;}

  /* ---------- Weekly overview grid (Pacientes tab) ---------- */
  .week-cell-btn{background:none;border:none;padding:0;margin:0;width:100%;cursor:pointer;font-family:inherit;}
  .week-cell-btn:hover .week-cell{outline:2px solid var(--border-strong);}
  .week-cell{border-radius:8px;padding:6px 2px;text-align:center;min-width:44px;}
  .week-cell-inativa{background:#F4F5F7;color:#C4C4C8;opacity:.55;font-weight:700;}
  .week-cell .num{font-size:13.5px;font-weight:800;}
  .week-cell .mark{font-size:11px;font-weight:700;margin-top:2px;}
  .table-scroll{overflow-x:auto;}
  .obs-cell{
    background:#FAFAFA;border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-size:12.5px;color:var(--text);line-height:1.4;
    min-width:220px;max-width:320px;white-space:normal;
  }
  .material-status{display:flex;align-items:center;gap:10px;}

  .confirm-text{font-size:14.5px;color:var(--text);line-height:1.5;}
  .confirm-text b{color:var(--secondary);}

  /* ---------- Sortable table headers ---------- */
  .th-sort{cursor:pointer;user-select:none;white-space:nowrap;}
  .th-sort:hover{color:var(--secondary);}
  .sort-arrow{margin-left:4px;color:var(--primary);}
  .th-sort-overview{cursor:pointer;user-select:none;white-space:nowrap;}
  .th-sort-overview:hover{color:var(--secondary);}

  .th-filter{position:relative;white-space:nowrap;}
  .th-filter-label{cursor:pointer;user-select:none;}
  .th-filter-label:hover{color:var(--secondary);}
  .filter-chip{
    display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--border);
    border-radius:7px;background:var(--white);font-size:12px;font-weight:600;color:var(--text);
  }
  .filter-chip.active{border-color:var(--primary);color:var(--primary);}
  .th-filter.active .th-filter-label{color:var(--primary);}
  .filter-arrow{margin-left:4px;font-size:9px;}
  .filter-menu{
    display:none;position:absolute;top:100%;left:0;margin-top:6px;
    background:var(--white);border:1px solid var(--border);border-radius:8px;
    box-shadow:var(--shadow-lg);z-index:20;min-width:180px;
    padding:6px;text-transform:none;letter-spacing:normal;font-weight:500;
  }
  .filter-menu.open{display:block;}
  .filter-menu-option{
    display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;
    border:none;background:none;cursor:pointer;font-size:13px;color:var(--text);font-family:inherit;
  }
  .filter-menu-option:hover{background:var(--primary-light);color:var(--primary);}
  .filter-menu-option.selected{background:var(--primary);color:#fff;font-weight:700;}
  .filter-menu-input{
    width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;
    font-size:13px;font-family:inherit;color:var(--text);
  }
  .filter-menu-input:focus{outline:none;border-color:var(--primary);}
  .card.menu-open{overflow:visible;}

  /* ---------- Toolbar IO (backup) ---------- */
  .toolbar-io{display:flex;gap:8px;}
  .btn-outline{background:var(--white);color:var(--secondary);border:1px solid var(--border);}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary);}

  /* ---------- Toast ---------- */
  .toast-root{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
  .toast{
    background:var(--secondary);color:#fff;padding:12px 18px;border-radius:8px;
    font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);max-width:320px;
    animation:toastIn .2s ease-out, toastOut .2s ease-in 2.3s forwards;
  }
  .toast.toast-success{background:var(--success);}
  .toast.toast-danger{background:var(--danger);}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateY(8px);}}

  @media (max-width: 1400px){
    .kpi-grid{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width: 980px){
    .kpi-grid{grid-template-columns:1fr;}
    .kpi-grid-sm{grid-template-columns:1fr;}
    .quick-access-grid{grid-template-columns:1fr;}
    .info-grid{grid-template-columns:1fr 1fr;}
    .form-grid{grid-template-columns:1fr;}
    header.topbar{padding:0 14px;flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;gap:10px;}
    .container{padding:18px 14px 40px;}
    table{font-size:13px;}
    .engagement-grid,.checkin-grid,.field-row5{grid-template-columns:repeat(5,minmax(50px,1fr));}
  }
  @media (max-width: 600px){
    .info-grid{grid-template-columns:1fr;}

    /* ---- cabecalho compacto ---- */
    header.topbar{padding:8px 12px;gap:8px;}
    .logo-box{width:30px;height:30px;}
    .brand-text strong{font-size:14px;}
    .brand-text span{font-size:10px;}
    .header-user{display:none;}
    .header-right{gap:8px;margin-left:auto;}
    .logout-btn{padding:7px 10px;font-size:12px;}
    .nav-tabs{order:3;width:100%;gap:4px;}
    .nav-tab{flex:1;padding:9px 4px;font-size:13px;text-align:center;}

    /* ---- barra lateral vira gaveta ----
       Uma coluna fixa comeria metade da tela num celular, entao aqui ela sai do fluxo
       e desliza por cima do conteudo, com um cabecalho proprio pra abrir/fechar. */
    .app-shell{display:block;}
    .mobile-topbar{
      display:flex;align-items:center;gap:10px;background:var(--secondary);color:#fff;
      padding:8px 12px;position:sticky;top:0;z-index:30;min-height:54px;
    }
    .mobile-topbar .brand-text strong{font-size:14px;}
    .mobile-topbar .brand-text span{font-size:10px;}
    .menu-btn{
      background:transparent;border:1px solid #3A3A3A;color:#fff;border-radius:8px;
      width:38px;height:38px;font-size:17px;line-height:1;cursor:pointer;font-family:inherit;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .sidebar{
      position:fixed;top:0;left:0;height:100vh;width:264px;flex-basis:264px;
      transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-lg);
    }
    /* no celular a gaveta e sempre "aberta" por dentro — quem controla e o translate */
    .sidebar.collapsed{width:264px;flex-basis:264px;}
    .sidebar.collapsed .side-label,.sidebar.collapsed .side-caret{display:inline;}
    .sidebar.collapsed .side-sub{display:block;}
    .sidebar.collapsed .side-item{justify-content:flex-start;gap:11px;padding:10px 11px;}
    .sidebar.collapsed .sidebar-brand{justify-content:flex-start;}
    .sidebar.collapsed .sidebar-brand .brand-text{display:block;}
    .sidebar.drawer-open{transform:translateX(0);}
    .side-toggle-btn{display:none;}
    .sidebar-backdrop.show{
      display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;
    }
    /* alvo de toque maior no celular */
    .side-item{padding:12px 12px;font-size:15px;}
    .side-sub .side-item{font-size:14px;padding-left:36px;}

    /* ---- cartoes de numeros (KPI) em 2 colunas ---- */
    .kpi-grid,.kpi-grid-sm{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
    .kpi-card{padding:12px 12px 14px;border-left-width:3px;}
    .kpi-label{font-size:10px;letter-spacing:.2px;line-height:1.3;}
    .kpi-value{font-size:26px;margin-top:5px;}

    /* ---- tabelas viram cartoes empilhados ---- */
    table:not(.peso-history-table) thead{display:none;}
    table:not(.peso-history-table),
    table:not(.peso-history-table) tbody{display:block;width:100%;}
    table:not(.peso-history-table) tr{
      display:block;background:var(--white);border:1px solid var(--border);
      border-radius:10px;padding:10px 12px;margin-bottom:8px;
    }
    table:not(.peso-history-table) td{
      display:inline-block;border-bottom:none;padding:3px 8px 3px 0;vertical-align:middle;
    }
    table:not(.peso-history-table) td:first-child:not(:last-child){
      display:block;font-weight:700;font-size:14.5px;padding:0 0 7px;
    }
    table:not(.peso-history-table) td:first-child:not(:last-child) .link-btn{
      font-weight:700;font-size:14.5px;text-align:left;
    }
    table:not(.peso-history-table) td[data-label]:not(:first-child)::before{
      content:attr(data-label) ': ';
      color:var(--text-muted);font-weight:600;font-size:11.5px;
    }
    /* Semanas lado a lado, com o rotulo em cima. 19% porque o mes pode ter 5 sextas
       (5 semanas): com 23% dava 115% e as celulas se embaralhavam em duas linhas. */
    table:not(.peso-history-table) td[data-label^="Sem "]{
      width:19%;padding-right:2px;vertical-align:top;
    }
    table:not(.peso-history-table) td[data-label^="Sem "]::before{display:block;}
    /* estes dois ocupam a linha inteira pra que as semanas sempre comecem numa linha nova */
    table:not(.peso-history-table) td[data-label="Meta da Próxima Consulta"],
    table:not(.peso-history-table) td[data-label="Observações"]{display:block;width:100%;}

    /* A tabela de peso fica DENTRO da tabela da Visao Geral, entao as regras de cartao
       acima (que usam seletor de descendente) alcancam ela por heranca. O !important
       aqui e o que devolve o formato de tabela; sem ele o seletor de fora vence. */
    .peso-history-table{display:table !important;width:100%;}
    .peso-history-table thead{display:table-header-group !important;}
    .peso-history-table tbody{display:table-row-group !important;}
    .peso-history-table tr{
      display:table-row !important;background:none !important;border:none !important;
      border-radius:0 !important;padding:0 !important;margin:0 !important;
    }
    .peso-history-table td,.peso-history-table th{
      display:table-cell !important;padding:6px 6px !important;font-size:13px !important;
      font-weight:400 !important;border-bottom:1px solid var(--border) !important;width:auto !important;
    }
    .peso-history-table td::before{content:none !important;}

    /* Editor de Modelos de Jornada: os campos somavam 412px de largura minima
       numa tela de 375px, entao ficavam cortados. Agora empilham. */
    .jornada-template-task{flex-wrap:wrap;gap:6px;}
    .jornada-template-nome{flex:1 1 100%;min-width:0;}
    .jornada-template-fase{flex:1 1 60%;min-width:0;}
    .jornada-template-dia{flex:1 1 30%;}
    .jornada-template-task input,.jornada-template-task select{width:100%;}

    /* ---- alvos de toque maiores ---- */
    .btn-icon{padding:8px 12px;font-size:13px;}
    .btn{padding:11px 16px;}
    .section-header-row{flex-wrap:wrap;}

    /* ---- formularios: abaixo de 16px o iPhone da zoom sozinho ao tocar no campo.
       O !important e proposital: precisa vencer todas as regras especificas de cada
       campo, e como esta dentro do @media, nao afeta o computador. ---- */
    input,select,textarea{font-size:16px !important;}

    /* ---- janelas (modais) ocupando a tela ---- */
    .modal-overlay{padding:10px;align-items:flex-start;}
    .modal,.modal.modal-wide{max-width:100%;}
    .modal-header{padding:14px 16px;}
    .modal-header h2{font-size:15.5px;}
    .modal-body{padding:16px;max-height:80vh;}
    .modal-footer{padding:12px 16px;}

    /* ---- Kanban: uma coluna por vez, deslizando ---- */
    .jornada-kanban{max-width:100%;gap:10px;}
    .jornada-kanban-col{flex:0 0 84vw;}

    /* Barra do Kanban no celular: a busca pode encolher abaixo dos 200px pra o botao de
       ordenar caber do lado dela com folga, em vez de os dois se espremerem/sobreporem. */
    .jornada-select-row > .jornada-kanban-search-wrap{min-width:120px;}

    /* Editor de modelos de Lead: o campo de dias, o canal e o botao de excluir cabem
       juntos numa linha. Sem isso o "×" sobrava sozinho numa terceira linha, com cara
       de quebrado. O nome fica na linha de cima, sozinho. */
    /* o width:100% da regra generica acima jogaria cada campo pra uma linha; aqui
       eles voltam a dividir a mesma linha */
    .lead-modelo-acao .jornada-template-dia{flex:0 0 68px;width:68px;}
    .lead-modelo-acao .jornada-template-fase{flex:1 1 0;min-width:0;width:auto;}
    .lead-modelo-acao .btn-icon{flex:0 0 auto;padding:8px 11px;}

    /* Kanban de Leads no celular: uma coluna por vez, deslizando de lado — mesmo
       padrao do Kanban da Jornada, que ja funciona bem. */
    .lead-kanban{gap:10px;}
    .lead-col{flex:0 0 84vw;}

<script>
(function(){
  "use strict";

  var mfa = null; // populado quando o SDK modular (window.__mfa) terminar de carregar — inclui auth e Firestore, no mesmo app
  var pendingTotpSecret = null;
  var pendingMfaResolver = null;
  function whenMfaReady(cb){
    if(window.__mfa){ cb(window.__mfa); return; }
    window.addEventListener('mfa-ready', function(){ cb(window.__mfa); }, { once:true });
  }

  var GRUPO_MUSCULAR_KEY = 'crm-ag-grupos-musculares';
  var DEFAULT_GRUPOS_MUSCULARES = ['Panturrilha','Peito','Quadríceps','Deltoide anterior','Deltoide posterior','Latíssimo','Posterior de coxa','Glúteo máximo','Glúteo médio','Tríceps','Adutor','Abdômen','Deltoide lateral','Bíceps','Upper back','Eretores'];
  var CHART_PALETTE = ['#0072B2','#E69F00','#009E73','#CC79A7','#56B4E9','#D55E00'];
  function chartColorFor(idx){ return CHART_PALETTE[idx % CHART_PALETTE.length]; }
  var MACRO_CATEGORIES = [
    { key:'calorias', label:'Calorias (kcal)' },
    { key:'proteinas', label:'Proteínas (g)' },
    { key:'carboidratos', label:'Carboidratos (g)' },
    { key:'gorduras', label:'Gorduras (g)' }
  ];
  var MACRO_KEYS_ALL = ['calorias','proteinas','carboidratos','gorduras','fibras'];
  var DIAS_SEMANA = [
    { key:'seg', label:'Seg' }, { key:'ter', label:'Ter' }, { key:'qua', label:'Qua' },
    { key:'qui', label:'Qui' }, { key:'sex', label:'Sex' }, { key:'sab', label:'Sáb' },
    { key:'dom', label:'Dom' }
  ];
  /* ---- Ficha de dieta: linear (1 dieta pra semana toda) x ciclo de carboidrato
     (2 dietas alternando por dia da semana, ex: carbo alto seg/qua/sex e carbo baixo
     no resto). Ficha sem "tipo" e linear — e o formato antigo, continua valendo. ---- */
  function isDietaCiclo(f){
    return !!f && f.tipo === 'ciclo' && Array.isArray(f.variacoes) && f.variacoes.length === 2;
  }
  function novaVariacaoDieta(nome){
    return { nome: nome, dias: [], calorias:'', proteinas:'', carboidratos:'', gorduras:'', fibras:'' };
  }
  /* Ao virar ciclo, a variacao 1 herda os macros que ja estavam na ficha linear. */
  function ensureDietaVariacoes(f){
    if(Array.isArray(f.variacoes) && f.variacoes.length === 2) return f.variacoes;
    var v1 = novaVariacaoDieta('Carbo alto');
    MACRO_KEYS_ALL.forEach(function(k){ if(f[k] !== undefined && f[k] !== null) v1[k] = f[k]; });
    f.variacoes = [v1, novaVariacaoDieta('Carbo baixo')];
    return f.variacoes;
  }
  function diasDaVariacao(v){
    return Array.isArray(v && v.dias) ? v.dias : [];
  }
  /* Cada ficha vira 1 serie no grafico (linear) ou 2 series (ciclo, uma por variacao).
     O rotulo do ciclo carrega o nome e a quantidade de dias: "20/08 · Carbo alto (3d)". */
  function dietaSeriesDaFicha(f){
    if(isDietaCiclo(f)){
      return f.variacoes.map(function(v, i){
        var nDias = diasDaVariacao(v).length;
        return {
          ficha: f, variacao: v, variacaoIndex: i,
          label: formatDate(f.dataPassado) + ' · ' + (v.nome || ('Variação '+(i+1))) + (nDias ? ' ('+nDias+'d)' : ''),
          get: function(key){ return parseFloat(v[key]) || 0; }
        };
      });
    }
    return [{
      ficha: f, variacao: null, variacaoIndex: 0,
      label: formatDate(f.dataPassado),
      get: function(key){ return parseFloat(f[key]) || 0; }
    }];
  }
  /* Total de kcal da semana: linear e o valor do dia x7; ciclo soma cada variacao
     multiplicada pelos dias dela. Retorna null se nao der pra calcular. */
  function dietaKcalSemana(f){
    if(isDietaCiclo(f)){
      var total = 0, temDias = false;
      f.variacoes.forEach(function(v){
        var n = diasDaVariacao(v).length;
        if(n) temDias = true;
        total += (parseFloat(v.calorias) || 0) * n;
      });
      return temDias ? total : null;
    }
    var kcal = parseFloat(f.calorias) || 0;
    return kcal ? kcal * 7 : null;
  }
  /* ---- Extra semanal: "calorias livres" (a pessoa segue a dieta E come essas
     calorias a mais na semana) ou "refeicao livre" (troca uma refeicao do plano por
     outra coisa). Os dois somam no total da semana. E sempre um ou outro, nunca os
     dois. Ficha sem nada disso e o formato antigo. ---- */
  var LIVRES_TIPOS = [
    { key:'calorias', label:'Calorias livres', campoLabel:'Calorias livres semanais', soma:true },
    { key:'refeicao', label:'Refeição livre', campoLabel:'Calorias da refeição livre', soma:true }
  ];
  function livresTipoDe(f){
    return (f && f.livresTipo === 'refeicao') ? 'refeicao' : 'calorias';
  }
  function livresKcalDe(f){
    var v = parseFloat(f && f.livresKcal);
    return isNaN(v) || v <= 0 ? 0 : v;
  }
  function livresSoma(f){
    return livresKcalDe(f);
  }
  /* Total da semana ja com o extra somado (quando for calorias livres). */
  function dietaKcalSemanaTotal(f){
    var base = dietaKcalSemana(f);
    if(base === null) return null;
    return base + livresSoma(f);
  }
  function fichaDietaTemMacro(f){
    if(isDietaCiclo(f)){
      return f.variacoes.some(function(v){
        return MACRO_CATEGORIES.some(function(cat){ return (parseFloat(v[cat.key])||0) > 0; });
      });
    }
    return MACRO_CATEGORIES.some(function(cat){ return (parseFloat(f[cat.key])||0) > 0; });
  }
  function latestPesoAtual(p){
    if(!p) return null;
    var hist = pesoHistoryList(p);
    return hist.length ? hist[0].value : null;
  }
  function macroGkgHtml(f, pesoAtual){
    if(!pesoAtual) return '<div class="mini-label" style="text-align:left;margin-top:8px;">Cadastre um peso do paciente pra ver g/kg.</div>';
    var rows = [
      { label: 'Proteínas', val: parseFloat(f.proteinas) || 0 },
      { label: 'Carboidratos', val: parseFloat(f.carboidratos) || 0 },
      { label: 'Gorduras', val: parseFloat(f.gorduras) || 0 }
    ].map(function(r){
      return '<div><div class="mini-label">'+r.label+'</div><div style="font-weight:700;">'+(r.val/pesoAtual).toFixed(1)+' g/kg</div></div>';
    }).join('');
    return '<div class="mini-label" style="text-align:left;margin-top:8px;">Por kg de peso corporal (peso atual: '+pesoAtual+' kg)</div>'+
      '<div class="volume-grupo-grid">'+rows+'</div>';
  }
  var MACRO_DIST_COLORS = { proteinas: '#DC2626', gorduras: '#CA8A04', carboidratos: '#2563EB' };
  function macroDistributionHtml(f){
    var prot = parseFloat(f.proteinas) || 0;
    var carbo = parseFloat(f.carboidratos) || 0;
    var gord = parseFloat(f.gorduras) || 0;
    var kcalProt = prot*4, kcalCarbo = carbo*4, kcalGord = gord*9;
    var total = kcalProt + kcalCarbo + kcalGord;
    if(total <= 0){
      return '<div class="mini-label" style="text-align:left;">Distribuição de macronutrientes</div>'+
        '<div class="mini-label" style="text-align:left;margin-top:4px;">Preencha proteínas, carboidratos e gorduras pra ver a distribuição.</div>';
    }
    var order = [
      { key:'proteinas', label:'Proteínas', kcal:kcalProt },
      { key:'gorduras', label:'Gorduras', kcal:kcalGord },
      { key:'carboidratos', label:'Carboidratos', kcal:kcalCarbo }
    ];
    var circumference = 2*Math.PI*40;
    var offset = 0;
    var arcs = order.map(function(o){
      var pct = o.kcal/total*100;
      var len = (pct/100)*circumference;
      var gap = pct > 0 ? 2 : 0;
      var dash = Math.max(len-gap, 0);
      var circle = '<circle cx="50" cy="50" r="40" fill="none" stroke="'+MACRO_DIST_COLORS[o.key]+'" stroke-width="16" stroke-dasharray="'+dash+' '+(circumference-dash)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 50 50)"></circle>';
      offset += len;
      return circle;
    }).join('');
    var legend = order.map(function(o){
      var pct = o.kcal/total*100;
      return '<div style="text-align:center;min-width:70px;">'+
        '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+MACRO_DIST_COLORS[o.key]+';margin-right:4px;"></span>'+
        '<span style="font-size:12px;color:var(--text-muted);">'+o.label+'</span>'+
        '<div style="font-weight:700;font-size:14px;">'+pct.toFixed(1)+'%</div>'+
      '</div>';
    }).join('');
    var kcalCenter = f.calorias !== undefined && f.calorias !== null && f.calorias !== '' ? f.calorias : Math.round(total);
    return '<div class="mini-label" style="text-align:left;">Distribuição de macronutrientes</div>'+
      '<div style="display:flex;flex-direction:column;align-items:center;padding:8px 0;">'+
        '<div style="position:relative;width:130px;height:130px;">'+
          '<svg viewBox="0 0 100 100" width="130" height="130">'+arcs+'</svg>'+
          '<div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;">'+
            '<div style="font-size:17px;font-weight:700;color:var(--text);">'+esc(String(kcalCenter))+'</div>'+
            '<div style="font-size:10.5px;color:var(--text-muted);">kcal</div>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px;">'+legend+'</div>'+
      '</div>';
  }

     sexta, e um registro sobrescrevia o outro em silencio.

    if(!Array.isArray(m.pesoData)) m.pesoData = [];
    while(m.peso.length < wk) m.peso.push(null);
    while(m.pesoData.length < wk) m.pesoData.push(null);

  function pesoGoalPace(p){
    var data = p.meses && p.meses[state.competencia];
    if(!data || data.metaTipo !== 'peso') return null;
    var min = parseFloat(data.metaPesoMin), max = parseFloat(data.metaPesoMax);
    var hasMin = !isNaN(min), hasMax = !isNaN(max);
    if((!hasMin && !hasMax) || !data.metaPesoInicio || !p.consulta) return null;
    var history = pesoHistoryList(p);
    if(!history.length) return null;
    var latest = history[0];
    // peso de partida = o mais recente registrado ATE a data da meta (olhando pra tras no historico)
    var baseline = null;
    for(var i=0;i<history.length;i++){
      if(history[i].date <= data.metaPesoInicio){ baseline = history[i]; break; }
    }
    if(!baseline){
      // nenhum peso registrado ate a data da meta - usa o primeiro peso que existir (o mais proximo dela)
      baseline = history[history.length-1];
    }
    var totalDays = daysBetween(data.metaPesoInicio, p.consulta);
    if(totalDays === null || totalDays <= 0) return null;
    var elapsedDays = daysBetween(data.metaPesoInicio, todayISODate());
    var clampedElapsed = Math.min(Math.max(elapsedDays, 0), totalDays);

    var reachedMin = hasMin && (actualDelta - min) * dir >= -EPS;

    } else {
      status = (reachedMax || reachedMin) ? 'batida' : 'atrasado';
    }
    return {
      status: status,
      min: hasMin ? min : null,
      max: hasMax ? max : null,
      targetDelta: targetDelta,
      actualDelta: actualDelta,
      expectedDelta: expectedDelta

  function getMonthData(p, key){
    var wk = weeksInMonth(key);
    var stored = (p && p.meses && p.meses[key]) ? p.meses[key] : null;
    var eng = (stored && Array.isArray(stored.engajamento)) ? stored.engajamento.slice(0, wk) : [];
    while(eng.length < wk) eng.push(null);
    var chk = (stored && Array.isArray(stored.checkin)) ? stored.checkin.slice(0, wk) : [];
    while(chk.length < wk) chk.push(null);
    var peso = (stored && Array.isArray(stored.peso)) ? stored.peso.slice(0, wk) : [];
    while(peso.length < wk) peso.push(null);
    var obsCheckin = (stored && Array.isArray(stored.obsCheckin)) ? stored.obsCheckin.slice(0, wk) : [];
    while(obsCheckin.length < wk) obsCheckin.push('');
    return {
      metaMes: stored ? (stored.metaMes || '') : '',
      metaTipo: stored ? (stored.metaTipo || 'outro') : 'outro',
      metaPesoMin: stored && stored.metaPesoMin !== undefined ? stored.metaPesoMin : '',
      metaPesoMax: stored && stored.metaPesoMax !== undefined ? stored.metaPesoMax : '',
      metaPesoInicio: stored ? (stored.metaPesoInicio || '') : '',
      observacoes: stored ? (stored.observacoes || '') : '',
      engajamento: eng,
      checkin: chk,
      peso: peso,
      obsCheckin: obsCheckin
    };
  }
  /* Grava o que veio do formulario de Cadastro/Edicao no mes do paciente SEM apagar o
     que o formulario nao conhece. Antes isso era uma atribuicao direta
     (p.meses[key] = weekly) e cada "Salvar" no Editar Paciente destruia o pesoData —
     as datas reais dos pesos. Sem pesoData, todo peso voltava a aparecer na sexta da
     semana (nthFridayDate) e o slot ficava "livre" de novo, entao o proximo peso
     registrado sobrescrevia um peso antigo em silencio.
     Regras: o formulario manda so os indices 0..wk-1; o que estiver alem disso (peso
     que nao coube nas caixas do mes) fica intacto. Apagar o peso apaga a data junto. */
  function mergeWeeklyIntoMonth(p, monthKey, weekly){
    if(!p.meses) p.meses = {};
    var anterior = p.meses[monthKey] || {};
    var wk = weeksInMonth(monthKey);
    var pesoAntigo = Array.isArray(anterior.peso) ? anterior.peso : [];
    var dataAntiga = Array.isArray(anterior.pesoData) ? anterior.pesoData : [];
    var peso = weekly.peso.slice();
    var pesoData = [];
    for(var i=0;i<wk;i++){
      // peso preenchido mantem a data com que foi registrado; peso apagado zera a data.
      // Peso digitado direto no formulario nao tem data propria e continua caindo na
      // sexta daquela semana, que e o comportamento de sempre.
      pesoData.push((peso[i] === null || peso[i] === undefined) ? null : (dataAntiga[i] || null));
    }
    for(var j=wk; j<Math.max(pesoAntigo.length, dataAntiga.length); j++){
      peso.push(pesoAntigo[j] !== undefined ? pesoAntigo[j] : null);
      pesoData.push(dataAntiga[j] !== undefined ? dataAntiga[j] : null);
    }
    // preserva qualquer outro campo ja gravado no mes que o formulario nao edita
    var merged = Object.assign({}, anterior, weekly);
    merged.peso = peso;
    merged.pesoData = pesoData;
    p.meses[monthKey] = merged;
  }

  function migratePatient(p){
    if(!p.createdDate) p.createdDate = todayISODate();
    if(!Array.isArray(p.fichasTreino)) p.fichasTreino = [];
    if(p.prioridade === 'Resolver esta semana') p.prioridade = 'Moderada';
    if(p.jornada && Array.isArray(p.jornada.tarefas)){
      p.jornada.tarefas.forEach(function(t, idx){
        if(t.ordem === undefined || t.ordem === null) t.ordem = idx;
      });
    }
    if(p.meses) return p;
    var key = getCurrentMonthKey();
    var wk = weeksInMonth(key);
    var eng = Array.isArray(p.engajamento) ? p.engajamento.slice(0, wk) : [];
    while(eng.length < wk) eng.push(null);
    var chk = Array.isArray(p.checkin) ? p.checkin.slice(0, wk) : [];
    while(chk.length < wk) chk.push(null);
    p.meses = {};
    p.meses[key] = {
      metaMes: p.metaMes || '',
      observacoes: p.observacoes || '',
      engajamento: eng,
      checkin: chk
    };
    delete p.metaMes; delete p.observacoes; delete p.engajamento; delete p.checkin;
    return p;
  }

  function seedJornadaTemplates(source){
    var clone = JSON.parse(JSON.stringify(source));
    var wrapped = {};
    Object.keys(clone).forEach(function(tipo){
      wrapped[tipo] = {};
      Object.keys(clone[tipo]).forEach(function(foco){
        clone[tipo][foco].forEach(function(t, idx){ t._tid = jornadaTemplateIdSeq++; if(t.ordem === undefined) t.ordem = idx; });
        wrapped[tipo][foco] = [{ id: 'default', isDefault: true, tarefas: clone[tipo][foco] }];
      });
    });
    return wrapped;
  }
  function parseJornadaTemplatesRaw(parsed){
    var ok = parsed && parsed.trimestral && parsed.trimestral.treino_dieta &&
      Array.isArray(parsed.trimestral.treino_dieta) && parsed.trimestral.treino_dieta[0] &&
      Array.isArray(parsed.trimestral.treino_dieta[0].tarefas);
    if(!ok) return null;
    var maxTid = 0, maxVariant = 0;
    Object.keys(parsed).forEach(function(tipo){
      Object.keys(parsed[tipo]).forEach(function(foco){
        parsed[tipo][foco].forEach(function(v){
          var m = /^copy_(\d+)$/.exec(v.id);
          if(m && parseInt(m[1],10) > maxVariant) maxVariant = parseInt(m[1],10);
          v.tarefas.forEach(function(t, idx){
            if(t._tid > maxTid) maxTid = t._tid;
            if(t.ordem === undefined || t.ordem === null) t.ordem = idx;

    });

  /* Dois avisos antes do vencimento: "Renovação próxima" (31-40 dias, amarelo — fica de

  var DIAS_RENOVACAO_ANTECIPADA = 30;

  function renovacaoStatus(p){

    if(diff <= DIAS_RENOVACAO_ANTECIPADA) return 'Renovação antecipada';
    if(diff <= DIAS_RENOVACAO_PROXIMA) return 'Renovação próxima';
