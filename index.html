    var user = mfa && mfa.auth ? mfa.auth.currentUser : null;
    var email = user ? user.email : null;
    var errHtml = state.securityError ? '<div class="login-error show">'+esc(state.securityError)+'</div>' : '';
    if(email !== SENHA_EMAIL_PERMITIDO){
      return '<p>Por segurança, a troca de senha só é permitida para <b>'+esc(SENHA_EMAIL_PERMITIDO)+'</b>. Esta conta ('+esc(email||'—')+') não tem essa permissão.</p>';
    }
    if(state.passwordResetSent){
      return ''+
        '<p>Link enviado! Abra a caixa de entrada de <b>'+esc(email)+'</b> e siga o link do e-mail pra criar uma nova senha.</p>'+
        '<button type="button" class="btn btn-secondary" id="passwordResetBtn">Enviar de novo</button>'+
        errHtml;
    }
    return ''+
      '<p>Por segurança, a troca de senha é feita por um link enviado direto pro seu e-mail — nenhuma senha é digitada aqui no CRM.</p>'+
      '<p class="cell-muted">O link vai para <b>'+esc(email)+'</b>.</p>'+
      '<button type="button" class="btn btn-primary" id="passwordResetBtn">Enviar link de troca de senha</button>'+
      errHtml;
  }
  function settingsModalHtml(){
    var tabsHtml = ''+
      '<div class="meta-type-toggle">'+
        '<button type="button" class="meta-type-btn'+(state.settingsTab==='seguranca'?' active':'')+'" data-settings-tab="seguranca">🔒 Segurança</button>'+
        '<button type="button" class="meta-type-btn'+(state.settingsTab==='senha'?' active':'')+'" data-settings-tab="senha">🔑 Senha</button>'+
      '</div>';
    var body = state.settingsTab === 'senha' ? passwordTabBodyHtml() : securityTabBodyHtml();
    return ''+
    '<div class="modal">'+
      '<div class="modal-header">'+
        '<h2>Configurações</h2>'+
        '<button class="modal-close" id="modalCloseBtn">&times;</button>'+
      '</div>'+
      '<div class="modal-body">'+tabsHtml+body+'</div>'+
    '</div>';
  }

  /* ---- generic modal render/bind ---- */
  function renderModal(){
    var root = document.getElementById('modal-root');
    if(!state.modal){ root.innerHTML=''; return; }

    var html = '';
    if(state.modal === 'profile'){
      var p = getPatient(state.activeId);
      if(!p){ closeModal(); return; }
      html = profileModalHtml(p, state.competencia);
    } else if(state.modal === 'add'){
      state.formDraftFichas = [];
      state.formDraftFichaOpen = {};
      state.formDraftFichasDieta = [];
      state.formDraftFichaDietaOpen = {};
      html = formModalHtml('add', emptyPatientCore(), state.competencia);
    } else if(state.modal === 'edit'){
      var pe = getPatient(state.activeId);
      if(!pe){ closeModal(); return; }
      state.formDraftFichas = JSON.parse(JSON.stringify(pe.fichasTreino || []));
      state.formDraftFichaOpen = {};
      state.formDraftFichasDieta = JSON.parse(JSON.stringify(pe.fichasDieta || []));
      state.formDraftFichaDietaOpen = {};
      html = formModalHtml('edit', pe, state.competencia);
    } else if(state.modal === 'delete'){
      var pd = getPatient(state.activeId);
      if(!pd){ closeModal(); return; }
      html = deleteModalHtml(pd);
    } else if(state.modal === 'weekEdit'){
      var pw = getPatient(state.activeId);
      if(!pw){ closeModal(); return; }
      html = weekEditModalHtml(pw, state.weekEditMonthKey, state.weekEditIndex);
    } else if(state.modal === 'settings'){
      html = settingsModalHtml();
    } else if(state.modal === 'lead'){
      html = leadModalHtml();
      if(!html){ closeModal(); return; }
    } else if(state.modal === 'parceria'){
      html = parceriaModalHtml();
      if(!html){ closeModal(); return; }
    } else if(state.modal === 'indicacao'){
      html = indicacaoModalHtml();
    } else if(state.modal === 'comunidade'){
      html = comunidadeModalHtml();
    }
    root.innerHTML = '<div class="modal-overlay" id="modalOverlay">'+html+'</div>';

    var overlay = document.getElementById('modalOverlay');
    overlay.addEventListener('click', function(e){
      if(e.target !== overlay) return;
      if(state.modal === 'add' || state.modal === 'edit' || state.modal === 'weekEdit'){
        if(confirm('Tem certeza que deseja sair? As informações preenchidas neste cadastro serão perdidas.')){
          closeModal();
        }
      } else {
        closeModal();
      }
    });
    var closeBtn = document.getElementById('modalCloseBtn');
    if(closeBtn) closeBtn.addEventListener('click', function(){ closeModal(); });
    var cancelBtn = document.getElementById('formCancelBtn');
    if(cancelBtn) cancelBtn.addEventListener('click', function(){ closeModal(); });
    var backToProfileBtn = document.getElementById('formBackToProfileBtn');
    if(backToProfileBtn){
      backToProfileBtn.addEventListener('click', function(){
        if(confirm('Voltar ao perfil sem salvar? As alterações feitas aqui serão perdidas.')){
          openProfileModal(state.activeId);
        }
      });
    }

    if(state.modal === 'profile'){
      document.getElementById('profileCloseBtn2').addEventListener('click', function(){ closeModal(); });
      document.getElementById('profileEditBtn').addEventListener('click', function(){
        var id = state.activeId;
        openFormModal('edit', id);
      });
      var copyEmailBtn = document.getElementById('copyEmailBtn');
      if(copyEmailBtn){
        copyEmailBtn.addEventListener('click', function(){
          var p = getPatient(state.activeId);
          if(!p || !p.email) return;
          navigator.clipboard.writeText(p.email).then(function(){
            showToast('E-mail copiado.', 'success');
          }).catch(function(){
            showToast('Não foi possível copiar o e-mail.', 'danger');
          });
        });
      }
      document.getElementById('profileCompetenciaSelect').addEventListener('change', function(){
        state.competencia = this.value;
        renderModal();
      });
      var jornadaToggles = document.querySelectorAll('[data-jornada-task-toggle]');
      for(var jt=0;jt<jornadaToggles.length;jt++){
        jornadaToggles[jt].addEventListener('change', function(){
          setJornadaTaskDone(state.activeId, parseInt(this.getAttribute('data-jornada-task-toggle'),10), this.checked);
          renderModal();
        });
      }
      var jornadaObsInputs = document.querySelectorAll('[data-jornada-task-obs]');
      for(var jo=0;jo<jornadaObsInputs.length;jo++){
        jornadaObsInputs[jo].addEventListener('blur', function(){
          var p = getPatient(state.activeId);
          var taskId = parseInt(this.getAttribute('data-jornada-task-obs'),10);
          var task = p.jornada.tarefas.filter(function(t){ return t.id === taskId; })[0];
          if(task){ task.observacao = this.value.trim(); savePatients(); }
        });
      }
      var jornadaNomeInputs = document.querySelectorAll('[data-jornada-task-nome]');
      for(var jn=0;jn<jornadaNomeInputs.length;jn++){
        jornadaNomeInputs[jn].addEventListener('blur', function(){
          updatePatientTask(state.activeId, parseInt(this.getAttribute('data-jornada-task-nome'),10), 'nome', this.value.trim());
        });
      }
      var jornadaRemoveBtns = document.querySelectorAll('[data-jornada-task-remove]');
      for(var jr=0;jr<jornadaRemoveBtns.length;jr++){
        jornadaRemoveBtns[jr].addEventListener('click', function(){
          removePatientTask(state.activeId, parseInt(this.getAttribute('data-jornada-task-remove'),10));
          renderModal();
        });
      }
      var jornadaAddBtns = document.querySelectorAll('[data-jornada-task-add]');
      for(var ja=0;ja<jornadaAddBtns.length;ja++){
        jornadaAddBtns[ja].addEventListener('click', function(){
          addPatientTask(state.activeId, parseInt(this.getAttribute('data-jornada-task-add'),10));
          renderModal();
        });
      }
      document.querySelectorAll('.jornada-fase-tasks').forEach(function(groupEl){
        bindDragReorder(groupEl, '.jornada-task', '.jornada-fase-tasks',
          function(item){ return item.getAttribute('data-jornada-drag-key'); },
          function(orderedKeys){
            var tids = orderedKeys.map(function(k){ return parseInt(k,10); });
            reorderPatientTasks(state.activeId, tids);
            renderModal();
          });
      });
      var jornadaRemoveBtn = document.getElementById('jornadaRemoveBtn');
      if(jornadaRemoveBtn){
        jornadaRemoveBtn.addEventListener('click', function(){
          if(confirm('Remover a jornada desse paciente? Todo o progresso (marcos concluídos, personalizações) será perdido. Dá pra escolher uma jornada nova depois, editando o cadastro.')){
            removePatientJornada(state.activeId);
            renderModal();
            showToast('Jornada removida.', 'success');
          }
        });
      }
      var fichaAddBtn = document.getElementById('fichaTreinoAddBtn');
      if(fichaAddBtn){
        fichaAddBtn.addEventListener('click', function(){
          addFichaTreino(state.activeId);
          refreshFichaTreinoList();
        });
      }
      bindFichaTreinoListEvents();
      var fichaDietaAddBtn = document.getElementById('fichaDietaAddBtn');
      if(fichaDietaAddBtn){
        fichaDietaAddBtn.addEventListener('click', function(){
          addFichaDieta(state.activeId);
          refreshFichaDietaList();
        });
      }
      bindFichaDietaListEvents();
    }
    if(state.modal === 'add' || state.modal === 'edit'){
      var editingPatient = state.modal === 'edit' ? getPatient(state.activeId) : null;
      document.getElementById('f_competencia').addEventListener('change', function(){
        var newKey = this.value;
        var weekly = getMonthData(editingPatient, newKey);
        document.getElementById('weeklyFieldsContainer').innerHTML = weeklyFieldsHtml(newKey, weekly);
        bindMetaTypeToggle();
        bindObsCheckinAutosize();
      });
      bindMetaTypeToggle();
      bindObsCheckinAutosize();
      document.getElementById('f_servico').addEventListener('change', function(){
        var treinoWrap = document.getElementById('fichaTreinoFormWrap');
        treinoWrap.style.display = temServicoTreino({ servico: this.value }) ? '' : 'none';
        var dietaWrap = document.getElementById('fichaDietaFormWrap');
        dietaWrap.style.display = temServicoDieta({ servico: this.value }) ? '' : 'none';
        applyQuinzenalToForm();
      });
      var f_plano_el = document.getElementById('f_plano');
      if(f_plano_el) f_plano_el.addEventListener('change', applyQuinzenalToForm);
      applyQuinzenalToForm();
      var fichaTreinoFormAddBtn = document.getElementById('fichaTreinoFormAddBtn');
      if(fichaTreinoFormAddBtn){
        fichaTreinoFormAddBtn.addEventListener('click', function(){
          var maxId = state.formDraftFichas.reduce(function(m,f){ return Math.max(m, f.id); }, -1);
          var id = maxId + 1;
          state.formDraftFichas.push({ id: id, dataPassado: todayISODate(), dataVencimento: '', expectativa: '', volumePorGrupo: {} });
          state.formDraftFichaOpen[id] = true;
          refreshFichaTreinoDraftList();
        });
      }
      bindFichaTreinoDraftListEvents();
      var fichaDietaFormAddBtn = document.getElementById('fichaDietaFormAddBtn');
      if(fichaDietaFormAddBtn){
        fichaDietaFormAddBtn.addEventListener('click', function(){
          var maxId = state.formDraftFichasDieta.reduce(function(m,f){ return Math.max(m, f.id); }, -1);
          var id = maxId + 1;
          state.formDraftFichasDieta.push({ id: id, dataPassado: todayISODate(), expectativa: '', calorias: '', proteinas: '', carboidratos: '', gorduras: '' });
          state.formDraftFichaDietaOpen[id] = true;
          refreshFichaDietaDraftList();
        });
      }
      bindFichaDietaDraftListEvents();
      var jornadaModeloSel = document.getElementById('f_jornada_modelo');
      if(jornadaModeloSel){
        jornadaModeloSel.addEventListener('change', function(){
          document.getElementById('f_jornada_inicio').disabled = this.value === '';
        });
      }
      document.getElementById('formSaveBtn').addEventListener('click', function(){
        var result = collectFormData();
        if(!result) return;
        var wasAdd = state.modal === 'add';
        var patient;
        if(wasAdd){
          patient = result.core;
          patient.id = nextId();
          patient.createdAt = nextCreatedAt();
          patient.createdDate = todayISODate();
          patient.meses = {};
          mergeWeeklyIntoMonth(patient, result.monthKey, result.weekly);
          maybeStartJornada(patient, result.jornadaInicio, result.jornadaModelo);
          state.patients.push(patient);
        } else {
          var idx = -1;
          for(var i=0;i<state.patients.length;i++){
            if(state.patients[i].id === state.activeId){ idx = i; break; }
          }
          if(idx !== -1){
            patient = state.patients[idx];
            Object.assign(patient, result.core);
            if(!patient.meses) patient.meses = {};
            mergeWeeklyIntoMonth(patient, result.monthKey, result.weekly);
            maybeStartJornada(patient, result.jornadaInicio, result.jornadaModelo);
          }
        }
        state.competencia = result.monthKey;
        savePatients();
        closeModal();
        render();
        showToast(wasAdd ? 'Paciente adicionado com sucesso.' : 'Paciente atualizado com sucesso.', 'success');
      });
      var formDeleteBtn = document.getElementById('formDeletePatientBtn');
      if(formDeleteBtn){
        formDeleteBtn.addEventListener('click', function(){
          openDeleteModal(state.activeId);
        });
      }
    }
    if(state.modal === 'delete'){
      document.getElementById('confirmDeleteBtn').addEventListener('click', function(){
        var removedName = getPatient(state.activeId) ? getPatient(state.activeId).nome : '';
        state.patients = state.patients.filter(function(p){ return p.id !== state.activeId; });
        savePatients();
        closeModal();
        render();
        showToast('Paciente "' + removedName + '" excluído.', 'danger');
      });
    }
    if(state.modal === 'weekEdit'){
      document.getElementById('weekEditSaveBtn').addEventListener('click', function(){
        var engEl = document.getElementById('f_week_eng');
        var engRaw = engEl ? engEl.value : '';
        var engVal = engRaw === '' ? null : clamp(parseInt(engRaw,10), 0, 10);
        var chkRaw = document.getElementById('f_week_chk').value;
        var chkVal = chkRaw === 'sim' ? true : chkRaw === 'nao' ? false : null;
        var obsVal = document.getElementById('f_week_obs').value.trim();
        updateWeekEntry(state.activeId, state.weekEditMonthKey, state.weekEditIndex, engVal, chkVal, obsVal);
        closeModal();
        render();
        showToast('Semana atualizada.', 'success');
      });
    }
    if(state.modal === 'lead'){
      bindLeadModalEvents();
    }
    if(state.modal === 'parceria'){
      bindParceriaModalEvents();
    }
    if(state.modal === 'indicacao'){
      bindIndicacaoModalEvents();
    }
    if(state.modal === 'comunidade'){
      bindComunidadeModalEvents();
    }
    if(state.modal === 'settings'){
      document.querySelectorAll('[data-settings-tab]').forEach(function(btn){
        btn.addEventListener('click', function(){
          state.settingsTab = this.getAttribute('data-settings-tab');
          state.securityError = null;
          renderModal();
        });
      });
      var passwordResetBtn = document.getElementById('passwordResetBtn');
      if(passwordResetBtn){
        passwordResetBtn.addEventListener('click', function(){
          state.securityError = null;
          var email = mfa.auth.currentUser ? mfa.auth.currentUser.email : null;
          if(email !== SENHA_EMAIL_PERMITIDO){
            state.securityError = 'E-mail não autorizado a trocar a senha.';
            renderModal();
            return;
          }
          mfa.sendPasswordResetEmail(mfa.auth, email).then(function(){
            state.passwordResetSent = true;
            renderModal();
          }).catch(function(err){
            state.securityError = 'Não foi possível enviar: ' + err.message;
            renderModal();
          });
        });
      }
      var sendVerifyBtn = document.getElementById('securitySendVerifyBtn');
      if(sendVerifyBtn){
        sendVerifyBtn.addEventListener('click', function(){
          state.securityError = null;
          mfa.sendEmailVerification(mfa.auth.currentUser).then(function(){
            state.securityEmailSent = true;
            renderModal();
          }).catch(function(err){
            state.securityError = 'Não foi possível enviar o e-mail: ' + err.message;
            renderModal();
          });
        });
      }
      var checkVerifiedBtn = document.getElementById('securityCheckVerifiedBtn');
      if(checkVerifiedBtn){
        checkVerifiedBtn.addEventListener('click', function(){
          mfa.auth.currentUser.reload().then(function(){
            renderModal();
          });
        });
      }
      var startTotpBtn = document.getElementById('securityStartTotpBtn');
      if(startTotpBtn){
        startTotpBtn.addEventListener('click', function(){
          startTotpBtn.disabled = true;
          state.securityError = null;
          mfa.multiFactor(mfa.auth.currentUser).getSession().then(function(session){
            return mfa.TotpMultiFactorGenerator.generateSecret(session);
          }).then(function(secret){
            pendingTotpSecret = secret;
            state.mfaEnrollStep = 'confirm';
            renderModal();
          }).catch(function(err){
            state.securityError = 'Não foi possível iniciar: ' + err.message;
            renderModal();
          });
        });
      }
      var confirmTotpBtn = document.getElementById('securityConfirmTotpBtn');
      if(confirmTotpBtn){
        confirmTotpBtn.addEventListener('click', function(){
          var code = (document.getElementById('securityTotpCode').value || '').trim();
          if(!/^\d{6}$/.test(code)){
            state.securityError = 'Digite os 6 dígitos do código.';
            renderModal();
            return;
          }
          state.securityError = null;
          var assertion = mfa.TotpMultiFactorGenerator.assertionForEnrollment(pendingTotpSecret, code);
          mfa.multiFactor(mfa.auth.currentUser).enroll(assertion, 'Google Authenticator').then(function(){
            pendingTotpSecret = null;
            state.mfaEnrollStep = 'idle';
            renderModal();
            showToast('Autenticação de dois fatores ativada.', 'success');
          }).catch(function(){
            state.securityError = 'Código inválido, confira o número atual no app e tente de novo.';
            renderModal();
          });
        });
      }
      var cancelTotpBtn = document.getElementById('securityCancelTotpBtn');
      if(cancelTotpBtn){
        cancelTotpBtn.addEventListener('click', function(){
          pendingTotpSecret = null;
          state.mfaEnrollStep = 'idle';
          state.securityError = null;
          renderModal();
        });
      }
      var removeMfaBtn = document.getElementById('securityRemoveMfaBtn');
      if(removeMfaBtn){
        removeMfaBtn.addEventListener('click', function(){
          if(!confirm('Desativar a autenticação de dois fatores? Você vai poder entrar só com e-mail e senha.')) return;
          var factors = mfa.multiFactor(mfa.auth.currentUser).enrolledFactors;
          if(!factors.length) return;
          mfa.multiFactor(mfa.auth.currentUser).unenroll(factors[0]).then(function(){
            renderModal();
            showToast('Autenticação de dois fatores desativada.', 'success');
          }).catch(function(err){
            state.securityError = 'Não foi possível desativar: ' + err.message;
            renderModal();
          });
        });
      }
    }
  }

  document.addEventListener('click', function(e){
    if(e.target.closest('.filter-menu') || e.target.closest('[data-filter-toggle]')) return;
    if(!document.querySelector('.filter-menu.open')) return;
    document.querySelectorAll('.filter-menu.open').forEach(function(m){ m.classList.remove('open'); });
    document.querySelectorAll('.card.menu-open').forEach(function(c){ c.classList.remove('menu-open'); });
  });
  document.addEventListener('click', jornadaCalendarGlobalClick);
  document.addEventListener('focusout', jornadaCalendarGlobalFocusOut);

  /* No celular as tabelas viram cartoes e o cabecalho some, entao copiamos o nome
     da coluna pra cada celula (data-label). O CSS so mostra isso em telas pequenas. */
  function applyMobileTableLabels(){
    document.querySelectorAll('table:not(.peso-history-table)').forEach(function(t){
      var ths = Array.prototype.filter.call(t.querySelectorAll('thead th'), function(th){
        return th.closest('table') === t; // ignora cabecalho de tabela aninhada
      });
      if(!ths.length) return;
      var labels = ths.map(function(th){
        // o th carrega o menu de filtro inteiro dentro dele; so queremos o nome da coluna
        var c = th.cloneNode(true);
        c.querySelectorAll('.filter-menu').forEach(function(e){ e.remove(); });
        return c.textContent.replace(/[▲▼▴▾⇅]/g,'').replace(/\s+/g,' ').trim();
      });
      t.querySelectorAll('tbody tr').forEach(function(tr){
        if(tr.closest('table') !== t) return; // linha de tabela aninhada (ex: historico de peso)
        var tds = tr.children;
        if(tds.length < 2) return;
        // celulas com colspan (ex: semanas mescladas de quem e so Treino) avancam o
        // ponteiro do cabecalho mais de 1 posicao, senao as colunas seguintes (Media,
        // Observacoes) pegariam o rotulo errado. A propria celula mesclada ja mostra
        // seu rotulo por dentro, entao nao precisa repetir com data-label.
        var labelIdx = 0;
        for(var i=0;i<tds.length;i++){
          var span = tds[i].colSpan || 1;
          if(span === 1 && labels[labelIdx]) tds[i].setAttribute('data-label', labels[labelIdx]);
          else tds[i].removeAttribute('data-label');
          labelIdx += span;
        }
      });
    });
  }
  var mobileLabelTimer = null;
  var mobileLabelObserver = new MutationObserver(function(){
    clearTimeout(mobileLabelTimer);
    mobileLabelTimer = setTimeout(applyMobileTableLabels, 40);
  });
  mobileLabelObserver.observe(document.getElementById('app'), { childList:true, subtree:true });
  mobileLabelObserver.observe(document.getElementById('modal-root'), { childList:true, subtree:true });

  /* ================= INIT ================= */
  function init(){
    state.competencia = getCurrentMonthKey();
    state.booting = true;
    render();
    whenMfaReady(function(sdk){
      mfa = sdk;
      mfa.onAuthStateChanged(mfa.auth, function(user){
        if(user){
          state.loggedIn = true;
          loadAllDataAndRender();
        } else {
          state.loggedIn = false;
          state.booting = false;
          render();
        }
      });
    });
  }
  init();
})();
</script>
